name: MacPro
options:
  bundleIdPrefix: local.macpro
  deploymentTarget: { iOS: "26.0" }
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MacPro:
    type: application
    platform: iOS
    sources: [Sources, Shared, Assets.xcassets]
    dependencies:
      - target: MacProWidget
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mac Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: MacProInfo.plist
      properties:
        CFBundleDisplayName: Mac Pro
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  MacProWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Shared/Gauges.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macpro.MacPro.Widget
        INFOPLIST_KEY_CFBundleDisplayName: Mac Pro Status
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Mac Pro Status
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  Chumby:
    type: application
    platform: iOS
    sources: [ChumbyApp/Sources, Shared, ChumbyApp/Assets.xcassets]
    dependencies:
      - target: ChumbyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macpro.Chumby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ChumbyApp/Info.plist
      properties:
        CFBundleDisplayName: Chumby
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Chumby connects to your Chumby on your home network.
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  ChumbyWidget:
    type: app-extension
    platform: iOS
    sources:
      - ChumbyWidget
      - path: ChumbyApp/Sources/ChumbyAPI.swift
      - path: ChumbyApp/Sources/ChumbyArt.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macpro.Chumby.Widget
    info:
      path: ChumbyWidget/Info.plist
      properties:
        CFBundleDisplayName: Chumby Widgets
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GalleryMac:
    type: application
    platform: iOS
    sources:
      - Widget/MacProWidget.swift
      - Widget/Assets.xcassets
      - Shared/Gauges.swift
      - ci/gallery-mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macpro.GalleryMac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GALLERY
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  GalleryChumby:
    type: application
    platform: iOS
    sources:
      - ChumbyWidget/ChumbyWidgets.swift
      - ChumbyApp/Sources/ChumbyAPI.swift
      - ChumbyApp/Sources/ChumbyArt.swift
      - ci/gallery-chumby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.macpro.GalleryChumby
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GALLERY
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
