name: TV overhaul shots
# The TV app's overhaul (branch tv-overhaul only): four tabs and the lip in every posture, and films of the flick (thrown
# and put back), a fling to the foot of every tab, push and Back, the tab changes, and the episode list pulled down
# through a row and swiped sideways. Published to the tv-overhaul release; main's releases are untouched.
on:
  push:
    branches: [tv-overhaul]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 100
    # One job per posture, side by side: in one job the run ended at its time limit before the folded phone was reached.
    strategy:
      fail-fast: false
      matrix:
        posture: [portrait, flat, folded]
    concurrency:
      group: tv-overhaul-${{ matrix.posture }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme TV -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Build errors, if any
        if: failure()
        run: |
          grep -E "error:" dist/build.log | sort -u | head -60 || true
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 85
        run: |
          set +e
          exec > >(tee dist/sim-${{ matrix.posture }}.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/TV.app
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          rm -f /tmp/tv-hitches.log
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9002
          APP=local.macpro.TV
          D=/tmp/dh/.build/release/devicehubctl
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10

          # One shot: name, display, wait, address, then the app's own arguments. Its size in pixels is logged, to set
          # against his phone's (open flat is 951x669 pt, 2854x2008 px).
          shot() {
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" $APP -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name.png
            xcrun simctl terminate "$DEVICE" $APP || true
            echo "tv-$name $(sips -g pixelWidth -g pixelHeight dist/tv-$name.png 2>/dev/null | awk '/pixel/ {printf "%s ", $2}')" >> dist/tv-sizes-${{ matrix.posture }}.log
          }
          rec() { xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$2 --force dist/tv-$1.mp4 > /dev/null 2>&1 & REC=$!; sleep 3; }
          endfilm() {
            local name=$1 display=$2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $APP || true
            local c; c=$(xcrun simctl get_app_container "$DEVICE" $APP data 2>/dev/null)
            [ -n "$c" ] && [ -f "$c/Library/Caches/hand-log.txt" ] && mv "$c/Library/Caches/hand-log.txt" dist/tv-$name-hand.log
            [ -n "$c" ] && [ -f "$c/Library/Caches/swipe-log.txt" ] && mv "$c/Library/Caches/swipe-log.txt" dist/tv-$name-swipe.log
            if [ "$(stat -f %z dist/tv-$name.mp4 2>/dev/null || echo 0)" -lt 20000 ]; then echo "film $name empty"; fi
          }
          # Where the app says a control is (what=NAME&x=&y= in the stand-in Mac's log), as "x y".
          spot() { local at; at=$(grep -o "what=$1&x=[0-9.]*&y=[0-9.]*" /tmp/tv-home-applied.log 2>/dev/null | tail -1); [ -z "$at" ] && return 1; local x=${at#*x=}; x=${x%%&*}; echo "$x ${at##*y=}"; }

          # Every tab, and the pages behind the lip's gear, in one posture (display, suffix).
          tabs() {
            local d=$1 x=$2 T S
            for T in 3 0 2 6; do shot tab$T$x $d 8 $M -tab $T; done
            # Second arrival equals the first: the same tabs again on a live scene.
            for T in 3 0 2 6; do shot tab$T-again$x $d 8 $M -tab $T; done
            shot settings$x $d 9 $M -tab 9
            shot box$x $d 9 $M -tab 5
            for S in ridle repisode rfilm ryoutube roffline rasleep; do shot remote-$S$x $d 8 $M/$S -tab 0; done
            for S in rmint rfilm repisode; do shot music-$S$x $d 8 $M/$S -tab 2; done
            # One truth: with a film on, the lip on Watch and Search says what the Remote and Music say.
            shot lip-rfilm-watch$x $d 8 $M/rfilm -tab 3
            shot lip-rfilm-search$x $d 8 $M/rfilm -tab 6
            # A film's page and a show's: the poster as the card, the streams under it.
            curl -s $M/fnormal/reset > /dev/null; shot title-film$x $d 12 $M/fnormal -tab 3 -pose streams
            curl -s $M/real/reset > /dev/null; shot title-show$x $d 14 $M/real -tab 3 -pose realseries
          }
          # A fling to the foot of a tab and back to its top: six quick pulls up, one slow, then the same down.
          fling() {
            local name=$1 d=$2 address=$3; shift 3
            local i
            rec $name $d
            xcrun simctl launch "$DEVICE" $APP -address $address -swipeLog YES "$@"
            sleep 10
            for i in 1 2 3 4 5; do $D "$DEVICE" drag 0.5 0.8 0.5 0.25 0.12 || echo "drag failed"; sleep 1.4; done
            $D "$DEVICE" drag 0.5 0.8 0.5 0.25 0.9 || true; sleep 2.5
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/tv-$name-foot.png
            for i in 1 2 3 4 5 6; do $D "$DEVICE" drag 0.5 0.25 0.5 0.8 0.12 || true; sleep 1.4; done
            $D "$DEVICE" drag 0.5 0.25 0.5 0.8 0.9 || true; sleep 2.5
            endfilm $name $d
          }
          flings() { local d=$1 x=$2 T; for T in 3 0 2 6; do fling flingend-tab$T$x $d $M -tab $T; done; fling flingend-live$x $d $M/live -tab 3; fling flingend-settings$x $d $M -tab 9; }
          # The flick, by a real touch on the card of a film's page: thrown (a fast pull to the top), put back (a slow
          # short pull, let go under the line), then carried up over the line slowly and let go there (thrown from rest).
          flick() {
            local name=$1 d=$2 kind=$3
            rm -f /tmp/tv-home-applied.log
            curl -s $M/fnormal/reset > /dev/null
            rec $name $d
            xcrun simctl launch "$DEVICE" $APP -address $M/fnormal -tab 3 -pose streams -handLog YES
            # The card says where it is once its page is up: waited for, not guessed (two of six films had no card at 13 s).
            local at="" n; for n in $(seq 1 30); do sleep 1; at=$(spot card) && [ -n "$at" ] && break; done; sleep 3; at=$(spot card)
            if [ -z "$at" ]; then echo "no card position for $name"; else
              set -- $at; local x=$1 y=$2
              case $kind in
                throw)  $D "$DEVICE" drag $x $y $x 0.06 0.16 || echo "drag failed";;
                cancel) $D "$DEVICE" drag $x $y $(echo "$x + 0.08" | bc -l) $(echo "$y - 0.10" | bc -l) 1.2 || echo "drag failed";;
                carry)  $D "$DEVICE" drag $x $y $(echo "$x - 0.10" | bc -l) $(echo "$y - 0.42" | bc -l) 2.5 || echo "drag failed";;
              esac
            fi
            sleep 8
            endfilm $name $d
            grep -E 'play-stream|prepare|/api/tv/(send|key)' /tmp/tv-home-applied.log > dist/tv-$name-bridge.log 2>/dev/null || echo "no bridge lines" > dist/tv-$name-bridge.log
            cp /tmp/tv-home-applied.log dist/tv-$name-applied.log 2>/dev/null || true
          }
          flicks() { local d=$1 x=$2; flick flick-throw$x $d throw; flick flick-cancel$x $d cancel; flick flick-carry$x $d carry; }
          # Push and Back: a title's page opened, then the system's Back by the edge swipe; and Settings the same.
          back() {
            local name=$1 d=$2 wait=$3 address=$4; shift 4
            rec $name $d
            xcrun simctl launch "$DEVICE" $APP -address $address -swipeLog YES "$@"
            sleep $wait
            $D "$DEVICE" drag 0.01 0.5 0.7 0.5 1.2 || echo "back drag failed"
            sleep 3
            endfilm $name $d
          }
          backs() { local d=$1 x=$2; curl -s $M/fnormal/reset > /dev/null; back back-title$x $d 13 $M/fnormal -tab 3 -pose streams; back back-settings$x $d 9 $M -tab 9; }
          # The tab changes, in turn, on a live scene.
          tour() {
            local name=$1 d=$2
            rec $name $d
            xcrun simctl launch "$DEVICE" $APP -address $M/live -tab 3 -pose tour -swipeLog YES
            sleep 22
            endfilm $name $d
          }
          # The episode list: pulled up through its rows starting a little off vertical (about 15 and 25 degrees), then a
          # level swipe across a row (nothing may move sideways), then pulled back down.
          episodes() {
            local name=$1 d=$2 i
            curl -s $M/real/reset > /dev/null
            rec $name $d
            xcrun simctl launch "$DEVICE" $APP -address $M/real -tab 3 -pose realseries -handLog YES
            sleep 15
            for i in 1 2 3; do $D "$DEVICE" drag 0.50 0.90 0.55 0.70 0.25 || echo "drag failed"; sleep 1.5; done
            for i in 1 2; do $D "$DEVICE" drag 0.45 0.90 0.54 0.70 0.25 || true; sleep 1.5; done
            $D "$DEVICE" drag 0.50 0.90 0.50 0.72 1.0 || true; sleep 2
            $D "$DEVICE" drag 0.75 0.82 0.25 0.82 0.3 || true; sleep 2
            $D "$DEVICE" drag 0.80 0.70 0.30 0.72 0.3 || true; sleep 2
            for i in 1 2 3; do $D "$DEVICE" drag 0.50 0.72 0.46 0.90 0.25 || true; sleep 1.5; done
            endfilm $name $d
          }

          # Open portrait first (the posture he holds), then open flat (on its side: where the rail made a More), then
          # folded, then folded on its side.
          P=${{ matrix.posture }}
          if [ $P = portrait ]; then
            $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
            $D "$DEVICE" rotate 1; sleep 5
            tabs 3 -portrait
            flicks 3 -portrait
            flings 3 -portrait
            backs 3 -portrait
            tour tour-portrait 3
            episodes episodes-portrait 3
          elif [ $P = flat ]; then
            $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
            $D "$DEVICE" rotate 3 || true; sleep 5
            tabs 3 -flat
            flicks 3 -flat
            flings 3 -flat
            backs 3 -flat
            tour tour-flat 3
            episodes episodes-flat 3
          else
            $D "$DEVICE" pose closed || true; sleep 5
            $D "$DEVICE" rotate 1 || true; sleep 3
            tabs 1 ""
            flicks 1 ""
            flings 1 ""
            backs 1 ""
            tour tour 1
            episodes episodes 1
            $D "$DEVICE" rotate 3 || true; sleep 4
            for T in 3 0 2 6; do shot tab$T-fland 1 8 $M -tab $T; done
            curl -s $M/fnormal/reset > /dev/null; shot title-film-fland 1 12 $M/fnormal -tab 3 -pose streams
            flick flick-throw-fland 1 throw
            $D "$DEVICE" rotate 1 || true; sleep 4
            # The turn between postures, on Watch.
            for pass in outer inner; do
              display=1; [ $pass = inner ] && display=3
              rec posture-watch-$pass $display
              xcrun simctl launch "$DEVICE" $APP -address $M -tab 3
              sleep 8
              $D "$DEVICE" pose open; sleep 6; $D "$DEVICE" rotate 3; sleep 6; $D "$DEVICE" rotate 1; sleep 6; $D "$DEVICE" pose closed; sleep 6
              endfilm posture-watch-$pass $display
            done
          fi
          cp /tmp/tv-hitches.log dist/tv-hitches-$P.log 2>/dev/null || echo "no hitches reported" > dist/tv-hitches-$P.log
          cp /tmp/tv-home-applied.log dist/tv-applied-$P.log 2>/dev/null || true
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=${{ matrix.posture }}
          mv dist/build.log dist/build-$P.log 2>/dev/null || true
          (cd dist && zip -qr ../shots-$P.zip . -i '*.png' || zip -q ../shots-$P.zip /dev/null)
          (cd dist && zip -qr0 ../films-$P.zip . -i '*.mp4' || zip -q ../films-$P.zip /dev/null)
          (cd dist && zip -qr ../logs-$P.zip . -i '*.log' || zip -q ../logs-$P.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status-$P.txt
          gh release view tv-overhaul >/dev/null 2>&1 || gh release create tv-overhaul --prerelease --title "TV overhaul shots" --notes "The TV app's overhaul: shots, films and logs from branch tv-overhaul."
          for f in shots-$P.zip films-$P.zip logs-$P.zip status-$P.txt; do
            for i in 1 2 3; do gh release upload tv-overhaul "$f" --clobber && break; sleep 15; done
          done
