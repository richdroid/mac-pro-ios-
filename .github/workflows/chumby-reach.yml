name: Chumby reach (branch)
# A working branch's own short run: the Chumby app opened while the route to it fails (2026-11-11, "i hate opening the
# app and getting an its offline message"). Films of opening with the first requests failing then recovering (blip),
# never answering (gone), and the Mac saying the Chumby doesn't (dead); stills of the settled states. Folded and open in
# portrait. Only for pushes to chumby-reach; published to the chumby-reach-shots release. The full build is untouched.
on:
  push:
    branches: [chumby-reach]
permissions:
  contents: write
concurrency:
  group: chumby-reach
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Chumby launch sea and wordmark
        run: swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme Chumby -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          node ci/mock-chumby.js &
          sleep 2
          # A first launch that reads everything, so later launches open with kept readings as his phone does.
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address http://127.0.0.1:9000 -tab 0; sleep 10
          xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          film() { # display, file name, seconds, launch suffix, launch args... ; a still at the end too
            local d=$1 name=$2 secs=$3 sfx=$4; shift 4
            sleep 61                # the mock starts a scene's clock afresh after a quiet minute
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address http://127.0.0.1:9000/$sfx "$@"
            sleep $secs
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name-end.png
            kill -INT $REC; wait $REC; echo "film $name exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          set_() { # display, suffix
            local d=$1 x=$2
            film $d open-blip-home$x 22 blip -tab 0
            film $d open-blip-alarms$x 22 blip -tab 2
            film $d open-gone-home$x 40 gone -tab 0
            film $d open-gone-alarms$x 40 gone -tab 2
            film $d open-dead-home$x 40 dead -tab 0
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          set_ 1 ""
          $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          set_ 3 -portrait
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips dist/crashes/ 2>/dev/null || true
      - name: Publish the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' '*.ips' '*.mp4' || zip -q ../shots.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view chumby-reach-shots >/dev/null 2>&1 || gh release create chumby-reach-shots --target chumby-reach --prerelease --title "Chumby reach (branch)" --notes "Branch-only shots."
          for f in shots.zip status.txt; do
            for i in 1 2 3 4; do gh release upload chumby-reach-shots "$f" --clobber && break; echo "upload of $f failed, try $i"; sleep 20; done
          done
