name: Mac Pro navigation check (mp-nav-1126)
# Branch-only check for mp-nav-1126 (Richard, 2026-11-26, TestFlight 317 open flat: "the sizing swiping issue and the side
# bar not encompassing everything"). Folded, open upright and open flat: every Mac Pro tab; each of Status's detail pages
# pushed, swiped back from the edge (a slow partial swipe let go, then a slow full one, a still taken mid-swipe) and
# taken back with Back tapped; an animated push and pop; the tabs with the island taken (the TV app's Live Activity, as
# his recording's island was); a fold-unfold-turn film. Chumby and Mint Remote, which share the shell: every tab and a
# back film per posture. Published to the mp-nav-shots prerelease. Never runs on main.
on:
  push:
    branches: [mp-nav-1126]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-nav-shots
  cancel-in-progress: true
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the launch art
        run: |
          swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
          swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in MacPro Chumby TV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 92
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          P=build-sim/Build/Products/Debug-iphonesimulator
          for A in MacPro Chumby TV; do xcrun simctl install "$DEVICE" $P/$A.app; done
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          MAC=local.macpro.MacPro; CH=local.macpro.Chumby; TV=local.macpro.TV
          M=http://127.0.0.1:9002
          addr() { case $1 in $MAC) echo http://127.0.0.1:9001;; $CH) echo http://127.0.0.1:9000;; $TV) echo $M;; esac; }
          shot() { xcrun simctl io "$DEVICE" screenshot --display=$1 dist/$2.png > /dev/null 2>&1; }
          backlog() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) && cat "$c/Library/Caches/back-at.txt" 2>/dev/null; }
          backat() { local a; a=$(backlog $1 | head -1); case "$a" in none|"") echo "$FALLBACK";; *) echo "$a";; esac; }
          swipelog() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) || return 0; [ -f "$c/Library/Caches/swipe-log.txt" ] && mv "$c/Library/Caches/swipe-log.txt" dist/$2-swipe.log; }
          # Every tab of an app: bundle, display, suffix, tabs, then extra arguments.
          tabshots() {
            local b=$1 d=$2 x=$3 tabs=$4 n; shift 4
            case $b in $MAC) n=macpro;; $CH) n=chumby;; $TV) n=tv;; esac
            for T in $tabs; do
              xcrun simctl launch "$DEVICE" $b -address $(addr $b) -tab $T "$@" > /dev/null
              sleep 7
              shot $d $n-tab$T$x
              xcrun simctl terminate "$DEVICE" $b || true
            done
          }
          # A pushed page taken back, filmed: name, display, bundle, then the app's arguments that open the page.
          # 1. a slow partial edge swipe let go at a third (the page must spring back whole, as under his finger);
          # 2. a slow full swipe back, a still taken half-way; 3. relaunched on the page and Back tapped where iOS put it.
          navfilm() {
            local n=$1 d=$2 b=$3 at; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 10
            shot $d $n-1page
            echo "$n partial at $(date +%s.%N | cut -c1-14)"
            $D "$DEVICE" drag 0.01 ${DRAGY:-0.5} 0.33 ${DRAGY:-0.5} 2.0 & DR=$!
            sleep 1.6; shot $d $n-2partial-mid; wait $DR
            sleep 2; shot $d $n-3partial-after
            echo "$n swipe at $(date +%s.%N | cut -c1-14)"
            $D "$DEVICE" drag 0.01 ${DRAGY:-0.5} 0.92 ${DRAGY:-0.5} 2.6 & DR=$!
            # The tool finds the display before the finger lands (about a second), so stills at three moments.
            sleep 1.9; shot $d $n-4swipe-mid1; sleep 0.6; shot $d $n-4swipe-mid2; sleep 0.6; shot $d $n-4swipe-mid3; wait $DR
            sleep 2.5; shot $d $n-5swipe-after
            swipelog $b $n
            xcrun simctl terminate "$DEVICE" $b || true
            sleep 1
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 10
            at=$(backat $b); echo "$n tap Back at $at"
            $D "$DEVICE" touch $at 0.08 || echo "tap failed"
            sleep 0.25; shot $d $n-6tap-mid
            sleep 2.5; shot $d $n-7tap-after
            swipelog $b $n-tap
            backlog $b > dist/$n-back.log
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          # Status's detail pages, each pushed over Status and taken back (display, suffix).
          statuspages() {
            local d=$1 x=$2
            for h in cpu tx; do navfilm macpro-back-$h$x $d $MAC -tab 0 -openHistory $h; done
            navfilm macpro-back-processes$x $d $MAC -tab 0 -openProcesses cpu
            navfilm macpro-back-storage$x $d $MAC -tab 0 -pose storage
          }
          # A push and a pop as the app makes them (pushed at 12 s, closed at 18 s, pushed again at 19.5 s), animated.
          pushfilm() {
            local d=$1 x=$2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/macpro-pushpop$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -swipeLog YES -reopen YES -tab 0 -openHistory tx > /dev/null
            sleep 13.2; shot $d macpro-pushpop$x-pushmid
            sleep 10
            swipelog $MAC macpro-pushpop$x
            xcrun simctl terminate "$DEVICE" $MAC || true
            kill -INT $REC; wait $REC
          }
          # The island taken (the Chumby app's alarm Live Activity, which the simulator shows at the strip's top, as his
          # recording's island was taken), then the Mac Pro's tabs.
          islandshots() {
            local d=$1 x=$2
            xcrun simctl launch "$DEVICE" $CH -address $(addr $CH) -tab 0 > /dev/null
            sleep 9
            xcrun simctl terminate "$DEVICE" $CH || true
            for T in 0 6; do
              xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -tab $T > /dev/null
              sleep 7; shot $d macpro-island-tab$T$x
              xcrun simctl terminate "$DEVICE" $MAC || true
            done
            xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -tab 0 -openHistory tx > /dev/null
            sleep 11; shot $d macpro-island-upload$x
            xcrun simctl terminate "$DEVICE" $MAC || true
          }
          # Every tab tapped where the app or the system drew it (the -findBack log's "tab" lines), a shot after each; then
          # the first tab, a fling on its page and the next tab tapped 0.15 s after the finger lifts; then a drag that starts
          # on the strip (it must not scroll the page under it). Later list 11-24: "swipes register on rest of screen".
          # name, display, bundle, then the app's arguments.
          taptest() {
            local n=$1 d=$2 b=$3 i=0 label x y; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address ${TAPADDR:-$(addr $b)} -findBack YES "$@" > /dev/null
            sleep 10
            backlog $b | grep '^tab ' > dist/$n-tabs.log
            echo "$n: $(wc -l < dist/$n-tabs.log) tabs found"
            while read -r _ label x y; do
              i=$((i + 1)); $D "$DEVICE" touch $x $y 0.08 || echo "tap failed"; sleep 1.4; shot $d $n-$i-$label
            done < dist/$n-tabs.log
            local t1 t2; t1=$(sed -n 1p dist/$n-tabs.log | awk '{print $3" "$4}'); t2=$(sed -n 2p dist/$n-tabs.log | awk '{print $3" "$4}')
            if [ -n "$t2" ]; then
              $D "$DEVICE" touch $t1 0.08; sleep 1.5
              $D "$DEVICE" drag 0.35 0.75 0.35 0.3 0.12; sleep 0.15; $D "$DEVICE" touch $t2 0.08; sleep 1.4; shot $d $n-afterfling
              $D "$DEVICE" touch $t1 0.08; sleep 1.5; shot $d $n-stripdrag-before
              set -- $t1; $D "$DEVICE" drag $1 $2 $1 $(echo "$2 - 0.25" | bc -l) 0.3; sleep 1.2; shot $d $n-stripdrag-after
            fi
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          posture() {
            local d=$1 x=$2
            tabshots $MAC $d $x "0 1 2 4 5 6"
            # Apps with updates waiting: the number on its tab.
            tabshots $MAC $d $x-badge "1" -pose otaready
            statuspages $d $x
            pushfilm $d $x
            islandshots $d $x
            tabshots $CH $d $x "0 1 2 3 4"
            tabshots $TV $d $x "3 0 6"
            navfilm chumby-back$x $d $CH -tab 2 -pose calsettings
            navfilm tv-back$x $d $TV -tab 9 -pose tvsettings
            taptest macpro-taps$x $d $MAC -tab 0
            taptest chumby-taps$x $d $CH -tab 0
            taptest tv-taps$x $d $TV -tab 3
          }
          date
          # Folded and upright the swipe starts below the history chart: the drag tool rests the finger about a second
          # before it moves, which the chart takes as a hold to read a value (CI 5a48486); a real swipe moves at once.
          DRAGY=0.85; FALLBACK="0.895 0.292"; posture 1 -folded
          # Folded and turned on its side, each way (the strip stays with the camera's edge).
          $D "$DEVICE" rotate 3 || true; sleep 5
          tabshots $MAC 1 -foldedside3 "0 1 2 4 5 6"
          tabshots $CH 1 -foldedside3 "0 1 2 3 4"
          tabshots $TV 1 -foldedside3 "3 0 6"
          taptest macpro-taps-foldedside3 1 $MAC -tab 0
          $D "$DEVICE" rotate 4 || true; sleep 5
          tabshots $MAC 1 -foldedside4 "0 6"
          $D "$DEVICE" rotate 1 || true; sleep 5
          date
          # Folded on Dashboard, opened flat, turned upright, back flat, closed: the bar moves to where iOS puts it and
          # the tab and its page stay.
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/macpro-posture-inner.mp4 > /dev/null 2>&1 & REC=$!
          sleep 2
          xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -tab 6 > /dev/null
          sleep 8
          $D "$DEVICE" pose open || true; sleep 5; shot 3 macpro-posture-1open
          $D "$DEVICE" rotate 1 || true; sleep 5; shot 3 macpro-posture-2upright
          $D "$DEVICE" rotate 3 || true; sleep 5; shot 3 macpro-posture-3flat
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" $MAC || true
          $D "$DEVICE" rotate 1 || true; sleep 5
          FALLBACK="0.065 0.049"; posture 3 -upright
          date
          $D "$DEVICE" rotate 3 || true; sleep 5
          DRAGY=0.5; FALLBACK="0.948 0.222"; posture 3 -flat
          # Hidden tabs do no work: through a proxy that writes every request the app makes, every Mac Pro tab is visited
          # (its loops start), then Status is tapped and the app left on it for 40 s. The requests of those 40 s go to a log.
          node -e "const http=require('http'),fs=require('fs');http.createServer((q,s)=>{fs.appendFileSync('/tmp/req.log',(Date.now()/1000).toFixed(2)+' '+q.url+'\\n');const p=http.request({host:'127.0.0.1',port:9001,path:q.url,method:q.method,headers:q.headers},r=>{s.writeHead(r.statusCode,r.headers);r.pipe(s)});q.pipe(p);p.on('error',()=>{s.statusCode=502;s.end()})}).listen(9061)" &
          sleep 1
          # Launched on Dashboard (its loops start), then Control, macOS, Claude and Apps in turn (the tab lines run top to
          # bottom, Status first), then Status.
          xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:9061 -findBack YES -tab 6 > /dev/null; sleep 10
          for L in 5 4 3 2; do at=$(backlog $MAC | grep '^tab ' | sed -n "${L}p" | awk '{print $3" "$4}'); [ -n "$at" ] && $D "$DEVICE" touch $at 0.08; sleep 4; done
          at=$(backlog $MAC | grep '^tab ' | sed -n 1p | awk '{print $3" "$4}'); $D "$DEVICE" touch $at 0.08; sleep 3
          shot 3 macpro-reqidle-flat
          S=$(date +%s); sleep 40; E=$(date +%s)
          awk -v s=$S -v e=$E '$1>=s && $1<=e {print}' /tmp/req.log > dist/macpro-reqidle-flat-requests.log
          echo "requests in 40 s idle on Status: $(wc -l < dist/macpro-reqidle-flat-requests.log)"; awk '{sub(/\?.*/,"",$2); print $2}' dist/macpro-reqidle-flat-requests.log | sort | uniq -c | sort -rn
          xcrun simctl terminate "$DEVICE" $MAC || true
          # A shorter window, as a taller island or status leaves: every tab still in the bar.
          tabshots $MAC 3 -flat-859x604 "0 6" -windowSize 859x604
          date
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-nav-shots >/dev/null 2>&1 || gh release create mp-nav-shots --prerelease --title "Mac Pro navigation check (mp-nav-1126)" --notes "Branch mp-nav-1126: tabs in every posture, back swipe and Back films, island shots; Chumby and Mint Remote checks."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-nav-shots "$f" --clobber && break; sleep 15; done
          done
