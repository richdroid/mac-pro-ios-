name: Build iPhone apps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned apps for iPhone
        run: |
          xcodebuild -version
          mkdir -p dist
          for APP in MacPro Chumby; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Release -sdk iphoneos \
              -derivedDataPath build CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            rm -rf dist/Payload; mkdir -p dist/Payload
            cp -R build/Build/Products/Release-iphoneos/$APP.app dist/Payload/
            (cd dist && zip -qry $APP.ipa Payload && rm -rf Payload)
          done
          ls build/Build/Products/Release-iphoneos/MacPro.app/PlugIns
      - name: Screenshot in the simulator
        continue-on-error: true
        timeout-minutes: 14
        run: |
          set +x
          exec > >(tee dist/sim.log) 2>&1
          set +e
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          for APP in MacPro Chumby; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          done
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          xcrun simctl launch "$DEVICE" local.macpro.MacPro
          sleep 12
          xcrun simctl io "$DEVICE" screenshot --display=1 dist/macpro.png
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-open.png
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || echo "MacPro was not running"
          node ci/mock-chumby.js &
          shots() { for T in 0 1 2 3 4; do
              xcrun simctl launch "$DEVICE" local.macpro.Chumby -address http://127.0.0.1:9000 -tab $T
              sleep 8
              xcrun simctl io "$DEVICE" screenshot --display=$1 dist/chumby-$T$2.png
              xcrun simctl terminate "$DEVICE" local.macpro.Chumby || echo "Chumby tab $T was not running"
            done; }
          shots 1 ""
          # Unfold the Duo through Device Hub; display 3 is then live.
          git clone -q --depth 1 https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          /tmp/dh/.build/release/devicehubctl "$DEVICE" pose open; echo "unfold exit $?"
          sleep 5
          shots 3 "-open"
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips dist/crashes/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-apps
          path: dist/
          retention-days: 30
