name: Mac Pro Screen shots
# Temporary, branch-only: the Mac Pro app's Screen view streaming the Mac as video (the bridge's H.264 path, replayed by
# the stand-in on 9014 from a stream the bridge's own helper made), in every posture: folded upright and on its side,
# open upright and open flat, the posture changed while it streams, and the lossless pictures beside it for comparison.
# For the mp-screen branch's gate. Published to the mp-screen release. Removed before merge.
on:
  push:
    branches: [mp-screen]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-screen
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: The phone's own decoder over the helper's stream
        run: |
          mkdir -p dist
          swiftc -O -parse-as-library Sources/RemoteScreen.swift Sources/ScreenVideo.swift ci/screen-video-check.swift -o /tmp/screen-video-check 2>&1 | tail -3 || true
          # Only the decode count is judged here (the stream has no true stills beside it in the repo).
          mkdir -p /tmp/svc && cp ci/screen-video.rfb /tmp/svc/phone.rfb
          node -e 'const f=JSON.parse(require("fs").readFileSync("ci/screen-video.json"));require("fs").writeFileSync("/tmp/svc/frames.json",JSON.stringify({width:1280,height:800,rests:[],frames:f.map(([seq,sent])=>({seq,sent}))}))'
          /tmp/screen-video-check /tmp/svc 2>&1 | tee dist/decoder.log | head -3 || true
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$DEVICE" '{ ConnectHardwareKeyboard = 0; }' || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js > dist/mock.log 2>&1 &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          # One film of the Screen streaming: name, display, length, then the app's own arguments. PORT picks the stand-in
          # (9014 streams video, 9001 sends lossless pictures). A shot is taken partway and at the end.
          film() {
            local name=$1 display=$2 length=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${PORT:-9014} -tab 0 -pose screenslow -openScreen YES -showFPS YES "$@"
            sleep 8
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # Folded upright (the cover), then on its side.
          film screen-video 1 10
          PORT=9001 film screen-lossless 1 6
          $D "$DEVICE" rotate 1; sleep 5
          film screen-video-land 1 8
          $D "$DEVICE" rotate 3; sleep 5
          # Open upright (his main posture), then open flat.
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          film screen-video-portrait 3 8
          film screen-video-laptop-portrait 3 8 -screenPosture laptop
          $D "$DEVICE" rotate 3; sleep 5
          film screen-video-open 3 8
          film screen-video-book-open 3 8 -screenPosture book
          # The posture changed while it streams: open flat, closed (the cover), open again, turned upright and back.
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/macpro-screen-video-postures.mp4 > /dev/null 2>&1 & REC=$!
          sleep 3
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9014 -tab 0 -pose screenslow -openScreen YES -showFPS YES
          sleep 9
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-video-postures-1-open.png
          $D "$DEVICE" pose closed; sleep 6
          xcrun simctl io "$DEVICE" screenshot --display=1 dist/macpro-screen-video-postures-2-closed.png
          $D "$DEVICE" pose open; sleep 6
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-video-postures-3-reopened.png
          $D "$DEVICE" rotate 1; sleep 5
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-video-postures-4-upright.png
          $D "$DEVICE" rotate 3; sleep 5
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          grep -E "mock screen" dist/mock.log | tail -20
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-screen >/dev/null 2>&1 || gh release create mp-screen --prerelease --title "Mac Pro Screen shots" --notes "Temporary shots for the mp-screen branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-screen "$f" --clobber && break; sleep 15; done
          done
