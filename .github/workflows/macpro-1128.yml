name: Mac Pro integration check (macpro-1128)
# Branch-only check for macpro-1128, the integration of mp-systabs-1128 (the system's TabView, macOS a row on Status),
# airplay-session-1128 (the Dashboard's Music card) and mac-notifs-1128 (the Mac's notifications on Status), with the
# systabs gate's three findings worked on: a drag off the tab in front refused as a second tap (ReselectGuard), cold
# launches filmed with the moment the app's root first appeared, and the macOS page made ahead (PageWarm). Round 2: the
# gate's three Mac Pro faults fixed, pushed pages in both apps, the scripted taps corrected, 322 cold launches beside ours.
# Every tab of the Mac Pro app and Mint Remote in every posture; films of tab switching and the strip drag, cold launches,
# Status → macOS, the notifications list and its swipe, the Dashboard scrolled through a mock session, the Music card's
# states. Published to the macpro-1128-shots prerelease. Never runs on main; removed before the branch merges.
on:
  push:
    branches: [macpro-1128]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macpro-1128-shots
  cancel-in-progress: true
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the launch art
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in MacPro TV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Build 322 (main 25060c8) for the cold-launch comparison
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          git clone -q https://github.com/richdroid/mac-pro-ios-.git /tmp/b322 && cd /tmp/b322 && git checkout -q 25060c8ee027103e39b72d9ca82947ac5883833d
          swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset && xcodegen generate
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath /tmp/b322/build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 130
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          P=build-sim/Build/Products/Debug-iphonesimulator
          for A in MacPro TV; do xcrun simctl install "$DEVICE" $P/$A.app; done
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          MAC=local.macpro.MacPro; TV=local.macpro.TV
          M=http://127.0.0.1:9002
          now() { perl -MTime::HiRes=time -e 'printf "%.2f\n", time'; }
          addr() { case $1 in $MAC) echo http://127.0.0.1:9001;; $TV) echo $M;; esac; }
          name() { case $1 in $MAC) echo macpro;; $TV) echo tv;; esac; }
          snap() { xcrun simctl io "$DEVICE" screenshot --display=$1 dist/$2.png > /dev/null 2>&1; }
          caches() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) && echo "$c/Library/Caches"; }
          backlog() { local c; c=$(caches $1) && cat "$c/back-at.txt" 2>/dev/null; }
          backat() { local a; a=$(backlog $1 | head -1); case "$a" in none|"") echo "$FALLBACK";; *) echo "$a";; esac; }
          spot() { backlog $1 | awk -v n="$2" '$1 == "spot" && $2 == n {print $3" "$4}' | head -1; }
          crashes() { for f in ~/Library/Logs/DiagnosticReports/TV*.ips ~/Library/Logs/DiagnosticReports/MacPro*.ips; do [ -f "$f" ] && cp "$f" "dist/crash-$(basename "$f" .ips).log" && echo "CRASH REPORT $(basename "$f")"; done; }
          tablog() { local c; c=$(caches $1) && [ -f "$c/tab-log.txt" ] && mv "$c/tab-log.txt" dist/$2-tab.log && cat dist/$2-tab.log | sed "s/^/$2: /"; }
          swipelog() { local c; c=$(caches $1) || return 0; [ -f "$c/swipe-log.txt" ] && mv "$c/swipe-log.txt" dist/$2-swipe.log; }
          # Every tab of an app: bundle, display, suffix, tabs, then extra arguments, each with the app's own account of its
          # tab bar (a More shows up in the logs as well as the shot).
          tabshots() {
            local b=$1 d=$2 x=$3 tabs=$4 T n; shift 4
            for T in $tabs; do
              n=$(name $b)-tab$T$x
              xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -tab $T "$@" > /dev/null
              sleep 8; snap $d $n
              backlog $b > dist/$n-bar.log
              echo "$n: $(grep -c '^tab ' dist/$n-bar.log) tab buttons; $(grep '^tabbar' dist/$n-bar.log | head -1)"
              xcrun simctl terminate "$DEVICE" $b || true
            done
          }
          # Tab switching, filmed: every tab tapped where iOS put it, a tab tapped just after a fling, a drag that starts on
          # the tab in front and leaves the bar (the page must stay where it was), and a still finger on it (to the top).
          taptest() {
            local n=$1 d=$2 b=$3 i=0 label x y; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES "$@" > /dev/null
            sleep 10
            backlog $b | grep '^tab ' > dist/$n-tabs.log
            echo "$n: $(wc -l < dist/$n-tabs.log) tabs found"
            while read -r _ label x y; do
              i=$((i + 1)); $D "$DEVICE" touch $x $y 0.08 || echo "tap failed"; sleep 1.4; snap $d $n-$i-$label
            done < dist/$n-tabs.log
            local t1 t2; t1=$(sed -n 1p dist/$n-tabs.log | awk '{print $3" "$4}'); t2=$(sed -n 2p dist/$n-tabs.log | awk '{print $3" "$4}')
            if [ -n "$t2" ]; then
              $D "$DEVICE" touch $t1 0.08; sleep 1.5
              $D "$DEVICE" drag 0.35 0.75 0.35 0.3 0.12; sleep 0.15; $D "$DEVICE" touch $t2 0.08; sleep 1.4; snap $d $n-afterfling
              $D "$DEVICE" touch $t1 0.08; sleep 1.5
              $D "$DEVICE" drag 0.5 0.7 0.5 0.45 0.5; sleep 1.5; snap $d $n-stripdrag-before
              set -- $t1; $D "$DEVICE" drag $1 $2 $1 $(echo "$2 - 0.25" | bc -l) 0.3; sleep 1.5; snap $d $n-stripdrag-after
              # Slower, and further: a finger that lingers on the bar before it leaves.
              $D "$DEVICE" drag $1 $2 $1 $(echo "$2 - 0.4" | bc -l) 0.8; sleep 1.5; snap $d $n-stripdrag2-after
              # Sideways off a side strip (folded, on its side, open flat): the finger leaves the strip into the page.
              case "$1" in 0.[0-2]*) $D "$DEVICE" drag $1 $2 $(echo "$1 + 0.35" | bc -l) $2 0.4;; 0.[7-9]*) $D "$DEVICE" drag $1 $2 $(echo "$1 - 0.35" | bc -l) $2 0.4;; esac
              sleep 1.5; snap $d $n-stripdrag3-after
              $D "$DEVICE" drag 0.5 0.7 0.5 0.45 0.5; sleep 1.5; snap $d $n-retap-before
              $D "$DEVICE" touch $t1 0.08; sleep 1.5; snap $d $n-retap-after
            fi
            tablog $b $n
            crashes
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          # Cold launches, filmed: each tab launched cold, the moment the app's root first appeared (BackFinder's first
          # write, half a second after it), and stills at 2, 5 and 8 s after the launch command, then 1 s after the root.
          # A black still with the root not yet there is a slow launch; with the root there and the film showing the app,
          # the simulator's capture; with both black, the app.
          coldfilm() {
            local n=$1 d=$2 b=$3 tabs=$4 times=$5 T i c t0 tl seen k
            c=$(caches $b)
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            local f0; f0=$(now)
            for T in $tabs; do for i in $(seq 1 $times); do
              rm -f "$c/back-at.txt"
              t0=$(now)
              xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -tab $T > /dev/null
              tl=$(now); seen=""
              for k in $(seq 1 60); do
                [ -f "$c/back-at.txt" ] && { seen=$(now); break; }
                case $k in 8) snap $d $n-tab$T-$i-2s;; 20) snap $d $n-tab$T-$i-5s;; esac
                sleep 0.25
              done
              sleep 1; snap $d $n-tab$T-$i-root1s
              while [ "$(echo "$(now) - $t0 < 8" | bc)" = 1 ]; do sleep 0.2; done
              snap $d $n-tab$T-$i-8s
              echo "COLD $n tab$T #$i film+$(echo "$t0 - $f0" | bc)s launch=$(echo "$tl - $t0" | bc)s root=$([ -n "$seen" ] && echo "$seen - $t0" | bc || echo never)s"
              backlog $b > dist/$n-tab$T-$i-bar.log
              xcrun simctl terminate "$DEVICE" $b || true
              sleep 1
            done; done
            kill -INT $REC; wait $REC
          }
          # Status → macOS: Status scrolled to its macOS row, the row tapped (the push), Back tapped where iOS put it; the row
          # again and Back again; once more and the page swiped back from the edge. The first push follows the made-ahead page.
          macosfilm() {
            local d=$1 x=$2 n=macpro-macos-push$2 at
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -findBack YES -swipeLog YES -tab 0 -pose macosrow > /dev/null
            sleep 11
            at=$(spot $MAC macosrow); echo "$n row at '$at'"
            snap $d $n-1status
            if [ -n "$at" ]; then
              $D "$DEVICE" touch $at 0.08; sleep 0.3; snap $d $n-2pushmid; sleep 4; snap $d $n-3page
              local back; back=$(backat $MAC); echo "$n Back at $back"
              $D "$DEVICE" touch $back 0.08; sleep 0.3; snap $d $n-4popmid; sleep 2.2; snap $d $n-5back
              at=$(spot $MAC macosrow)
              $D "$DEVICE" touch $at 0.08; sleep 4; snap $d $n-5b-page
              back=$(backat $MAC); $D "$DEVICE" touch $back 0.08; sleep 2.5; snap $d $n-5c-back
              at=$(spot $MAC macosrow)
              $D "$DEVICE" touch $at 0.08; sleep 4; snap $d $n-6page
              $D "$DEVICE" drag 0.01 0.5 0.92 0.5 2.6 & DR=$!
              sleep 1.7; snap $d $n-7swipe-mid; wait $DR
              sleep 2.5; snap $d $n-8swipe-after
            fi
            backlog $MAC > dist/$n-back.log
            swipelog $MAC $n
            grep -h 'prewarm' dist/$n-swipe.log 2>/dev/null | sed "s/^/$n: /"
            xcrun simctl terminate "$DEVICE" $MAC || true
            kill -INT $REC; wait $REC
          }
          # A film of the Mac Pro app: launched with its arguments, then touches (devicehubctl commands, ';'-separated).
          film() {
            local n=$1 d=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/macpro-$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:9001 "$@" > /dev/null
            sleep 7
            local k=0
            ( IFS=';'; for t in $touches; do k=$((k + 1)); eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 1; snap $d macpro-$n-$k; sleep 1.5; done )
            sleep $length
            snap $d macpro-$n-end
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $MAC || true
          }
          # A shot 1.5 s after the app's root first appears (BackFinder's first write), for states that last only seconds.
          rootshot() {
            local n=$1 d=$2 port=9001 c k; shift 2
            if [ "$1" = "@" ]; then port=$2; shift 2; fi
            c=$(caches $MAC); rm -f "$c/back-at.txt"
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:$port -findBack YES "$@" > /dev/null
            for k in $(seq 1 80); do [ -f "$c/back-at.txt" ] && break; sleep 0.25; done
            sleep 1.5; snap $d macpro-$n
            xcrun simctl terminate "$DEVICE" $MAC || true
          }
          shot() {
            local n=$1 d=$2 wait=$3 port=9001; shift 3
            if [ "$1" = "@" ]; then port=$2; shift 2; fi
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:$port "$@" > /dev/null
            sleep $wait; snap $d macpro-$n
            xcrun simctl terminate "$DEVICE" $MAC || true
          }
          # The Mac's notifications: the list, the list emptied, and a film of a slow pull, a full swipe and Dismiss All,
          # then the row on Status tapped.
          notifs() {
            local d=$1 x=$2
            shot notifs$x $d 9 -tab 0 -pose notifs
            shot notifs-empty$x $d 9 -tab 0 -pose notifsempty
            local n=macpro-notifs-swipe$x y
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:9001 -findBack YES -tab 0 -pose notifs > /dev/null
            sleep 10
            y=$(backlog $MAC | awk '$1 == "spot" && $2 == "notif0" {print $4}' | head -1); echo "$n first row at y=$y"
            snap $d $n-0list
            if [ -n "$y" ]; then
              $D "$DEVICE" drag 0.8 $y 0.5 $y 0.8; sleep 1.5; snap $d $n-1pulled
              $D "$DEVICE" touch 0.3 0.05 0.08; sleep 1.2
              $D "$DEVICE" drag 0.85 $y 0.05 $y 0.2; sleep 1.5; snap $d $n-2swiped
            fi
            $D "$DEVICE" tap "Dismiss All" || echo "Dismiss All not found"; sleep 0.4; snap $d $n-3clearing; sleep 2; snap $d $n-4empty
            kill -INT $REC; wait $REC
            backlog $MAC > dist/$n-back.log
            xcrun simctl terminate "$DEVICE" $MAC || true
            sleep 22
            film notifs-fromstatus$x $d 3 "tap mac-notifs" -tab 0
          }
          # The Dashboard scrolled top to bottom and back while the Music card goes through a whole session (mock 9069:
          # connecting, finding, lyrics, ending, ended), End's question asked and cancelled, the Pages menu opened.
          dashfilm() {
            local d=$1 x=$2 dx=$3 n=macpro-dash-scroll$2
            down() { $D "$DEVICE" drag $dx 0.8 $dx 0.4 0.6 || echo "drag failed"; sleep 2; }
            up() { $D "$DEVICE" drag $dx 0.35 $dx 0.8 0.6 || echo "drag failed"; sleep 2; }
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:9069 -tab 6 -swipeLog YES > /dev/null
            sleep 5; snap $d $n-0top
            down; snap $d $n-1-down; down; snap $d $n-2-down; down; down; snap $d $n-3-bottom
            # End asked while the session is on, and let go by a tap outside its question (it has no Cancel).
            $D "$DEVICE" tap music.end || echo "End not found"; sleep 1.5; snap $d $n-6end-ask
            $D "$DEVICE" touch 0.5 0.12 0.08; sleep 1.5; snap $d $n-6b-end-kept
            up; up; snap $d $n-4-up; down; down; down; snap $d $n-5-bottom
            echo "$n: waiting at the bottom through the session's end"; sleep 26; snap $d $n-7ended-bottom
            up; up; up; up; snap $d $n-8top
            $D "$DEVICE" tap board.pages || echo "Pages key not found"; sleep 1.5; snap $d $n-9pages-menu
            $D "$DEVICE" tap "Fans & heat" || echo "Fans & heat not found"; sleep 2.5; snap $d $n-10page-chosen
            xcrun simctl terminate "$DEVICE" $MAC || true
            kill -INT $REC; wait $REC
            swipelog $MAC $n
            sleep 45   # the mock's session starts over after 40 s quiet
          }
          # The Music card in every state the mock Mac can be in, then a whole session filmed, then the Dashboard scroll.
          music() {
            local d=$1 x=$2 dx=$3
            shot music-idle$x $d 9 -tab 6 -pose music
            shot music-lyrics$x $d 9 @ 9061 -tab 6 -pose music
            shot music-connecting$x $d 9 @ 9062 -tab 6 -pose music
            shot music-nospeaker$x $d 9 @ 9063 -tab 6 -pose music
            shot music-long-busy$x $d 11 @ 9064 -tab 6 -pose music -musicPress lyrics
            shot music-refused$x $d 11 @ 9065 -tab 6 -pose music -musicPress next
            rootshot music-cold$x $d @ 9066 -tab 6 -pose music
            shot music-ended$x $d 9 @ 9067 -tab 6 -pose music
            shot music-other-sender$x $d 9 @ 9068 -tab 6 -pose music
            shot music-end-confirm$x $d 11 @ 9061 -tab 6 -pose music -musicPress endask
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/macpro-music-session$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $MAC -address http://127.0.0.1:9069 -tab 6 -pose music > /dev/null
            sleep 68
            xcrun simctl terminate "$DEVICE" $MAC || true
            kill -INT $REC; wait $REC
            sleep 45
            dashfilm $d $x $dx
          }
          # The island taken (Mint Remote's own Live Activity, left running in the background), then the Mac Pro's tabs.
          islandshots() {
            local d=$1 x=$2
            xcrun simctl launch "$DEVICE" $TV -address $M/real -tab 2 -pose island > /dev/null
            sleep 12
            tabshots $MAC $d -island$x "0 6"
            xcrun simctl terminate "$DEVICE" $TV || true
          }
          # Pages pushed over the system's tabs, both apps (gate on macpro-1128: none were shot on the new tab container).
          pushed() {
            local d=$1 x=$2
            shot pushed-session$x $d 9 -tab 2 -pose session
            shot pushed-history$x $d 8 -tab 0 -openHistory cpu
            shot pushed-processes$x $d 8 -tab 0 -openProcesses cpu
            shot pushed-versions$x $d 9 -tab 1 -pose versions
            shot pushed-settings$x $d 8 -tab 9
            shot pushed-screen$x $d 8 -tab 0 -pose screen -openScreen YES
            shot pushed-notifs-status0$x $d 8 @ 9061 -tab 0
            tvshot pushed-details$x $d 13 $M -tab 1 -pose details
            tvshot pushed-streams$x $d 9 $M -tab 1 -pose streams
            tvshot pushed-browse$x $d 9 $M -tab 1 -pose browse
            tvshot pushed-tvsettings$x $d 9 $M -tab 0 -pose tvsettings
            tvshot pushed-tvapps$x $d 9 $M -tab 0 -pose tvapps
            curl -s $M/real/reset > /dev/null; tvshot pushed-realseries$x $d 14 $M/real -tab 3 -pose realseries
          }
          tvshot() {
            local n=$1 d=$2 wait=$3 a=$4; shift 4
            xcrun simctl launch "$DEVICE" $TV -address $a "$@" > /dev/null
            sleep $wait; snap $d tv-$n
            xcrun simctl terminate "$DEVICE" $TV || true
          }
          # Mint Remote's pick and a pushed page taken back, filmed (open upright): the first stream tapped on the streams
          # page (the flick's quick way), then a title's page swiped back from the edge and, launched again, Back tapped.
          tvfilms() {
            local d=$1 x=$2 n
            n=tv-flicktap$x
            curl -s $M/fnormal/reset > /dev/null
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $TV -address $M/fnormal -tab 1 -pose flick-tap > /dev/null
            sleep 16; snap $d $n-end
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $TV || true
            navfilm tv-back-details$x $d $TV -tab 1 -pose details
          }
          navfilm() {
            local n=$1 d=$2 b=$3 at; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 13; snap $d $n-1page
            $D "$DEVICE" drag 0.01 0.5 0.92 0.5 2.6 & DR=$!
            sleep 1.7; snap $d $n-2swipe-mid; wait $DR
            sleep 2.5; snap $d $n-3swipe-after
            xcrun simctl terminate "$DEVICE" $b || true
            sleep 1
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 13
            at=$(backat $b); echo "$n tap Back at $at"
            $D "$DEVICE" touch $at 0.08 || echo "tap failed"
            sleep 0.3; snap $d $n-4tap-mid; sleep 2.5; snap $d $n-5tap-after
            backlog $b > dist/$n-back.log
            swipelog $b $n
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          # Cold launches of build 322 and of this branch, the same tabs in turn, filmed: the time to the first frame of each,
          # set side by side (gate on macpro-1128: no 322 timing to show the launch is no slower).
          coldab() {
            local d=$1 x=$2
            if [ -d /tmp/b322/build-sim/Build/Products/Debug-iphonesimulator/MacPro.app ]; then
              xcrun simctl install "$DEVICE" /tmp/b322/build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
              xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) > /dev/null; sleep 12; xcrun simctl terminate "$DEVICE" $MAC
              coldfilm macpro-cold322$x $d $MAC "0 2 6" 2
              xcrun simctl install "$DEVICE" $P/MacPro.app
              xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) > /dev/null; sleep 12; xcrun simctl terminate "$DEVICE" $MAC
              coldfilm macpro-coldnew$x $d $MAC "0 2 6" 2
            else echo "no 322 build"; fi
          }
          # Everything in one posture (display, suffix). Mac Pro tab 4, the old macOS tab, opens the macOS page on Status.
          posture() {
            local d=$1 x=$2
            tabshots $MAC $d $x "0 1 2 5 6 4"
            tabshots $TV $d $x "3 0 6"
            taptest macpro-taps$x $d $MAC -tab 0
            taptest tv-taps$x $d $TV -tab 3
            pushed $d $x
          }
          date
          FALLBACK="0.895 0.292"; posture 1 -folded
          macosfilm 1 -folded
          notifs 1 -folded
          music 1 -folded 0.06
          date
          # Folded and turned on its side each way.
          for R in 3 4; do
            $D "$DEVICE" rotate $R || true; sleep 5
            tabshots $MAC 1 -side$R "0 1 2 5 6"
            tabshots $TV 1 -side$R "3 0 6"
            taptest macpro-taps-side$R 1 $MAC -tab 0
          done
          $D "$DEVICE" rotate 1 || true; sleep 5
          date
          # Folded on Dashboard, opened flat, turned upright, back flat: the bar moves to where iOS puts it, the tab stays.
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/macpro-posture-inner.mp4 > /dev/null 2>&1 & REC=$!
          sleep 2
          xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -tab 6 > /dev/null
          sleep 8
          $D "$DEVICE" pose open || true; sleep 5; snap 3 macpro-posture-1open
          $D "$DEVICE" rotate 1 || true; sleep 5; snap 3 macpro-posture-2upright
          $D "$DEVICE" rotate 3 || true; sleep 5; snap 3 macpro-posture-3flat
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" $MAC || true
          $D "$DEVICE" rotate 1 || true; sleep 5
          # Open upright, the posture he holds: everything.
          FALLBACK="0.065 0.049"; posture 3 -upright
          coldab 3 -upright
          tvfilms 3 -upright
          notifs 3 -upright
          music 3 -upright 0.06
          islandshots 3 -upright
          date
          $D "$DEVICE" rotate 3 || true; sleep 5
          FALLBACK="0.948 0.222"; posture 3 -flat
          notifs 3 -flat
          music 3 -flat 0.7
          islandshots 3 -flat
          # A shorter window, as a taller island or status leaves: every tab still in the bar.
          tabshots $MAC 3 -flat-859x604 "0 1 2 5 6" -windowSize 859x604
          tabshots $TV 3 -flat-859x604 "3 0 6" -windowSize 859x604
          date
          crashes
          echo "== tab bars"; grep -h '^tabbar' dist/*-bar.log | sort | uniq -c
          echo "== cold launches"; grep '^COLD' dist/sim.log
          ls dist | wc -l; du -sh dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view macpro-1128-shots >/dev/null 2>&1 || gh release create macpro-1128-shots --prerelease --title "Mac Pro integration check (macpro-1128)" --notes "Branch macpro-1128: system tabs, the Dashboard's Music card and the Mac's notifications together; every tab in every posture, tab, cold-launch, push, swipe and scroll films."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload macpro-1128-shots "$f" --clobber && break; sleep 15; done
          done
