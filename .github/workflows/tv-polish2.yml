name: TV polish (branch)
# A working branch's own short run: the TV app's polish after gate 276 (lyrics, Playing under a video and a show, the
# Apps tab, Status, Settings and its pages), shot in every posture: folded, open upright (the posture he holds), open
# flat. Dark first, then the same pages light, open upright. Only for pushes to tv-polish2; published to the tv-polish2
# release. The full build, the TV app's own run and their releases are untouched, and nothing here waits on them.
on:
  push:
    branches: [tv-polish2]
permissions:
  contents: write
concurrency:
  group: tv-polish2
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme TV -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/TV.app
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          xcrun simctl ui "$DEVICE" appearance dark
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9002
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          shot() {
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          }
          pages() {
            local display=$1 tag=$2
            # Mint twice: the first open after a boot, kept as -first, and the shot itself on a second visit.
            shot mint$tag-first $display 10 $M/rmint -tab 2
            shot mint$tag $display 10 $M/rmint -tab 2
            shot youtube$tag $display 9 $M/ryoutube -tab 2
            shot episode$tag $display 10 $M/repisode -tab 2
            shot film$tag $display 9 $M/rfilm -tab 2
            shot apps$tag $display 8 $M -tab 1
            shot status$tag $display 9 $M -tab 5
            shot settings$tag $display 7 $M -tab 9
            shot connection$tag $display 7 $M -tab 9 -pose connection
            shot tvsettings$tag $display 8 $M -tab 9 -pose tvsettings
            shot tvapps$tag $display 8 $M -tab 9 -pose tvapps
            shot remote$tag $display 8 $M/repisode -tab 0
          }
          # Folded, then open upright, then open flat.
          pages 1 ""
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          pages 3 -portrait
          $D "$DEVICE" rotate 3 || true; sleep 5
          pages 3 -open
          $D "$DEVICE" rotate 1 || true; sleep 5
          xcrun simctl ui "$DEVICE" appearance light
          shot apps-light-portrait 3 8 $M -tab 1
          shot settings-light-portrait 3 7 $M -tab 9
          shot mint-light-portrait 3 10 $M/rmint -tab 2
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../polish.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../polish.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view tv-polish2 >/dev/null 2>&1 || gh release create tv-polish2 --prerelease --title "TV polish (branch)" --notes "Work in progress on the TV app's polish after gate 276: shots from the tv-polish2 branch."
          for f in polish.zip status.txt; do
            for i in 1 2 3; do gh release upload tv-polish2 "$f" --clobber && break; sleep 15; done
          done
