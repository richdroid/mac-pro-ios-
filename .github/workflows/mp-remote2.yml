name: Mac Pro remote, the Mac's own mode and turns (mp-remote2)
# Temporary, branch-only: the Dashboard remote in each state of the Mac's screen in the three postures, the switches,
# and a film of Next and Previous answered. Published to the mp-remote2 release. Removed before merge.
on:
  push:
    branches: [mp-remote2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-remote2
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          APP=local.macpro.MacPro
          crashes() {
            local n=0
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/MacPro* 2>/dev/null | head -3); do n=$((n+1)); head -c 40000 "$f" > dist/crash-$n.log; done
            echo "crash reports: $n"
          }
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" $APP || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # A shot after touches: name, display, touches (devicehubctl lines, ; between), app args.
          shotdrag() {
            local name=$1 display=$2 touches=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep 8
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 1.5; done )
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" $APP || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # A film with scripted touches: name, display, tail length, touches, app args.
          film() {
            local name=$1 display=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep 6
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep ${GAP:-2}; done )
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $APP || true
          }
          remote() {
            local x=$1 d=$2 sx=$3; shift 3
            shot dash-desk$x $d 8 -tab 6 -pose consoleboard "$@"
            shot dash-bed$x $d 8 -tab 6 -pose consolebed "$@"
            shot dash-page$x $d 8 -tab 6 -pose console "$@"
            shot dash-glance$x $d 8 -tab 6 -pose consoleglance "$@"
            shot dash-asleep$x $d 8 -tab 6 -pose consoleasleep "$@"
            shot dash-off$x $d 8 -tab 6 -pose consoleoff "$@"
            shotdrag dash-switches$x $d "drag $sx 0.8 $sx 0.2 0.5;drag $sx 0.8 $sx 0.2 0.5" -tab 6 -pose consolebed "$@"
            # Next and Previous stepping through the Mac's own turns (bed: Playing, The room, Tonight), each answered.
            film next$x $d 3 "tap remote.Next;tap remote.Next;tap remote.Previous" -tab 6 -pose consolebed "$@"
            xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 -tab 6 -pose consolebed "$@"; sleep 7
            $D "$DEVICE" tap remote.Next; sleep 1.5; xcrun simctl io "$DEVICE" screenshot --display=$d dist/macpro-next$x-answer.png
            xcrun simctl terminate "$DEVICE" $APP
          }
          # 1. Folded upright.
          remote "" 1 0.4
          # 2. Open upright (how he holds it), at the simulator's size and his own.
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          remote -portrait 3 0.5
          shot dash-bed-hisportrait 3 8 -tab 6 -pose consolebed -windowSize 604x859
          # 3. Open flat at his size.
          $D "$DEVICE" rotate 3; sleep 5
          remote -his 3 0.22 -windowSize 859x604
          crashes
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-remote2 >/dev/null 2>&1 || gh release create mp-remote2 --prerelease --title "Mac Pro mp-remote2 shots" --notes "Temporary shots for the mp-remote2 branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-remote2 "$f" --clobber && break; sleep 15; done
          done
