name: Mac Pro IPA details check (branch)
# Branch-only check for an added app's page on the Apps tab: its details from the package, with and without history found
# in public, and from an older Mac that knows nothing of them; his own apps' Version History beside them, unchanged. All
# three postures (folded, open flat, open upright), upright in light too. Published to its own release
# (macpro-ipainfo-ci). Not for main; deleted after the gate.
on:
  push:
    branches: [ipa-details]
permissions:
  contents: write
concurrency:
  group: macpro-ipainfo
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Release -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Release-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          D=/tmp/dh/.build/release/devicehubctl
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # A page scrolled by a finger, half way and to its foot (x: the pane to drag), so everything on it is seen.
          scrolled() {
            local name=$1 display=$2 x=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 10
            $D "$DEVICE" drag $x 0.8 $x 0.45 || true; sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$name-mid.png
            for i in 1 2 3; do $D "$DEVICE" drag $x 0.85 $x 0.1 || true; sleep 1; done
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$name-foot.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # The page opened, then flung down and back, filmed: its rows must not jump as the details land.
          film() {
            local name=$1 display=$2 x=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 10
            for i in 1 2 3; do $D "$DEVICE" drag $x 0.8 $x 0.25 0.15 || true; sleep 1.4; done
            for i in 1 2 3 4; do $D "$DEVICE" drag $x 0.25 $x 0.8 0.15 || true; sleep 1.4; done
            sleep 2
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          poses() {
            local d=$1 x=$2 px=$3 rx=$4
            shot ipaapps$x $d 9 -tab 1 -pose ipaapps
            shot ipainfo$x $d 10 -tab 1 -pose ipainfo
            shot ipahistory$x $d 10 -tab 1 -pose ipahistory
            shot ipaold$x $d 10 -tab 1 -pose ipaold
            shot versions$x $d 10 -tab 1 -pose versions
            scrolled ipainfo$x $d $px -tab 1 -pose ipainfo
            scrolled ipahistory$x $d $px -tab 1 -pose ipahistory
            if [ -n "$rx" ]; then
              scrolled ipainfo-right$x $d $rx -tab 1 -pose ipainfo
              scrolled ipahistory-right$x $d $rx -tab 1 -pose ipahistory
            fi
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          poses 3 -upright 0.5 ""
          film ipahistory-upright 3 0.5 -tab 1 -pose ipahistory
          xcrun simctl ui "$DEVICE" appearance light
          shot ipainfo-upright-light 3 10 -tab 1 -pose ipainfo
          shot ipahistory-upright-light 3 10 -tab 1 -pose ipahistory
          shot ipaapps-upright-light 3 9 -tab 1 -pose ipaapps
          xcrun simctl ui "$DEVICE" appearance dark
          $D "$DEVICE" rotate 3 || true; sleep 5
          poses 3 -flat 0.3 0.72
          film ipahistory-flat 3 0.3 -tab 1 -pose ipahistory
          $D "$DEVICE" pose closed || true; sleep 5
          poses 1 -folded 0.45 ""
          film ipahistory-folded 1 0.45 -tab 1 -pose ipahistory
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view macpro-ipainfo-ci >/dev/null 2>&1 || gh release create macpro-ipainfo-ci --prerelease --title "Mac Pro IPA details check" --notes "Branch-only shots of an added app's page."
          for f in shots.zip films.zip status.txt; do
            for i in 1 2 3; do gh release upload macpro-ipainfo-ci "$f" --clobber && break; sleep 15; done
          done
