name: Chumby sounds spacing (branch)
# A working branch's own short run: the Sounds tab's spacing (Richard, 2026-11-13, build 281 open portrait: "spacing in
# what played or whatever is horrific"). Stills folded, open flat and open portrait, light and dark, on real-shaped
# data: long Pandora station names, three one-song rings with two-line artists (soundsreal) and five rings of several
# songs (soundsmany); each at the top and scrolled to Alarms play; the strip dragged to its far end.
# Only for pushes to chumby-sounds-spacing; published to the chumby-sspace-shots release.
on:
  push:
    branches: [chumby-sounds-spacing]
permissions:
  contents: write
concurrency:
  group: chumby-sspace
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Chumby launch sea and wordmark
        run: swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme Chumby -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 90
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9000
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 2; sleep 12
          xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          still() { # display, name, seconds, address, launch args...
            local d=$1 name=$2 secs=$3 addr=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $addr "$@"
            sleep $secs
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          film() { # display, name, seconds, address, launch args... (records while the app runs)
            local d=$1 name=$2 secs=$3 addr=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $addr "$@"
            sleep $secs
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name-end.png
            kill -INT $REC; wait $REC; echo "$name exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          fresh() { # a clean install, so one scene's kept history never joins the next scene's
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby 2>/dev/null || true
            xcrun simctl uninstall "$DEVICE" local.macpro.Chumby
            xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
            # A first launch after an install is slow to load (11-13 run: "No alarms yet" at 14 s), so warm it on the
            # same scene before any shot.
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $1 -tab 3; sleep 15
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          scrolled() { # display, name, address, launch args... (top, then the page scrolled twice)
            local d=$1 name=$2 addr=$3; shift 3
            fresh $addr
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $addr "$@"
            sleep 14
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name-top.png
            $D "$DEVICE" drag 0.3 0.8 0.3 0.45 1.0 || echo "scroll failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name-mid.png
            $D "$DEVICE" drag 0.3 0.8 0.3 0.45 1.0 || echo "scroll failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name-low.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          posture() { # display, suffix, strip's height, its right and left ends, as fractions of the screen
            local d=$1 x=$2 y=$3 r=$4 l=$5 px=$6 starts=$7
            for A in light dark; do
              xcrun simctl ui "$DEVICE" appearance $A
              scrolled $d real-$A$x $M/soundsreal -tab 3
              scrolled $d many-$A$x $M/soundsmany -tab 3
            done
            xcrun simctl ui "$DEVICE" appearance light
            # Film: the five-ring strip dragged slowly, flung to its far end, flung back (fade toggles, bounce).
            fresh $M/soundsmany
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-stripfilm$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M/soundsmany -tab 3
            sleep 14
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-strip-rest$x.png
            $D "$DEVICE" drag $r $y $l $y 1.2 || echo "drag failed"; sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-strip-mid$x.png
            $D "$DEVICE" drag $r $y $l $y 0.12 || echo "fling failed"; sleep 2
            $D "$DEVICE" drag $r $y $l $y 0.12 || echo "fling failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-strip-end$x.png
            $D "$DEVICE" drag $l $y $r $y 0.12 || echo "fling back failed"; sleep 3
            kill -INT $REC; wait $REC; echo "stripfilm$x exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            # Film: page drags that begin on an alarm's sound value (slow, then a flick) must scroll, never pick.
            # The page is first scrolled so Alarms play fills the screen; values are found by their row positions.
            fresh $M/soundsreal
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-pagedrag$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M/soundsreal -tab 3
            sleep 14
            $D "$DEVICE" drag $px 0.85 $px 0.35 1.0 || echo "scroll failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pagedrag-before$x.png
            for v in $starts; do
              $D "$DEVICE" drag $px $v $px 0.2 1.0 || echo "slow drag failed"; sleep 2
              $D "$DEVICE" drag $px 0.2 $px $v 1.0 || echo "slow drag back failed"; sleep 2
              $D "$DEVICE" drag $px $v $px 0.2 0.15 || echo "flick failed"; sleep 2
              $D "$DEVICE" drag $px 0.2 $px $v 0.6 || echo "flick back failed"; sleep 2
            done
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pagedrag-after$x.png
            kill -INT $REC; wait $REC; echo "pagedrag$x exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            # Film: a pick from a one-line station to a two-line one and back, on the 11:00 alarm (the scene is live, so
            # the Chumby keeps it as it would).
            fresh $M/soundsreal
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-pick$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M/soundsreal -tab 3
            sleep 14
            $D "$DEVICE" drag $px 0.85 $px 0.35 1.0 || echo "scroll failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pick-before$x.png
            $D "$DEVICE" tap "What 11:00 AM plays" || echo "open failed"; sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pick-menu$x.png
            $D "$DEVICE" tap "My Bloody Valentine and Shoegaze Essentials Radio" || echo "pick failed"; sleep 5
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pick-two$x.png
            $D "$DEVICE" tap "What 11:00 AM plays" || echo "open again failed"; sleep 2
            $D "$DEVICE" tap "Sunny Day Real Estate Radio" || echo "pick back failed"; sleep 5
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pick-back$x.png
            kill -INT $REC; wait $REC; echo "pick$x exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          $D "$DEVICE" pose closed; sleep 5
          posture 1 "" 0.64 0.72 0.1 0.3 "0.45 0.6 0.75"
          $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
          posture 3 -open 0.67 0.42 0.05 0.7 "0.3 0.45 0.6"
          $D "$DEVICE" rotate 1; sleep 5
          posture 3 -portrait 0.55 0.85 0.08 0.3 "0.45 0.6 0.75"
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips dist/crashes/ 2>/dev/null || true
      - name: Publish the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' '*.ips' || zip -q ../shots.zip /dev/null)
          # Films go up one by one: together they passed a release asset's 2 GB limit (11-13 run).
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view chumby-sspace-shots >/dev/null 2>&1 || gh release create chumby-sspace-shots --target chumby-sounds-spacing --prerelease --title "Chumby sounds spacing (branch)" --notes "Branch-only shots."
          for f in dist/*.mp4 shots.zip status.txt; do
            for i in 1 2 3 4; do gh release upload chumby-sspace-shots "$f" --clobber && break; echo "upload of $f failed, try $i"; sleep 20; done
          done
