name: TV quick checks
# A short run for the TV app's work in progress, pushed to the tv-quick branch (never main): the Now Playing card in
# every state (the gallery's drawing of it, and the real island and Lock Screen card where the simulator will show
# them), and the tab tour with its slow-frame log, in minutes rather than the full run's hour and a half. Published to
# the tv-quick release.
on:
  push:
    branches: [tv-quick]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-quick
  cancel-in-progress: true
jobs:
  quick:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in TV GalleryTV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Shots
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/TV.app
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/GalleryTV.app
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          date
          rm -f /tmp/tv-hitches.log
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9002
          WHAT=$(cat ci/tv-quick.txt 2>/dev/null)
          has() { case " $WHAT " in *" $1 "*) return 0;; esac; return 1; }
          if has island; then
            # The card as the gallery draws it, each state in the frame iOS gives it.
            for P in island island-open1 island-open2 island-open3 island-lock0 island-lock1 island-lock2 island-art; do
              xcrun simctl launch "$DEVICE" local.macpro.GalleryTV -page $P
              sleep 14
              xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-$P.png
              xcrun simctl terminate "$DEVICE" local.macpro.GalleryTV || true
            done
          fi
          date
          # With "path" added (ci/flick-hands): one finger held, then carried through segments. The pinned build has only
          # touch and drag, and a drag can't hold first, which a lift needs.
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 \
            && F=$(grep -rl 'args\[1\] == "touch" || args\[1\] == "drag"' Sources) \
            && python3 -c 'import sys; f,p=sys.argv[1:]; m="if args[1] == \"touch\" || args[1] == \"drag\" {"; s=open(f).read(); assert m in s; open(f,"w").write(s.replace(m, open(p).read()+m, 1))' "$F" $GITHUB_WORKSPACE/ci/flick-hands/devicehub-path.swift \
            && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          date
          if has island; then
            # And the real one, where the simulator will show it: the app up on a show playing (its "island" pose lets
            # the card start against the build's stand-in Mac), then left for Settings (the small island), the island
            # held (opened), and the cover sheet pulled down (the Lock Screen's card).
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/real -tab 2 -pose island
            sleep 12
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-islandreal-app.png
            xcrun simctl launch "$DEVICE" com.apple.mobilesafari
            sleep 6
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-islandreal-compact.png
            $D "$DEVICE" touch 0.5 0.035 1.2 || echo "island hold failed"
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-islandreal-open.png
            sleep 4
            $D "$DEVICE" drag 0.2 0.002 0.2 0.8 0.5 || echo "cover sheet drag failed"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-islandreal-lock.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
            xcrun simctl terminate "$DEVICE" com.apple.mobilesafari || true
            date
          fi
          tourfilm() {
            local name=$1 display=$2
            local from; from=$(wc -l < /tmp/tv-hitches.log 2>/dev/null || echo 0)
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/tv-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.TV -address ${SCENE:-$M/live} -tab 0 -pose tour -swipeLog YES "${@:3}"
            sleep 25
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
            sleep 2
            tail -n +$((from + 1)) /tmp/tv-hitches.log > dist/tv-$name-hitches.log 2>/dev/null || echo "no hitch log" > dist/tv-$name-hitches.log
          }
          shot() {
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          }
          if has remote; then
            # The Remote in every posture and state: folded (the cover display, the rail on the right), open upright,
            # open flat, then folded and turned. One column: the keys' edges are the picture's, nothing under the rail.
            remotes() { for S in repisode rfilm ridle rmint ryoutube roffline; do shot remote-$S$2 $1 8 $M/$S -tab 0; done; shot remote-type$2 $1 9 $M/repisode -tab 0 -pose type; }
            remotes 1 ""
            # In motion: the Remote left on a TV whose state changes every 8 s (a show, a film, nothing, Mint, an episode
            # with no length), so nothing may move or resize as a state comes and goes. Folded, then open upright.
            remotefilm() {
              xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$2 --force dist/tv-$1.mp4 > /dev/null 2>&1 & REC=$!
              sleep 3
              xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/rcycle -tab 0
              sleep 48
              kill -INT $REC; wait $REC
              xcrun simctl terminate "$DEVICE" local.macpro.TV || true
            }
            remotefilm remote-cycle 1
            # Typing in and out every 5 s ("-typeCycle YES"), on a show: nothing may jump as the keyboard comes and goes.
            typefilm() {
              xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$2 --force dist/tv-$1.mp4 > /dev/null 2>&1 & REC=$!
              sleep 3
              xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/repisode -tab 0 -typeCycle YES
              sleep 30
              kill -INT $REC; wait $REC
              xcrun simctl terminate "$DEVICE" local.macpro.TV || true
            }
            typefilm remote-typing 1
            $D "$DEVICE" rotate 3 || true; sleep 4
            shot remote-repisode-fland 1 8 $M/repisode -tab 0
            $D "$DEVICE" rotate 1 || true; sleep 4
            $D "$DEVICE" pose open; sleep 5
            $D "$DEVICE" rotate 1; sleep 5
            OPENED=1
            remotes 3 -portrait
            remotefilm remote-cycle-portrait 3
            typefilm remote-typing-portrait 3
            $D "$DEVICE" rotate 3 || true; sleep 5
            remotes 3 -open
            typefilm remote-typing-open 3
            $D "$DEVICE" rotate 1 || true; sleep 5
            # The fold closing and opening while typing: both displays filmed, the keyboard up from launch.
            # (A display can only be filmed while it's lit: the main one throughout, the cover one while folded.)
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/tv-remote-typing-fold-open.mp4 > /dev/null 2>&1 & REC3=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/repisode -tab 0 -pose type
            sleep 10
            $D "$DEVICE" pose closed || true; sleep 2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=1 --force dist/tv-remote-typing-fold-cover.mp4 > /dev/null 2>&1 & REC1=$!
            sleep 10
            kill -INT $REC1; wait $REC1
            $D "$DEVICE" pose open || true; sleep 5
            $D "$DEVICE" rotate 1 || true; sleep 8
            kill -INT $REC3; wait $REC3
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          fi
          if has pages; then
            # The searches, folded and then open upright: the Apps page's (films, shows and music found together) and
            # Watch's own with one film found. A simulator's first keyboard is slow, so the first search shot is retaken.
            shot search 1 12 $M -tab 1 -pose search
            shot search 1 12 $M -tab 1 -pose search
            shot watchsearch 1 10 $M -tab 3 -pose watchsearch
            [ -z "$OPENED" ] && { $D "$DEVICE" pose open; sleep 5; $D "$DEVICE" rotate 1; sleep 5; }
            OPENED=1
            shot search-portrait 3 12 $M -tab 1 -pose search
            shot search-portrait 3 12 $M -tab 1 -pose search
            shot watchsearch-portrait 3 10 $M -tab 3 -pose watchsearch
            shot tab1-portrait 3 7 $M -tab 1
            shot tab3-portrait 3 7 $M -tab 3
            shot tab0-portrait 3 8 $M/repisode -tab 0
            shot tab2-portrait 3 8 $M/repisode -tab 2
            # Mint playing a song: the Music player itself, not its idle page.
            shot tab2-mint-portrait 3 8 $M/rmint -tab 2
          fi
          if has rail; then
            # The tabs' rail in the postures the other modes miss: folded (the cover display, upright and on its side)
            # and open on its side, with the tab tour filmed folded and open on its side, Music playing a song, and Search
            # with the keyboard up where the rail must step aside. Folded again first, if a mode before opened it.
            [ -n "$OPENED" ] && { $D "$DEVICE" pose closed || true; sleep 4; }
            tourfilm tour 1
            shot music-mint 1 8 $M/rmint -tab 2
            $D "$DEVICE" rotate 3 || true; sleep 4
            shot music-mint-fland 1 8 $M/rmint -tab 2
            shot search-fland 1 12 $M -tab 6 -pose search
            $D "$DEVICE" rotate 1 || true; sleep 4
            $D "$DEVICE" pose open; sleep 5
            $D "$DEVICE" rotate 3; sleep 5
            shot music-mint-open 3 8 $M/rmint -tab 2
            shot search-open 3 12 $M -tab 6 -pose search
            tourfilm tour-open 3
            $D "$DEVICE" rotate 1 || true; sleep 5
            OPENED=1
          fi
          if has flick; then
            # The flick in the posture the phone is in by now (open upright after pages or rail, else folded), each film
            # with the hand's log (every haptic, the commit line, the release and the flight, from Caches/hand-log.txt) and
            # what the stand-in Mac was sent.
            FD=1; [ -n "$OPENED" ] && FD=3
            handlog() {
              local c; c=$(xcrun simctl get_app_container "$DEVICE" local.macpro.TV data 2>/dev/null) && [ -f "$c/Library/Caches/hand-log.txt" ] && mv "$c/Library/Caches/hand-log.txt" dist/tv-$1-hand.log || echo "no hand log" > dist/tv-$1-hand.log
              cp /tmp/tv-flick-sends.log dist/tv-$1-sends.log 2>/dev/null || echo "nothing sent" > dist/tv-$1-sends.log
            }
            # A title's page opened by its pose (a film's, and a pasted link's from the Remote), then its card held and
            # carried by a real finger into the lip and let go there. The poses only open the page now (the old flick
            # screen that threw by itself is gone), so the throw is the finger's, at the card's place (what=card).
            posefilm() {
              local name=$1 pose=$2 tab=$3 at x y
              curl -s $M/fnormal/reset > /dev/null
              rm -f /tmp/tv-home-applied.log
              xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$FD --force dist/tv-$name.mp4 > /dev/null 2>&1 & REC=$!
              sleep 4
              xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/fnormal -tab $tab -pose $pose
              sleep 10
              at=$(grep -o 'what=card&x=[0-9.]*&y=[0-9.]*' /tmp/tv-home-applied.log 2>/dev/null | tail -1)
              if [ -n "$at" ]; then
                x=${at#*x=}; x=${x%%&*}; y=${at##*y=}
                $D "$DEVICE" path $x $y 0.7 $x 0.12 0.5 0 $x 0.12 0.2 0 || echo "path failed"
              else echo "no card position for $name"; fi
              sleep 8
              cp /tmp/tv-home-applied.log dist/tv-$name-applied.log 2>/dev/null || true
              xcrun simctl io "$DEVICE" screenshot --display=$FD dist/tv-$name-end.png
              kill -INT $REC; wait $REC
              xcrun simctl terminate "$DEVICE" local.macpro.TV || true
              handlog $name
            }
            posefilm flick flick-starting 1
            posefilm flicklink flick-link 0
            # A real finger on Watch's first shelf card (where the app says it is: what=card): held and thrown, held and put
            # back sideways, held and carried slowly into the lip and let go there, and dragged straight up with no hold
            # (the shelf's quick lift).
            shelffilm() {
              local name=$1 how=$2 x=0.15 y=0.33 at
              curl -s $M/fnormal/reset > /dev/null
              rm -f /tmp/tv-home-applied.log
              xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$FD --force dist/tv-$name.mp4 > /dev/null 2>&1 & REC=$!
              sleep 3
              xcrun simctl launch "$DEVICE" local.macpro.TV -address $M/fnormal -tab 3 -pose shelf
              sleep 10
              at=$(grep -o 'what=card&x=[0-9.]*&y=[0-9.]*' /tmp/tv-home-applied.log 2>/dev/null | tail -1)
              if [ -n "$at" ]; then x=${at#*x=}; x=${x%%&*}; y=${at##*y=}; else echo "no card position for $name"; fi
              case $how in
                # Held 0.7 s (the lift at 0.15 s), then: a quick flick up a quarter of the screen in 0.12 s, let go moving;
                # carried sideways and let go (must go back, nothing sent); a slow carry up into the lip over 1.5 s, a rest
                # there and let go (a throw at any speed); and no hold at all, a drag straight up (the shelf's quick lift).
                throw) $D "$DEVICE" path $x $y 0.7 $x $(echo "$y - 0.25" | bc -l) 0.12 0 || echo "path failed" ;;
                back) $D "$DEVICE" path $x $y 0.7 $(echo "$x + 0.2" | bc -l) $y 0.4 0 || echo "path failed" ;;
                carry) $D "$DEVICE" path $x $y 0.7 $x 0.12 1.5 0 $x 0.12 0.4 0 || echo "path failed" ;;
                quickup) $D "$DEVICE" path $x $y 0.02 $x $(echo "$y - 0.3" | bc -l) 0.25 0 || echo "path failed" ;;
              esac
              sleep 12
              xcrun simctl io "$DEVICE" screenshot --display=$FD dist/tv-$name-end.png
              kill -INT $REC; wait $REC
              xcrun simctl terminate "$DEVICE" local.macpro.TV || true
              cp /tmp/tv-home-applied.log dist/tv-$name-applied.log 2>/dev/null || true
              handlog $name
            }
            for H in throw back carry quickup; do shelffilm shelf-$H $H; done
          fi
          if has tour; then
            [ -z "$OPENED" ] && tourfilm tour 1
            [ -z "$OPENED" ] && { $D "$DEVICE" pose open; sleep 5; $D "$DEVICE" rotate 1; sleep 5; }
            tourfilm tour-portrait 3
            # A film playing, its clock running: how many of the TV's readings are put on screen, as before and now.
            SCENE=$M/rfilm tourfilm tour-film-every 3 -everyReading YES
            SCENE=$M/rfilm tourfilm tour-film 3
          fi
          cp /tmp/tv-hitches.log dist/tv-hitches.log 2>/dev/null || true
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../quick.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../quick.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view tv-quick >/dev/null 2>&1 || gh release create tv-quick --prerelease --title "TV quick checks" --notes "Work in progress on the TV app: shots and logs from the tv-quick branch."
          for f in quick.zip status.txt; do
            for i in 1 2 3; do gh release upload tv-quick "$f" --clobber && break; sleep 15; done
          done
