name: Chumby pass 11-22 (branch)
# The chumby-pass-1122 branch's own run (never main), after chumby-debug.yml of 00c6c6a: every tab in every posture
# (folded, open flat, open upright), the ring films (Home's card snoozed then stopped, the ringing page, the slide to stop
# let go short, presses from the Lock Screen's doors), a nap set and called off, a channel reordered with a real finger
# (with the app's log), the empty channel, and the Lock Screen card and the island from the widget's own pieces.
# Published to the chumby-pass-1122 release. Temporary: goes when the branch merges.
on:
  push:
    branches: [chumby-pass-1122]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chumby-pass-1122
  cancel-in-progress: true
jobs:
  pass:
    runs-on: xcode-27
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Alarm logic tests
        run: ci/chumby-tests.sh
      - name: Draw the Chumby launch sea and wordmark
        run: swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in Chumby GalleryChumby; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | grep -E "error:|warning: unre|BUILD" | tail -40
          done
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 140
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/GalleryChumby.app
          node ci/mock-chumby.js & MOCK=$!
          sleep 2
          M=http://127.0.0.1:9000
          remock() { kill $MOCK 2>/dev/null; wait $MOCK 2>/dev/null; node ci/mock-chumby.js & MOCK=$!; sleep 2; }
          shot() { # name, display, wait, address, args
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/p-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Chumby data 2>/dev/null) && [ -f "$C/Library/Caches/swipe-log.txt" ] && mv "$C/Library/Caches/swipe-log.txt" dist/p-$name-swipe.log || true
          }
          film() { # name, display, seconds, address, args
            local name=$1 display=$2 secs=$3 address=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --display=$display --codec=h264 --force dist/p-$name.mp4 > /dev/null 2>&1 &
            local rec=$!
            sleep 2
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $address "$@"
            sleep $secs
            kill -INT $rec; wait $rec
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Chumby data 2>/dev/null) && [ -f "$C/Library/Caches/swipe-log.txt" ] && mv "$C/Library/Caches/swipe-log.txt" dist/p-$name-swipe.log || true
          }
          warm() { xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $1 -tab 0; sleep 10; xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true; sleep 1; }
          gallery() { # page, display, name
            xcrun simctl launch "$DEVICE" local.macpro.GalleryChumby -page $1
            sleep 8
            xcrun simctl io "$DEVICE" screenshot --display=$2 dist/p-$3.png
            xcrun simctl terminate "$DEVICE" local.macpro.GalleryChumby || true
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          rec() { # name, display, address, args
            local name=$1 display=$2 address=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --display=$display --codec=h264 --force dist/p-$name.mp4 > /dev/null 2>&1 &
            REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $address "$@"
          }
          cut() { # name, display
            xcrun simctl io "$DEVICE" screenshot --display=$2 dist/p-$1-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Chumby data 2>/dev/null) && [ -f "$C/Library/Caches/swipe-log.txt" ] && mv "$C/Library/Caches/swipe-log.txt" dist/p-$1-swipe.log || true
          }
          # The ringing page's slide to stop under a finger: a short slide let go (the key must travel home over frames),
          # then the whole run (the Chumby stops, the page leaves).
          slide() { # name, display, x of the key at rest, x at the run's end, y of the bar
            remock; warm $M/liveringing; rec $1 $2 $M/liveringing -tab 0 -pose ringscreen -swipeLog YES
            sleep 16
            local mid=$(echo "$3 + ($4 - $3) * 0.35" | bc -l)
            $D "$DEVICE" drag $3 $5 $mid $5 0.8 || echo "slide failed"; sleep 2
            $D "$DEVICE" drag $3 $5 $mid $5 0.3 || echo "slide failed"; sleep 2
            $D "$DEVICE" drag $3 $5 $4 $5 0.6 || echo "slide failed"; sleep 5
            cut $1 $2
          }
          tabs() { # display, suffix
            shot home$2 $1 9 $M -tab 0
            shot channels$2 $1 10 $M -tab 1
            shot alarms$2 $1 9 $M -tab 2
            shot sounds$2 $1 9 $M -tab 3
            shot tinker$2 $1 9 $M -tab 4
            shot home-ringing$2 $1 9 $M/ringing -tab 0
            shot home-snoozed$2 $1 9 $M/snoozed -tab 0
            shot ringpage$2 $1 9 $M/ringing -tab 0 -pose ringscreen
            shot ringpage-snoozed$2 $1 9 $M/snoozed -tab 0 -pose ringscreen
            shot channels-edit$2 $1 10 $M -tab 1 -pose chedit
            shot channels-empty$2 $1 10 $M/chempty -tab 1
            shot alarms-nap$2 $1 11 $M/nap -tab 2 -pose napset
            shot alarms-editor$2 $1 20 $M -tab 2 -pose editor -swipeLog YES
            # Ring, Snooze (3.5 s in), Stop (4 s later) on Home's card: the leaving card says "Stopping…" alone.
            remock; warm $M/liveringing; film ringdemo$2 $1 16 $M/liveringing -tab 0 -pose ringdemo -swipeLog YES
            # The ringing page: Snooze at 5 s, slid to Stop at 10 s.
            remock; warm $M/liveringing; film ringpage$2 $1 18 $M/liveringing -tab 0 -pose ringpagedemo -swipeLog YES
            # A nap set from its chip, counting down, and called off (the row keeps its own words as it fades).
            remock; film napdemo$2 $1 26 $M/live -tab 2 -pose napdemo
            # An alarm starting to ring while Home shows the next alarm (12 s after the first reading).
            remock; film ringsoon$2 $1 26 $M/liveringsoon -tab 0 -swipeLog YES
            # An alarm's editor opening, and its log (where the open costs the main thread).
            remock; film editoropen$2 $1 14 $M -tab 2 -pose editor -swipeLog YES
            # Calendar settings, then the way back: Back (folded and upright) or Done (open flat, in its pane).
            remock; rec backtap$2 $1 $M/live -tab 2 -pose calsettings -swipeLog YES
            sleep 20; xcrun simctl io "$DEVICE" screenshot --display=$1 dist/p-backtap$2-pushed.png
            $D "$DEVICE" tree > dist/p-backtap$2-tree.log 2>&1 || true
            $D "$DEVICE" tap "Back" || $D "$DEVICE" tap "Alarms" || $D "$DEVICE" tap "Done" || echo "back failed"; sleep 4
            cut backtap$2 $1
          }
          xcrun simctl ui "$DEVICE" appearance light
          # Folded.
          $D "$DEVICE" pose closed || true; sleep 5
          tabs 1 ""
          # Snooze, then Stop, pressed as the Lock Screen's card and the notification press them, through an old copy of sys.
          remock; warm $M/livestale; film ringdoor 1 16 $M/livestale -tab 0 -pose ringdoor
          # The launch from cold with the launch screen's snapshot cleared, so iOS draws the sea afresh: filmed from before
          # the launch.
          xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Chumby data 2>/dev/null) && rm -rf "$C/Library/SplashBoard" "$C/Library/Caches/Snapshots" || true
          remock; film launch 1 12 $M -tab 0
          # A warm launch into Channels: the rows there from the first frame, never filling in.
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 1; sleep 10; xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true; sleep 1
          film channelswarm 1 10 $M -tab 1 -swipeLog YES
          # Calendar settings pushed and swiped away from the display's leading edge.
          remock; rec swipeback 1 $M/live -tab 2 -pose calsettings
          sleep 20
          $D "$DEVICE" drag 0.01 0.5 0.75 0.5 0.45 || echo "swipe failed"; sleep 4
          cut swipeback 1
          # Channels: a channel of six in Edit, the last widget dragged to the top by its grip, then the second down two.
          remock; rec chdrag 1 $M/livemany -tab 1 -pose chedit -swipeLog YES
          sleep 24
          # As a person does it: the fifth row let go over the top half of the first (chmove [4] -> 0), then the first
          # carried below the last (chmove [0] -> 6).
          $D "$DEVICE" drag 0.75 0.675 0.75 0.255 2.5 || echo "drag failed"; sleep 3
          $D "$DEVICE" drag 0.75 0.275 0.75 0.80 2.0 || echo "drag failed"; sleep 3
          cut chdrag 1
          slide ringslide 1 0.12 0.80 0.864
          gallery 4 1 card
          gallery 7 1 card-long
          gallery 5 1 island
          gallery 6 1 card-working
          # Open flat.
          $D "$DEVICE" pose open; sleep 5
          tabs 3 "-open"
          slide ringslide-open 3 0.585 0.88 0.58
          # Open upright (his posture).
          $D "$DEVICE" rotate 1; sleep 5
          tabs 3 "-portrait"
          slide ringslide-portrait 3 0.17 0.80 0.65
          # A channel of six in Edit, open upright: the last widget dragged up and let go over the top half of the first
          # row (chmove … -> 0), then the second down two.
          remock; rec chdrag-portrait 3 $M/livemany -tab 1 -pose chedit -swipeLog YES
          sleep 22
          $D "$DEVICE" drag 0.826 0.530 0.826 0.235 2.5 || echo "drag failed"; sleep 3
          $D "$DEVICE" drag 0.826 0.245 0.826 0.625 2.0 || echo "drag failed"; sleep 3
          cut chdrag-portrait 3
          # A posture change with the app up: open upright to open flat and back (filmed as the display is mounted).
          now() { python3 -c 'import time; print(time.time())'; }
          remock; T0=$(now); rec posture 3 $M -tab 2
          sleep 12; T1=$(now); $D "$DEVICE" rotate 3; echo "rotate 3 -> $?"; sleep 8; T2=$(now); $D "$DEVICE" rotate 1; echo "rotate 1 -> $?"; sleep 8
          cut posture 3
          # Upright, then flat, then upright again, each part turned the right way up (the recorder starts at T0).
          TURNS=$(python3 -c "t0=$T0+0.2; print(f'180@0,90@{$T1-t0:.2f},180@{$T2-t0:.2f}')"); echo "posture turns $TURNS"
          swift ci/film-turn.swift dist/p-posture.mp4 dist/p-posture.t.mp4 "$TURNS" && mv dist/p-posture.t.mp4 dist/p-posture.mp4
          # Films the right way up: open flat a quarter turn, open upright a half (simctl records the display as mounted).
          for f in dist/p-*-open*.mp4; do [ -f "$f" ] && swift ci/film-turn.swift "$f" "$f.t.mp4" 90 && mv "$f.t.mp4" "$f"; done
          for f in dist/p-*-portrait.mp4; do [ -f "$f" ] && swift ci/film-turn.swift "$f" "$f.t.mp4" 180 && mv "$f.t.mp4" "$f"; done
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../pass-shots.zip . -i '*.png' '*.log' || zip -q ../pass-shots.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          # Afresh each run, so a film this run didn't make can't be taken for one of its own.
          gh release delete chumby-pass-1122 --yes >/dev/null 2>&1 || true
          gh release create chumby-pass-1122 --prerelease --title "Chumby pass 11-22" --notes "Work in progress: shots, films and logs from the chumby-pass-1122 branch."
          for f in pass-shots.zip status.txt dist/p-*.mp4; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload chumby-pass-1122 "$f" --clobber && break; sleep 15; done
          done
