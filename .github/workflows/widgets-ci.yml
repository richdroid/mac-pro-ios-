name: Widgets CI
# Work in progress on the three apps' widgets, pushed to the widgets-polish branch (never main): every widget in every
# family, look and state, rendered by the galleries as PNG sheets (ci/widget-sheet), the Live Activity's gallery pages,
# and a simulator build of the three apps with their widget extensions. Published to the widgets-ci release.
on:
  push:
    branches: [widgets-polish]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widgets-ci
  cancel-in-progress: true
jobs:
  sheets:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the galleries for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in GalleryMac GalleryChumby GalleryTV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | grep -E "error:|BUILD" | tail -20
          done
      - name: Sheets
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          node ci/mock-chumby.js &
          sleep 2
          for G in Mac Chumby TV; do
            xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Gallery$G.app || { echo "Gallery$G did not install"; continue; }
            xcrun simctl launch "$DEVICE" local.macpro.Gallery$G -sheets YES
            DATA=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Gallery$G data)
            # The last sheet each gallery writes is its StandBy one.
            LOWER=$(echo $G | tr A-Z a-z)
            for i in $(seq 1 60); do [ -f "$DATA/Documents/sheets/$LOWER-standby.png" ] && break; sleep 2; done
            sleep 2
            cp "$DATA"/Documents/sheets/*.png dist/ || echo "no sheets from Gallery$G"
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/zz-gallery-$G-screen.png
            xcrun simctl terminate "$DEVICE" local.macpro.Gallery$G || true
          done
          # The Live Activity, as the TV gallery draws it (island opened and small, and the Lock Screen card).
          for P in island-open0 island-open1 island-open2 island-open3 island-lock0 island-lock1 island-lock2; do
            xcrun simctl launch "$DEVICE" local.macpro.GalleryTV -page $P
            sleep 14
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-$P.png
            xcrun simctl terminate "$DEVICE" local.macpro.GalleryTV || true
          done
          ls dist
      - name: Build the apps and their widgets for the simulator
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          for APP in MacPro Chumby TV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build-apps.log | grep -E "error:|BUILD" | tail -20
          done
          grep -c "BUILD SUCCEEDED" dist/build-apps.log > dist/apps-built.txt || true
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../sheets.zip . -i '*.png' '*.log' '*.txt' || zip -q ../sheets.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }} apps-built=$(cat dist/apps-built.txt 2>/dev/null || echo 0)" > status.txt
          gh release view widgets-ci >/dev/null 2>&1 || gh release create widgets-ci --prerelease --title "Widgets CI" --notes "Work in progress on the widgets: sheets from the widgets-polish branch."
          for f in sheets.zip status.txt; do
            for i in 1 2 3; do gh release upload widgets-ci "$f" --clobber && break; sleep 15; done
          done
