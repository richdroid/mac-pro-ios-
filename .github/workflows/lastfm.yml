name: Last.fm app
# The Last.fm app alone, on its own branch (never main): built unsigned for the iPhone, then shot and filmed in the
# simulator's Duo on the bundled mock (no key in CI), folded, open upright (the posture Richard holds) and open flat.
# Published to the lastfm-latest release; nothing else is touched.
# Two jobs: the shots (every posture, published as soon as they're taken), then the films on a runner of their own, so
# a gate never waits on the films and a slow or stuck film can't cost the shots (run 35 lost 118 of them that way).
on:
  push:
    branches: [lastfm]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lastfm
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned for iPhone
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Release -sdk iphoneos \
            -derivedDataPath build CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee dist/build.log | tail -1
          rm -rf dist/Payload; mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/LastFM.app dist/Payload/
          (cd dist && zip -qry LastFM.ipa Payload && rm -rf Payload)
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          # The widgets' gallery: every family, look and state drawn as sheets.
          xcodebuild -project MacPro.xcodeproj -scheme GalleryLastFM -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          # The simulator build for the films job, kept as a zip (ditto keeps the bundle whole).
          ditto -c -k --keepParent build-sim/Build/Products/Debug-iphonesimulator/LastFM.app LastFM-sim.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lastfm-sim
          path: LastFM-sim.zip
          retention-days: 2
      - name: Shots
        continue-on-error: true
        # Shots only, no films: about 40 minutes.
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          . ci/lfm-sim.sh
          sim_setup build-sim/Build/Products/Debug-iphonesimulator/LastFM.app
          ZIP=shots.zip
          # The widgets: every family, look and state, drawn by the gallery as sheets.
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/GalleryLastFM.app
          xcrun simctl launch "$DEVICE" local.macpro.GalleryLastFM -sheets YES
          sleep 40
          G=$(xcrun simctl get_app_container "$DEVICE" local.macpro.GalleryLastFM data 2>/dev/null) && cp "$G"/Documents/sheets/*.png dist/ 2>/dev/null
          xcrun simctl terminate "$DEVICE" local.macpro.GalleryLastFM || true
          ls dist | grep -c lfm-widgets || echo "NO WIDGET SHEETS"
          # Every tab and page in one posture: name suffix, display. Tabs: 0 you (Start, panels 0 stats, 1 now, 2 lately,
          # 3 story), 1 charts, 2 library, 3 discover.
          everything() {
            local x=$1 d=$2
            shot start$x $d 9 -tab 0
            shot now$x $d 12 -tab 0 -panel 1
            shot now-idle$x $d 8 -tab 0 -panel 1 -playing NO
            # Long enough for his picture and the covers to be in (run 36: placeholder discs at 9 s).
            shot lately$x $d 14 -tab 0 -panel 2
            shot story$x $d 9 -tab 0 -panel 3
            shot charts$x $d 9 -tab 1
            shot library$x $d 9 -tab 2
            shot discover$x $d 10 -tab 3
            shot track$x $d 10 -tab 0 -pose track
            shot artist$x $d 11 -tab 0 -pose artist
            shot album$x $d 11 -tab 0 -pose album
            shot weeks$x $d 10 -tab 1 -pose weeks
            shot search$x $d 9 -tab 2 -pose search
            # States the first rounds never showed: the other shelves, a 5×5 of artists, a year of tracks.
            shot loved$x $d 9 -tab 2 -shelf 3
            shot tracks$x $d 9 -tab 2 -shelf 2
            shot charts-5x5$x $d 10 -tab 1 -grid 5 -kind 0 -pose collage
            shot charts-year$x $d 11 -tab 1 -period 4 -kind 2
            # A long user name with no real name set: whole on the first section, small and whole over the others.
            shot name$x $d 9 -tab 0 -mockName midnightsignal
            shot name-story$x $d 9 -tab 0 -panel 3 -mockName midnightsignal
            shot scrub$x $d 9 -tab 0 -panel 1 -pose scrub
            # Last.fm gone: every call fails and nothing kept is used; -mockDown also dates the failures 30 s back, so
            # the note is up from the first failed call.
            shot down$x $d 20 -tab 0 -mockDown YES
            shot now-down$x $d 20 -tab 0 -panel 1 -mockDown YES
            shot discover-down$x $d 25 -tab 3 -mockDown YES
          }
          date
          folded
          # First, since -fresh empties his history: a stretch not yet read from his own history, asked of Last.fm while
          # it's gone, shows its note. Then the history read in full at normal speed for everything after, the insights
          # that need all of it, the track lengths and Discover's first list.
          shot charts-down 1 25 -tab 1 -period 2 -fresh YES -mockDown YES
          shot start-first 1 40 -tab 0
          shot discover-first 1 20 -tab 3
          # A launch on Lately to fetch its art before it's shot, so the shot isn't the first look after the -fresh read.
          shot lately-warm 1 14 -tab 0 -panel 2
          everything "" 1
          early folded
          date
          # Open upright: the posture he holds.
          upright
          everything "-portrait" 3
          early upright
          # Open flat, two panes.
          flat
          everything "-open" 3
          early flat
          # Folded and turned sideways, a posture he can hold too.
          folded
          TURN=landscape shot start-fland 1 9 -tab 0
          TURN=landscape shot now-fland 1 8 -tab 0 -panel 1
          TURN=landscape shot now-idle-fland 1 8 -tab 0 -panel 1 -playing NO
          TURN=landscape shot lately-fland 1 9 -tab 0 -panel 2
          TURN=landscape shot charts-fland 1 9 -tab 1
          TURN=landscape shot library-fland 1 9 -tab 2
          TURN=landscape shot artist-fland 1 11 -tab 0 -pose artist
          TURN=landscape shot track-fland 1 10 -tab 0 -pose track
          date
          # How long each launch took to its first frame, step by step (-launchLog).
          C=$(xcrun simctl get_app_container "$DEVICE" $APP data 2>/dev/null) && cp "$C/Library/Caches/launch-log.txt" dist/launch.log 2>/dev/null
          ls dist | grep -c png
      - name: Publish shots
        if: always()
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          . ci/lfm-sim.sh
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr ../apps.zip . -i '*.ipa' '*.log' || zip -q ../apps.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }} run $GITHUB_RUN_NUMBER" > status.txt
          release
          upload shots.zip apps.zip status.txt
  films:
    # After the shots, on the build they made; never holding them up.
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lastfm-sim
      - name: Films
        continue-on-error: true
        # Run 37 reached 75 minutes in the upright films (the posture changes take a minute each on the runner).
        timeout-minutes: 125
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p dist
          exec > >(tee dist/films.log) 2>&1
          ditto -x -k LastFM-sim.zip sim-app
          . ci/lfm-sim.sh
          sim_setup sim-app/LastFM.app
          ZIP=film-shots.zip
          date
          folded
          # The first launch: the whole history read in, filmed on You, slowed so it can be seen; then read in full at
          # normal speed for the films after it.
          STEPS="shot:6 shot:8 shot:8" film sync 1 34 -tab 0 -fresh YES -mockSyncSlow YES -pose sync
          shot films-ready 1 40 -tab 0
          shot films-ready-discover 1 20 -tab 3
          # The pivots: Charts' stretches and the Library's shelves, swiped through and back; You across its sections.
          STEPS="sideslow:6 shot:2 side:2 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:1 sideback:2 sideback:2 shot:2" film pan-start 1 28 -tab 0
          Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:1 sideback:2 sideback:2 shot:2" film pivot-charts 1 26 -tab 1
          Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 sideback:2 sideback:2 shot:2" film pivot-library 1 24 -tab 2
          STEPS="slow:10 shot:2 fling:2 shot:2 fling:2 shot:2 pull:2 flingback:2 flingback:2" film scroll-now 1 26 -tab 0 -panel 1
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 slow:2 shot:2" film scroll-now-idle 1 20 -tab 0 -panel 1 -playing NO
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2 flingback:2" film scroll-you 1 30 -tab 0
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2 flingback:2" film scroll-story 1 34 -tab 0 -panel 3
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-lately 1 22 -tab 0 -panel 2
          # A widget's link into the app while it's open: to a section, then to an artist's page. The simulator asks
          # "Open in Rotation?" for a link from outside: Open is tapped (left up, it sat over every later shot in run 18).
          TX=0.57 TY=0.51 LINK="rotation://lately" STEPS="link:6 shot:1 tap:2 shot:3" film link-lately 1 14 -tab 0
          TX=0.57 TY=0.51 LINK="rotation://artist?name=Glass%20Harbor" STEPS="link:6 tap:2 shot:4" film link-artist 1 16 -tab 1
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2" film scroll-charts 1 28 -tab 1
          STEPS="slow:7 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 edge:2 shot:2" film artist-scroll 1 26 -tab 0 -pose artist
          STEPS="shot:12 shot:12" film live 1 30 -tab 0 -panel 1 -mockAdvance 11
          # The films the run 39 review found missing. Opened a second time: whole in its first frame, nothing arriving.
          STEPS="shot:8 relaunch:2 shot:1 shot:2 shot:4" film launch-warm 1 20 -tab 0
          # Two swipes a fifth of a second apart, there and back: the second is never thrown back.
          Y=0.6 STEPS="side2:6 shot:2 side2:2 shot:2 sideback2:2 shot:2 sideback2:2 shot:2" film pivot-quick 1 24 -tab 1
          # A poll every 2 s and a new song every 5, under a finger that never stops: no row moves but by the finger.
          STEPS="slow:6 slow:1 slow:1 fling:1 slow:1 flingback:1 slow:1 shot:2" film scroll-poll 1 20 -tab 0 -panel 1 -pollEvery 2 -mockAdvance 5
          # Last.fm saying nothing is on for one poll in three: the song and its section's name stay as they are.
          STEPS="shot:8 shot:4 shot:4 shot:4 shot:4" film live-gap 1 30 -tab 0 -panel 1 -mockGap YES -pollEvery 3
          # A page opened by a tap on a row (an artist, an album, a song), and Back by its button; then by a slow drag
          # from the edge, held most of the way across.
          STEPS="tap=0.4,0.62:7 shot:1 shot:2 tap=0.895,0.29:1 shot:1 shot:2" film tap-artist 1 18 -tab 1 -kind 0
          STEPS="tap=0.4,0.62:7 shot:1 shot:2 tap=0.895,0.29:1 shot:1 shot:2" film tap-album 1 18 -tab 1 -kind 1
          STEPS="tap=0.4,0.62:7 shot:1 shot:2 tap=0.895,0.29:1 shot:1 shot:2" film tap-track 1 18 -tab 1 -kind 2
          STEPS="tap=0.4,0.62:7 shot:3 edgeslow:1 shot:1 shot:3" film back-swipe-slow 1 20 -tab 1 -kind 0
          early films-folded
          # Turned on what's playing and on an artist's page, as on You.
          STEPS="landscape:6 shot:2 portrait:6 shot:2" film posture-now 1 22 -tab 0 -panel 1
          STEPS="landscape:8 shot:2 portrait:6 shot:2" film posture-artist 1 24 -tab 0 -pose artist
          # Postures changed live. Folded on You, turned sideways and back: the outer display filmed.
          STEPS="landscape:6 shot:2 portrait:6 shot:2" film posture-outer 1 22 -tab 0
          # Opened upright on Charts and scrolled, turned flat, half folded, flat again, upright: the inner display filmed
          # from open (recording it folded gives an empty film).
          upright
          STEPS="slow:6 shot:2 landscape:6 shot:2 partial:6 shot:2 open:6 shot:2 portrait:6 shot:2" film posture-inner 3 44 -tab 1
          # Open upright: the films the gate reads in that posture.
          upright
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 pull:2 flingback:2" film scroll-now-portrait 3 20 -tab 0 -panel 1
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-story-portrait 3 26 -tab 0 -panel 3
          Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 sideback:2 sideback:2 shot:2" film pivot-charts-portrait 3 18 -tab 1
          STEPS="sideslow:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pan-name-portrait 3 20 -tab 0 -mockName midnightsignal
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2" film scroll-charts-portrait 3 26 -tab 1
          Y=0.6 STEPS="side2:6 shot:2 sideback2:2 shot:2" film pivot-quick-portrait 3 16 -tab 1
          STEPS="tap=0.4,0.62:7 shot:1 shot:2 edgeslow:1 shot:1 shot:3" film tap-artist-portrait 3 20 -tab 1 -kind 0
          STEPS="shot:8 relaunch:2 shot:1 shot:2 shot:4" film launch-warm-portrait 3 20 -tab 0
          early films-upright
          # Open flat, two panes.
          flat
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-story-open 3 18 -tab 0 -panel 3
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2" film scroll-now-open 3 18 -tab 0
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-charts-open 3 18 -tab 1
          X=0.72 STEPS="slow:7 shot:2 fling:2 shot:2 edge:2 shot:2" film artist-scroll-open 3 20 -tab 0 -pose artist
          STEPS="tap=0.72,0.62:7 shot:1 shot:2 edgeslow:1 shot:1 shot:3" film tap-artist-open 3 20 -tab 1 -kind 0
          date
          # The simulator stopped before any film is shrunk: shrinking beside it failed with "Cannot Decode" (runs 34, 35).
          xcrun simctl shutdown "$DEVICE"
      - name: Publish films
        if: always()
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          . ci/lfm-sim.sh
          mkdir -p dist
          # The films' stills first, so they're up whatever happens to the films.
          (cd dist && zip -qr ../film-shots.zip . -i '*.png' || zip -q ../film-shots.zip /dev/null)
          release
          upload film-shots.zip
          swiftc -O -o /tmp/lfm-shrink ci/lfm-shrink.swift 2>&1 | tail -3
          # 20 minutes for all the shrinking, two at a time; then whatever is left is kept as filmed if under 80 MB.
          bash ci/lfm-shrink-all.sh dist small 1200 2 | tee dist/publish.log
          (cd small && ls -la >> ../dist/publish.log)
          (cd small && zip -q0 ../films-upright.zip *-portrait*.mp4 lfm-posture-*.mp4 2>/dev/null; zip -q0 ../films-flat.zip *-open*.mp4 2>/dev/null; ls *.mp4 2>/dev/null | grep -v -e '-portrait' -e '-open' -e '^lfm-posture-' | zip -q0 ../films.zip -@ 2>/dev/null)
          for z in films.zip films-upright.zip films-flat.zip; do [ -f $z ] || zip -q $z /dev/null; done
          ls -la films*.zip | tee -a dist/publish.log
          upload films.zip films-upright.zip films-flat.zip
          # Last, so a gate knows these films are this run's: what went up, and the films' logs.
          (echo "$GITHUB_SHA films run $GITHUB_RUN_NUMBER"; cd small && ls -la *.mp4 2>/dev/null) > films.txt
          # The app's own frame times, film by film: every film's line of totals in one file, the second-by-second logs
          # in the zip. A film missing from hitches.txt has no evidence of its smoothness.
          for f in dist/hitches-*.txt; do [ -f "$f" ] && echo "$(basename "$f" .txt | sed 's/^hitches-//') $(head -1 "$f")"; done > hitches.txt
          (cd dist && zip -q ../films-logs.zip films.log publish.log hitches-*.txt 2>/dev/null || zip -q ../films-logs.zip /dev/null)
          upload films.txt hitches.txt films-logs.zip
