name: Last.fm app
# The Last.fm app alone, on its own branch (never main): built unsigned for the iPhone, then shot and filmed in the
# simulator's Duo on the bundled mock (no key in CI), folded, open upright (the posture Richard holds) and open flat.
# Published to the lastfm-latest release; nothing else is touched.
on:
  push:
    branches: [lastfm]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lastfm
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned for iPhone
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Release -sdk iphoneos \
            -derivedDataPath build CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee dist/build.log | tail -1
          rm -rf dist/Payload; mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/LastFM.app dist/Payload/
          (cd dist && zip -qry LastFM.ipa Payload && rm -rf Payload)
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 80
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/LastFM.app
          APP=local.macpro.LastFM
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          # Turn the phone until a display's screenshot has the shape wanted. Device Hub's rotate numbers didn't land the
          # same way in every pose (run 2: "rotate 1" right after closing left the outer display sideways, and open flat
          # 1 and 3 came out the other way round), so the shape is checked rather than assumed.
          orient() {
            local want=$1 display=$2 r w h
            for r in 1 3 2 4 1 3; do
              xcrun simctl io "$DEVICE" screenshot --display=$display /tmp/o.png > /dev/null 2>&1
              w=$(sips -g pixelWidth /tmp/o.png 2>/dev/null | awk '/pixelWidth/{print $2}'); h=$(sips -g pixelHeight /tmp/o.png 2>/dev/null | awk '/pixelHeight/{print $2}')
              if [ -n "$w" ] && { { [ $want = portrait ] && [ "$w" -lt "$h" ]; } || { [ $want = landscape ] && [ "$w" -gt "$h" ]; }; }; then echo "orient $want $display: ${w}x${h}"; return 0; fi
              $D "$DEVICE" rotate $r || true; sleep 4
            done
            echo "orient $want $display FAILED (${w}x${h})"
          }
          $D "$DEVICE" pose closed || true; sleep 4
          orient portrait 1
          # One shot: name, display, wait, then the app's own arguments. A shot is checked for having rendered: a frame taken
          # before the app drew (run 10's lfm-now-portrait.png was the bare ground) compresses to almost nothing, so one
          # under 250 KB is taken again, up to three times, and named in the log if it never fills.
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" $APP -launchLog YES "$@"
            sleep $wait
            local f=dist/lfm-$name.png n=0
            xcrun simctl io "$DEVICE" screenshot --display=$display $f > /dev/null 2>&1
            while [ "$(stat -f %z $f 2>/dev/null || echo 0)" -lt 250000 ] && [ $n -lt 3 ]; do
              n=$((n + 1)); echo "shot $name looked blank ($(stat -f %z $f 2>/dev/null) bytes), again ($n)"; sleep 4
              xcrun simctl io "$DEVICE" screenshot --display=$display $f > /dev/null 2>&1
            done
            [ "$(stat -f %z $f 2>/dev/null || echo 0)" -lt 250000 ] && echo "SHOT BLANK: $name"
            xcrun simctl terminate "$DEVICE" $APP || true
          }
          # One film: name, display, seconds, then the app's own arguments; steps run while it records (STEPS="cmd:wait ...").
          film() {
            local name=$1 display=$2 secs=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/lfm-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $APP -launchLog YES "$@"
            local step cmd wait t=0
            for step in $STEPS; do
              cmd=${step%%:*}; wait=${step##*:}
              sleep $wait; t=$((t + wait))
              case $cmd in
                fling) $D "$DEVICE" drag ${X:-0.5} 0.8 ${X:-0.5} 0.25 0.12 || echo "drag failed";;
                flingback) $D "$DEVICE" drag ${X:-0.5} 0.25 ${X:-0.5} 0.8 0.12 || echo "drag failed";;
                pull) $D "$DEVICE" drag ${X:-0.5} 0.3 ${X:-0.5} 0.85 0.9 || echo "drag failed";;
                slow) $D "$DEVICE" drag ${X:-0.5} 0.75 ${X:-0.5} 0.35 0.9 || echo "drag failed";;
                side) $D "$DEVICE" drag 0.8 ${Y:-0.75} 0.2 ${Y:-0.75} 0.25 || echo "drag failed";;
                edge) $D "$DEVICE" drag ${EX:-0.01} 0.5 0.9 0.5 0.8 || echo "drag failed";;
                tap) $D "$DEVICE" touch ${TX:-0.3} ${TY:-0.3} 0.05 || echo "tap failed";;
                open|partial|closed) $D "$DEVICE" pose $cmd || echo "pose failed";;
                portrait) orient portrait $display;;
                landscape) orient landscape $display;;
                shot) xcrun simctl io "$DEVICE" screenshot --display=$display dist/lfm-$name-$t.png;;
              esac
            done
            sleep $((secs > t ? secs - t : 1))
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/lfm-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $APP || true
            if [ "$(stat -f %z dist/lfm-$name.mp4 2>/dev/null || echo 0)" -lt 20000 ]; then echo "film $name empty"; fi
          }
          # Every tab and page in one posture: name suffix, display. Tabs: 0 now, 1 charts, 2 library, 3 you, 4 discover.
          everything() {
            local x=$1 d=$2
            shot now$x $d 8 -tab 0
            shot now-idle$x $d 8 -tab 0 -playing NO
            shot charts$x $d 9 -tab 1
            shot library$x $d 9 -tab 2
            shot you$x $d 9 -tab 3
            shot discover$x $d 10 -tab 4
            shot track$x $d 10 -tab 0 -pose track
            shot artist$x $d 11 -tab 0 -pose artist
            shot album$x $d 11 -tab 0 -pose album
            shot weeks$x $d 10 -tab 1 -pose weeks
            shot search$x $d 9 -tab 2 -pose search
          }
          date
          # Folded, upright. The first launch: the whole history read in, filmed on You, slowed so it can be seen.
          STEPS="shot:6 shot:8 shot:8" film sync 1 34 -tab 3 -fresh YES -mockSyncSlow YES
          # Read in full at normal speed for everything after (the slowed read above may not have finished), then the
          # insights that need all of it, the track lengths and Discover's first list.
          shot you-first 1 30 -tab 3
          shot discover-first 1 20 -tab 4
          everything "" 1
          shot scrub 1 9 -tab 0 -pose scrub
          STEPS="slow:10 shot:2 fling:2 shot:2 fling:2 shot:2 pull:2 flingback:2 flingback:2" film scroll-now 1 26 -tab 0
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 slow:2 shot:2" film scroll-now-idle 1 20 -tab 0 -playing NO
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2 flingback:2" film scroll-you 1 40 -tab 3
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2" film scroll-charts 1 28 -tab 1
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2" film scroll-library 1 20 -tab 2
          STEPS="slow:7 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 edge:2 shot:2" film artist-scroll 1 26 -tab 0 -pose artist
          STEPS="slow:7 shot:2 fling:2 shot:2 fling:2 shot:2" film album-scroll 1 20 -tab 0 -pose album
          STEPS="slow:7 shot:2 fling:2 shot:2 edge:2 shot:2" film track-film 1 20 -tab 0 -pose track
          STEPS="shot:12 shot:12" film live 1 30 -tab 0 -mockAdvance 11
          film tour 1 22 -tab 0 -pose tour
          # Folded and turned sideways, a posture he can hold too.
          orient landscape 1 || true; orient landscape 1
          shot now-fland 1 8 -tab 0
          shot now-idle-fland 1 8 -tab 0 -playing NO
          shot charts-fland 1 9 -tab 1
          shot you-fland 1 9 -tab 3
          shot artist-fland 1 11 -tab 0 -pose artist
          shot track-fland 1 10 -tab 0 -pose track
          orient portrait 1
          date
          # Postures changed live. Folded on Now, turned sideways and back: the outer display filmed.
          $D "$DEVICE" pose closed || true; sleep 4; orient portrait 1
          STEPS="landscape:6 shot:2 portrait:6 shot:2" film posture-outer 1 22 -tab 0
          # Opened upright on Charts and scrolled, turned flat, half folded, flat again, upright: the inner display filmed
          # from open (recording it folded gives an empty film).
          $D "$DEVICE" pose open || true; sleep 6; orient portrait 3
          STEPS="slow:6 shot:2 landscape:6 shot:2 partial:6 shot:2 open:6 shot:2 portrait:6 shot:2" film posture-inner 3 44 -tab 1
          STEPS="slow:7 shot:2 landscape:6 shot:2 portrait:6 shot:2" film posture-page 3 30 -tab 0 -pose artist
          # Open upright: the posture he holds.
          $D "$DEVICE" pose open || true; sleep 8
          orient portrait 3
          sleep 4
          everything "-portrait" 3
          shot scrub-portrait 3 9 -tab 0 -pose scrub
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 pull:2 flingback:2" film scroll-now-portrait 3 20 -tab 0
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2 flingback:2" film scroll-you-portrait 3 34 -tab 3
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2" film scroll-charts-portrait 3 26 -tab 1
          STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-library-portrait 3 18 -tab 2
          STEPS="slow:7 shot:2 fling:2 shot:2 fling:2 shot:2 edge:2 shot:2" film artist-scroll-portrait 3 22 -tab 0 -pose artist
          film tour-portrait 3 22 -tab 0 -pose tour
          # Open flat, two panes.
          orient landscape 3
          sleep 4
          everything "-open" 3
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 flingback:2" film scroll-now-open 3 18 -tab 0
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-you-open 3 20 -tab 3
          X=0.72 STEPS="slow:6 shot:2 fling:2 shot:2 fling:2 shot:2" film scroll-charts-open 3 18 -tab 1
          X=0.72 STEPS="slow:7 shot:2 fling:2 shot:2 edge:2 shot:2" film artist-scroll-open 3 20 -tab 0 -pose artist
          film tour-open 3 22 -tab 0 -pose tour
          date
          # How long each launch took to its first frame, step by step (-launchLog).
          C=$(xcrun simctl get_app_container "$DEVICE" $APP data 2>/dev/null) && cp "$C/Library/Caches/launch-log.txt" dist/launch.log 2>/dev/null
          cat dist/launch.log 2>/dev/null | head -80
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          # The films at the simulator's full size came to too much for one release asset (run 2's never arrived): each
          # is re-encoded within 1920x1080, frame rate kept, before zipping.
          mkdir -p small
          for f in dist/*.mp4; do avconvert -p Preset1920x1080 -s "$f" -o "small/$(basename "$f")" --replace > /dev/null 2>&1 || cp "$f" small/; done
          (cd small && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          ls -la films.zip
          (cd dist && zip -qr ../apps.zip . -i '*.ipa' '*.log' || zip -q ../apps.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }} run $GITHUB_RUN_NUMBER" > status.txt
          gh release view lastfm-latest >/dev/null 2>&1 || gh release create lastfm-latest --prerelease --title "Last.fm app" --notes "The Last.fm app's own build, shots and films (branch lastfm)." --target lastfm
          for f in shots.zip films.zip apps.zip status.txt; do
            for i in 1 2 3; do gh release upload lastfm-latest "$f" --clobber && break; echo "upload $f failed ($i)"; sleep 15; done
          done
