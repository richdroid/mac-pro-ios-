name: Chumby failnote (branch)
# A working branch's own short run (the 11-12 gate held 424ac9f: a failed switch's note broke its title one piece per
# line, "Could / n't / turn", once the ✕ took its width, and paired it with "The Chumby holds 16 alarms"). Stills of the
# failure note folded, open flat and open upright, light and dark; a film of it with Retry tapped then the ✕; Tinker's
# Connection tile amber and red; a widget's time menu open; folded Home scrolled to its Playing card. Only for pushes to
# chumby-failnote; published to the chumby-failnote-shots release.
on:
  push:
    branches: [chumby-failnote]
permissions:
  contents: write
concurrency:
  group: chumby-failnote
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Chumby launch sea and wordmark
        run: swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme Chumby -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9000
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 2; sleep 12
          xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          still() { # display, name, seconds, address, launch args...
            local d=$1 name=$2 secs=$3 addr=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $addr "$@"
            sleep $secs
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          posture() { # display, suffix
            local d=$1 x=$2
            for A in light dark; do
              xcrun simctl ui "$DEVICE" appearance $A
              still $d pose-failure-$A$x 9 $M/fail -tab 2 -pose failure
            done
            xcrun simctl ui "$DEVICE" appearance light
            still $d pose-homecard$x 10 $M/playing -tab 0 -pose homecard
            # The note at work: Retry (the mock still turns it down, so it comes back), then the ✕ puts it away.
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/chumby-failfilm$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M/fail -tab 2 -pose failure
            sleep 9
            $D "$DEVICE" tap "Retry" || echo "retry tap failed"; sleep 5
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-failfilm-retried$x.png
            $D "$DEVICE" tap "Dismiss" || echo "dismiss tap failed"; sleep 4
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-failfilm-dismissed$x.png
            kill -INT $REC; wait $REC; echo "failfilm$x exit $?"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            for V in "connection-amber http://127.0.0.1:9009" "connection-red $M/dead"; do
              set -- $V
              xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $2 -tab 4
              sleep 12
              for i in 1 2 3 4; do $D "$DEVICE" drag 0.75 0.8 0.75 0.25 0.12 || echo "fling failed"; sleep 1.2; done
              sleep 2
              xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pose-$1$x.png
              xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            done
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 1
            sleep 9
            $D "$DEVICE" tap "Time on screen" || echo "time menu tap failed"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/chumby-pose-timemenu$x.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          $D "$DEVICE" pose closed; sleep 5
          posture 1 ""
          $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
          posture 3 -open
          $D "$DEVICE" rotate 1; sleep 5
          posture 3 -portrait
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p dist/crashes
          cp ~/Library/Logs/DiagnosticReports/*.ips dist/crashes/ 2>/dev/null || true
      - name: Publish the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' '*.ips' '*.mp4' || zip -q ../shots.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view chumby-failnote-shots >/dev/null 2>&1 || gh release create chumby-failnote-shots --target chumby-failnote --prerelease --title "Chumby failnote (branch)" --notes "Branch-only shots."
          for f in shots.zip status.txt; do
            for i in 1 2 3 4; do gh release upload chumby-failnote-shots "$f" --clobber && break; echo "upload of $f failed, try $i"; sleep 20; done
          done
