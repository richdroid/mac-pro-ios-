name: Mac Pro Screen check (branch)
# A short run for the Screen work on its own branch: the Screen's shots and films only, published to their own release
# (macpro-screen-ci), so the macpro-latest shots stay main's. Not for main.
on:
  push:
    branches: [macpro-screen-ci2]
permissions:
  contents: write
concurrency:
  group: macpro-shots
  cancel-in-progress: false
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${FILM_PORT:-9001} "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          film() {
            local name=$1 display=$2 length=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            echo "film $name launch at $(node -e 'console.log(Date.now())')"
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${FILM_PORT:-9001} "$@"
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # Closed (the cover), first.
          FILM_PORT=9012 film screen-wake-after 1 10 -tab 0 -pose screenslow -openScreen YES -screenDepth 32
          FILM_PORT=9013 film screen-wake-idle 1 10 -tab 0 -pose screenslow -openScreen YES -showFPS YES -screenDepth 32
          FILM_PORT=9011 film screen-slow-after 1 14 -tab 0 -pose screenslow -openScreen YES -screenDepth 16
          film screen-fps 1 8 -tab 0 -pose screenfps -openScreen YES
          film screen-kbkey-after 1 17 -tab 0 -pose screenkbfilm -openScreen YES
          film screen-open 1 6 -tab 0 -pose screen -openScreen YES
          shot screen 1 8 -tab 0 -pose screen -openScreen YES
          shot screen-typing 1 8 -tab 0 -pose screentyping -openScreen YES
          shot screen-pinch 1 9 -tab 0 -pose screenpinch -openScreen YES
          shot screen-clip 1 8 -tab 0 -pose screenclip -openScreen YES
          shot screen-clip-none 1 8 -tab 0 -pose screenclipnone -openScreen YES
          # The trackpad's scripted hands: every one carries its own check.
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0 -pose screentrace -openScreen YES
          sleep 6
          cp "$(xcrun simctl get_app_container "$DEVICE" local.macpro.MacPro data)/Documents/screen-input-trace.jsonl" dist/screen-input-trace.log || echo "no screen trace"
          if [ ! -s dist/screen-input-trace.log ]; then echo "TRACE MISSING" > dist/FAILED-screen-trace.log
          elif grep -q '"pass":false' dist/screen-input-trace.log; then grep '"pass":false' dist/screen-input-trace.log > dist/FAILED-screen-trace.log; fi
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          # Open, in portrait (the posture he holds), for the same.
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          /tmp/dh/.build/release/devicehubctl "$DEVICE" pose open; echo "unfold exit $?"
          sleep 5
          /tmp/dh/.build/release/devicehubctl "$DEVICE" rotate 1; sleep 5
          FILM_PORT=9013 film screen-wake-idle-portrait 3 10 -tab 0 -pose screenslow -openScreen YES -showFPS YES -screenDepth 32
          film screen-open-portrait 3 6 -tab 0 -pose screen -openScreen YES
          film screen-fps-portrait 3 8 -tab 0 -pose screenfps -openScreen YES
          shot screen-laptop-portrait 3 8 -tab 0 -pose screen -openScreen YES -screenPosture laptop
          # Open flat in landscape: the posture of his screenshot.
          /tmp/dh/.build/release/devicehubctl "$DEVICE" rotate 3 || true; sleep 5
          film screen-open-landscape 3 6 -tab 0 -pose screen -openScreen YES
          shot screen-landscape 3 8 -tab 0 -pose screen -openScreen YES
          shot screen-landscape-typing 3 8 -tab 0 -pose screentyping -openScreen YES
          shot screen-landscape-clip-none 3 8 -tab 0 -pose screenclipnone -openScreen YES
          FILM_PORT=9013 film screen-wake-idle-landscape 3 10 -tab 0 -pose screenslow -openScreen YES -showFPS YES -screenDepth 32
          FILM_PORT=9011 film screen-slow-after-landscape 3 14 -tab 0 -pose screenslow -openScreen YES -screenDepth 16
          FILM_PORT=9012 film screen-wake-after-landscape 3 10 -tab 0 -pose screenslow -openScreen YES -screenDepth 32
          film screen-fps-landscape 3 8 -tab 0 -pose screenfps -openScreen YES
          # Postures changing with the Screen up and the keyboard up: closed, opened again, upright, back.
          D=/tmp/dh/.build/release/devicehubctl
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/macpro-screen-kb-posture.mp4 > /dev/null 2>&1 & REC=$!
          sleep 3
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0 -pose screentyping -openScreen YES
          sleep 9
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-kb-1-open-typing.png
          $D "$DEVICE" pose closed || true; sleep 6
          xcrun simctl io "$DEVICE" screenshot --display=1 dist/macpro-screen-kb-2-closed.png
          $D "$DEVICE" pose open || true; sleep 6
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-kb-3-reopened.png
          $D "$DEVICE" rotate 1 || true; sleep 5
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/macpro-screen-kb-4-upright.png
          $D "$DEVICE" rotate 3 || true; sleep 5
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          c=$(xcrun simctl get_app_container "$DEVICE" local.macpro.MacPro data 2>/dev/null) && cp "$c/Library/Caches/regions.txt" dist/macpro-regions.log || true
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view macpro-screen-ci >/dev/null 2>&1 || gh release create macpro-screen-ci --prerelease --target main --title "Mac Pro Screen branch check" --notes "Shots and films of the Screen branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload macpro-screen-ci "$f" --clobber && break; sleep 15; done
          done
