name: Mac Pro remote, Status and tabs (mp-redo)
# Temporary, branch-only: the Dashboard as a remote in each state of the Mac's screen, Status, Control and the tabs in the
# three postures (folded, open upright, open flat at Richard's size and the simulator's), with films of the remote's
# presses being answered, the tabs, and the app left and come back to. Published to the mp-redo release. Removed before merge.
on:
  push:
    branches: [mp-redo]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-redo
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          APP=local.macpro.MacPro
          crashes() {
            local n=0
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/MacPro* 2>/dev/null | head -3); do n=$((n+1)); head -c 40000 "$f" > dist/crash-$n.log; done
            echo "crash reports: $n"
          }
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" $APP || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # A shot after touches: name, display, touches (devicehubctl lines, ; between), app args.
          shotdrag() {
            local name=$1 display=$2 touches=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep 8
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 1.5; done )
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" $APP || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # A film with scripted touches: name, display, tail length, touches, app args.
          film() {
            local name=$1 display=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 "$@"
            sleep 6
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 2; done )
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $APP || true
          }
          # The app left and come back to: on Control (tapped there from Status), another app opened over it, then the app
          # again (must still be Control); then ended behind his back and started again with "Open on" set to Status
          # (must still be Control: left a moment ago). Richard, 2026-11-21: "everytime i go back to the app it
          # inexplicably goes to another tab".
          returns() {
            local x=$1 d=$2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/macpro-return$x.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 -tab 0; sleep 7
            $D "$DEVICE" tap tab.Control || echo "tap failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/macpro-return$x-1-left.png
            xcrun simctl launch "$DEVICE" com.apple.Preferences; sleep 5
            xcrun simctl launch "$DEVICE" $APP; sleep 4
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/macpro-return$x-2-back.png
            xcrun simctl launch "$DEVICE" com.apple.Preferences; sleep 3
            xcrun simctl terminate "$DEVICE" $APP; sleep 2
            xcrun simctl launch "$DEVICE" $APP -address http://127.0.0.1:9001 -startTab 0; sleep 7
            xcrun simctl io "$DEVICE" screenshot --display=$d dist/macpro-return$x-3-relaunched.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" $APP || true
            xcrun simctl terminate "$DEVICE" com.apple.Preferences || true
          }
          # The remote in each state of the Mac's screen: suffix, display, extra args.
          remote() {
            local x=$1 d=$2; shift 2
            shot dash-desk$x $d 8 -tab 6 -pose consoleboard "$@"
            shot dash-bed$x $d 8 -tab 6 -pose consolebed "$@"
            shot dash-page$x $d 8 -tab 6 -pose console "$@"
            shot dash-glance$x $d 8 -tab 6 -pose consoleglance "$@"
            shot dash-asleep$x $d 8 -tab 6 -pose consoleasleep "$@"
            shot dash-behind$x $d 8 -tab 6 -pose consolebehind "$@"
            shot dash-off$x $d 8 -tab 6 -pose consoleoff "$@"
            shot dash-unreachable$x $d 8 -tab 6 -pose unreachable "$@"
          }
          # Status, Control and the rest at rest, then Status and Control pulled up: suffix, display, the x to drag at, extra args.
          pages() {
            local x=$1 d=$2 sx=$3; shift 3
            for t in status:0 apps:1 claude:2 macos:4 control:5; do shot tab-${t%%:*}$x $d 8 -tab ${t##*:} "$@"; done
            shot status-alerts$x $d 9 -tab 0 -pose alerts "$@"
            shotdrag status-low$x $d "drag $sx 0.8 $sx 0.3 0.5" -tab 0 "$@"
            shotdrag control-low$x $d "drag $sx 0.8 $sx 0.2 0.5;drag $sx 0.8 $sx 0.2 0.5;drag $sx 0.8 $sx 0.2 0.5" -tab 5 "$@"
            shotdrag dash-low$x $d "drag $sx 0.8 $sx 0.2 0.5;drag $sx 0.8 $sx 0.2 0.5" -tab 6 -pose consoleboard "$@"
          }
          # The films: the remote's presses each answered (a board, Next, Previous, a switch on and off, Glance on and off);
          # a refusal; the dashboard started from off; every tab tapped in turn.
          films() {
            local x=$1 d=$2 sx=$3; shift 3
            film remote$x $d 3 "tap board.home;tap remote.Next;tap remote.Previous;drag $sx 0.8 $sx 0.3 0.5;tap switch.rotate;tap switch.text;tap switch.glance;tap switch.glance;tap switch.display" -tab 6 -pose consoleboard "$@"
            film remote-fail$x $d 7 "tap board.media" -tab 6 -pose consolefail "$@"
            film remote-start$x $d 3 "tap 'remote.Start the dashboard';tap board.tonight" -tab 6 -pose consoleoff "$@"
            film tabs$x $d 2 "tap tab.Dashboard;tap tab.Control;tap tab.macOS;tap tab.Claude;tap tab.Apps;tap tab.Status;tap tab.Dashboard" -tab 0 "$@"
          }

          # 1. Folded upright (the cover display): the tabs in the system's side strip.
          remote "" 1
          pages "" 1 0.4
          films "" 1 0.4
          returns "" 1
          shot history 1 8 -tab 0 -openHistory cpu
          shot settings 1 8 -tab 9
          # Folded on its side.
          $D "$DEVICE" rotate 1; sleep 5
          shot tab-status-land 1 8 -tab 0
          shot dash-desk-land 1 8 -tab 6 -pose consoleboard
          $D "$DEVICE" rotate 3; sleep 5

          # 2. Open upright (how he holds it): the bar along the foot.
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          remote -portrait 3
          pages -portrait 3 0.5
          films -portrait 3 0.5
          returns -portrait 3
          # His own size open upright (604 x 859 pt).
          shot tab-status-hisportrait 3 8 -tab 0 -windowSize 604x859
          shot dash-desk-hisportrait 3 8 -tab 6 -pose consoleboard -windowSize 604x859

          # 3. Open flat: his size (859 x 604 pt), then the simulator's.
          $D "$DEVICE" rotate 3; sleep 5
          remote -his 3 -windowSize 859x604
          pages -his 3 0.22 -windowSize 859x604
          film remote-his 3 3 "tap board.home;tap remote.Next;tap switch.glance;tap switch.glance" -tab 6 -pose consoleboard -windowSize 859x604
          shot tab-status-open 3 8 -tab 0
          shot tab-control-open 3 8 -tab 5
          shot dash-desk-open 3 8 -tab 6 -pose consoleboard
          shot dash-bed-open 3 8 -tab 6 -pose consolebed
          crashes
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-redo >/dev/null 2>&1 || gh release create mp-redo --prerelease --title "Mac Pro mp-redo shots" --notes "Temporary shots for the mp-redo branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-redo "$f" --clobber && break; sleep 15; done
          done
