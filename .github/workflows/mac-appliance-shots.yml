name: Mac appliance shots (branch only)
# Branch-only: the Dashboard's Music section in every posture. Removed before the branch is merged.
on:
  push:
    branches: [mac-appliance-1125]
permissions:
  contents: write
concurrency:
  group: mac-appliance-shots
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          D=/tmp/dh/.build/release/devicehubctl
          # name, display, port (9001: lyrics off, speaker free; 9061: lyrics on, speaker connected), opened on the Music section.
          music() {
            local name=$1 display=$2 port=$3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:$port -tab 6 -pose music
            sleep 16
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          musics() { music music-off-$2 $1 9001; music music-on-$2 $1 9061; }
          # Folded, the outer display, first (as the Mac Pro run does).
          musics 1 folded
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          $D "$DEVICE" pose open; echo "unfold exit $?"
          sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          musics 3 portrait
          $D "$DEVICE" rotate 3 || true; sleep 5
          musics 3 flat
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mac-appliance-shots >/dev/null 2>&1 || gh release create mac-appliance-shots --prerelease --title "Mac appliance shots" --notes "Branch-only shots; delete at merge."
          for f in shots.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mac-appliance-shots "$f" --clobber && break; sleep 15; done
          done
