name: Rotation profile
# Branch-only (lastfm-prof): Rotation's motions filmed in Release on the simulator with the app's own hitch log, for
# the build on his phone (BEFORE, "before") and for this commit ("after"), on the same runner, so the numbers compare. Published to
# the lastfm-prof release; never touches lastfm-latest.
on:
  push:
    branches: [lastfm-prof]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lastfm-prof
  cancel-in-progress: true
jobs:
  films:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build after and before
        run: |
          set -o pipefail
          brew install xcodegen
          mkdir -p dist
          xcodegen generate
          xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Release -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
          # The before build (63) only when its films are wanted: its films from run 8 are kept (BEFORE=1 films them again).
          # Build 76 (on his phone) beside it on the same runner: the before numbers for the WP7 study pass.
          if [ "${BEFORE:-1}" = 1 ]; then
            git worktree add /tmp/before 9bd29ad63c4df6be459545f4637767030a4a546b
            (cd /tmp/before && xcodegen generate && xcodebuild -project MacPro.xcodeproj -scheme LastFM -configuration Release -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -1)
          fi
      - name: Films
        continue-on-error: true
        timeout-minutes: 100
        run: |
          set +e
          exec > >(tee dist/films.log) 2>&1
          . ci/lfm-sim.sh; . ci/lfm-prof.sh
          touch dist/lands.txt
          sim_setup build-sim/Build/Products/Release-iphonesimulator/LastFM.app
          # The mock's history read once, so every launch after is a warm one.
          xcrun simctl launch "$DEVICE" $APP -hub home; sleep 40; xcrun simctl terminate "$DEVICE" $APP
          # The flick pass (gate on build 70): the paging films in every posture, each posture's touches calibrated first
          # (a swipe must land on the next page before anything is filmed), folded's other motions for regressions.
          folded
          calibrate portrait 1
          films_scroll "" 1
          films_all "" 1
          # A menu word tapped (the WP7 study's leave: the word lifts away first, then the rest turn out).
          Y=0.6 STEPS="side:6 shot:2 tap=0.3,0.5:2 shot:1 shot:2" film home-word 1 16 -hub home
          # Now playing's first side swipe sprang back once (gate on build 71): filmed twice more, each land logged with
          # its drag and release velocity.
          for r in 2 3; do
            Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pivot-now-again$r 1 24 -hub nowPlaying
          done
          upright
          calibrate portrait 3
          films_scroll "-portrait" 3
          # The push from a tile (turnstile out, hub in) and the profile's wrap in this posture too.
          STEPS="shot:4 tap=0.25,0.70:2 shot:1 shot:2" film home-tap-portrait 3 14 -hub home
          Y=0.6 STEPS="side:6 shot:2 tap=0.3,0.5:2 shot:1 shot:2" film home-word-portrait 3 16 -hub home
          Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pivot-wrap-portrait 3 22 -hub profile
          flat
          calibrate landscape 3
          films_scroll "-open" 3
          STEPS="shot:4 tap=0.25,0.70:2 shot:1 shot:2" film home-tap-open 3 14 -hub home
          Y=0.6 X=0.72 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pivot-wrap-open 3 22 -hub profile
          # The same motions on build 76, same runner, named -76: before and after compare.
          B=/tmp/before/build-sim/Build/Products/Release-iphonesimulator/LastFM.app
          if [ -d "$B" ]; then
            xcrun simctl terminate "$DEVICE" $APP 2>/dev/null; xcrun simctl install "$DEVICE" "$B"
            xcrun simctl launch "$DEVICE" $APP -hub home; sleep 30; xcrun simctl terminate "$DEVICE" $APP
            folded
            calibrate portrait 1
            STEPS="shot:4 tap=0.25,0.70:2 shot:1 shot:2 tap=${BACKAT:-0.895,0.29}:2 shot:1 shot:2" film home-tap-76 1 18 -hub home
            Y=0.6 STEPS="side:6 shot:2 tap=0.3,0.5:2 shot:1 shot:2" film home-word-76 1 16 -hub home
            Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:1 sideback:2 sideback:2 shot:2" film home-pan-76 1 26 -hub home
            Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pivot-wrap-76 1 22 -hub profile
            Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 sideback:2 sideback:2 shot:2" film pivot-now-76 1 26 -hub nowPlaying
            STEPS="tap=0.4,0.62:7 shot:1 shot:2 tap=${BACKAT:-0.895,0.29}:1 shot:1 shot:2" film tap-artist-76 1 18 -tab 1 -kind 0
            STEPS="pull:6 shot:1 slow:2 fling:1 fling:1 fling:1 fling:1 push:2 shot:1 flingback:2 flingback:1 shot:2" film scroll-long-76 1 26 -hub history
            upright
            calibrate portrait 3
            STEPS="shot:4 tap=0.25,0.70:2 shot:1 shot:2" film home-tap-portrait-76 3 14 -hub home
            Y=0.6 STEPS="side:6 shot:2 side:2 shot:2 side:2 shot:2 sideback:2 shot:2" film pivot-wrap-portrait-76 3 22 -hub profile
            STEPS="pull:6 shot:1 slow:2 fling:1 fling:1 fling:1 fling:1 push:2 shot:1 flingback:2 flingback:1 shot:2" film scroll-long-portrait-76 3 26 -hub history
          fi
          xcrun simctl shutdown "$DEVICE"
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Nothing built, nothing filmed: the last good run's files stay up (run 7 put empty ones over them).
          [ -d build-sim/Build/Products/Release-iphonesimulator/LastFM.app ] || { echo "no build: nothing published"; exit 0; }
          gh release view lastfm-prof >/dev/null 2>&1 || gh release create lastfm-prof --prerelease --title "Rotation profile" --notes "Rotation's motions filmed (branch lastfm-prof)." --target lastfm-prof
          for f in dist/hitches-*.txt; do [ -f "$f" ] && echo "$(basename "$f" .txt | sed 's/^hitches-//') $(head -1 "$f")"; done > dist/hitches.txt
          echo "$GITHUB_SHA run $GITHUB_RUN_NUMBER" > status.txt
          # Where every swipe landed, and any posture whose touches never calibrated: read with the status.
          cat dist/lands.txt >> status.txt 2>/dev/null
          # Every landing with its drag, release velocity and time from release to rest (ms).
          for f in dist/hitches-*.txt; do [ -f "$f" ] || continue; n=$(basename "$f" .txt | sed 's/^hitches-//'); grep -o 'land .*' "$f" | sed "s/^/$n /"; done > dist/settles.txt
          cat dist/settles.txt >> status.txt 2>/dev/null
          # The stalls' stacks named against this build (LFMStalls.swift samples, atos for the app's frames).
          APPD=build-sim/Build/Products/Release-iphonesimulator/LastFM.app
          ls dist/stalls-*.txt 2>/dev/null | grep -v -- -before > /tmp/sl.txt
          python3 ci/lfm-stall-stacks.py $APPD $(cat /tmp/sl.txt) > dist/stall-stacks.txt 2>&1 || echo "stall stacks failed" >> dist/stall-stacks.txt
          for f in $(cat /tmp/sl.txt); do n=$(basename $f .txt | sed 's/^stalls-//'); python3 ci/lfm-stall-stacks.py $APPD $f > dist/stacks-$n.txt 2>&1; done
          (cd dist && zip -q ../logs.zip films.log build.log hitches*.txt stalls-*.txt stacks-*.txt stall-stacks.txt 2>/dev/null)
          gh release upload lastfm-prof logs.zip dist/hitches.txt dist/stall-stacks.txt dist/lands.txt --clobber
          (cd dist && zip -qr ../film-shots-flick.zip . -i 'lfm-*.png' 2>/dev/null) && gh release upload lastfm-prof film-shots-flick.zip --clobber
          swiftc -O -o /tmp/lfm-shrink ci/lfm-shrink.swift 2>&1 | tail -3
          bash ci/lfm-shrink-all.sh dist small 900 2 > dist/publish.log 2>&1
          (cd small && zip -q0 ../films-flick.zip *.mp4 2>/dev/null || zip -q ../films-flick.zip /dev/null)
          gh release upload lastfm-prof films-flick.zip --clobber
          # Last, so a waiter knows everything of this run is up.
          gh release upload lastfm-prof status.txt --clobber
