name: Mac Pro polish check (branch)
# Branch-only check for the build-276 polish (macOS, Claude, Control, Settings tabs), in all three postures, published
# to its own release (macpro-polish2-ci) so macpro-latest stays main's. Not for main.
on:
  push:
    branches: [macpro-polish2-ci]
permissions:
  contents: write
concurrency:
  group: macpro-polish2
  cancel-in-progress: false
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 70
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # Control flung to its foot by a finger, for Remote access and Health (a scroll-to lands short in a long list).
          footshot() {
            local name=$1 display=$2; shift 2
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 8
            for i in 1 2 3; do /tmp/dh/.build/release/devicehubctl "$DEVICE" drag 0.45 0.85 0.45 0.1 || true; sleep 1; done
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # Status dragged and flung, then Disk free opened and left with a real touch on Back (bx, by: Back's place).
          statusfilm() {
            local name=$1 display=$2 bx=$3 by=$4
            local D=/tmp/dh/.build/release/devicehubctl
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0
            sleep 9
            $D "$DEVICE" drag 0.45 0.8 0.45 0.35 || true; sleep 2
            $D "$DEVICE" drag 0.45 0.35 0.45 0.85 || true; sleep 2
            $D "$DEVICE" drag 0.45 0.85 0.45 0.1 || true; sleep 3
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0 -openHistory disk
            sleep 10
            $D "$DEVICE" touch $bx $by 0.08 || echo "tap failed"; sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-back.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          poses() {
            local d=$1 x=$2
            for T in 0 1 2 4 5 9; do shot tab$T$x $d 7 -tab $T; done
            shot longlog$x $d 9 -tab 4 -pose longlog
            shot upgradefail$x $d 9 -tab 4 -pose upgradefail
            shot upgradeask$x $d 9 -tab 4 -pose upgradeask
            shot claude-bottom$x $d 9 -tab 2 -pose claudecard
            shot claude-usage$x $d 9 -tab 2 -pose scrolled
            shot control-scrolled$x $d 9 -tab 5 -pose scrolled
            shot settings-lower$x $d 9 -tab 9 -pose settings-lower
            footshot control-foot$x $d -tab 5
            footshot settings-foot$x $d -tab 9
            shot alerts$x $d 8 -tab 0 -pose alerts
            shot status-live$x $d 14 -tab 0
            shot disk-history$x $d 10 -tab 0 -openHistory disk
            shot rx-history$x $d 10 -tab 0 -openHistory rx
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          D=/tmp/dh/.build/release/devicehubctl
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          poses 3 -portrait
          statusfilm statusfilm-portrait 3 0.065 0.049
          $D "$DEVICE" rotate 3 || true; sleep 5
          poses 3 -open
          statusfilm statusfilm-open 3 0.948 0.222
          $D "$DEVICE" pose closed || true; sleep 5
          poses 1 ""
          statusfilm statusfilm 1 0.895 0.292
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../shots.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view macpro-polish2-ci >/dev/null 2>&1 || gh release create macpro-polish2-ci --prerelease --title "Mac Pro polish check" --notes "Branch-only shots for macpro-polish2."
          for f in shots.zip status.txt; do
            for i in 1 2 3; do gh release upload macpro-polish2-ci "$f" --clobber && break; sleep 15; done
          done
