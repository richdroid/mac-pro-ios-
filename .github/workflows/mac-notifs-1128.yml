name: Mac Pro notifications 1128 (branch only)
# The Mac's notifications on Status and their page (11-28), shot in every posture with open portrait first, and filmed
# swiped away and dismissed all. Branch only; removed before the branch merges.
on:
  push:
    branches: [mac-notifs-1128]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mac-notifs-1128
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          film() {
            local name=$1 display=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 7
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 1; xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-$(date +%s).png; sleep 1.5; done )
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          poses() {
            local d=$1 x=$2
            shot status$x $d 8 -tab 0
            shot notifs$x $d 9 -tab 0 -pose notifs
            shot notifs-empty$x $d 9 -tab 0 -pose notifsempty
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          D=/tmp/dh/.build/release/devicehubctl
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          poses 3 -portrait
          # Swiped: a slow pull that leaves Dismiss showing, a full swipe that takes one away, then Dismiss All.
          film swipe-portrait 3 3 "drag 0.8 0.26 0.45 0.26 0.8;drag 0.85 0.26 0.05 0.26 0.2;tap \"Dismiss All\"" -tab 0 -pose notifs; sleep 22
          film fromstatus-portrait 3 3 "tap mac-notifs" -tab 0
          $D "$DEVICE" rotate 3 || true; sleep 5
          poses 3 -open
          $D "$DEVICE" pose closed || true; sleep 5
          poses 1 ""
          ls dist | wc -l
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' '*.log' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mac-notifs-1128 >/dev/null 2>&1 || gh release create mac-notifs-1128 --prerelease --title "Mac Pro notifications 1128 shots" --notes "Branch-only shots; deleted with the branch's workflow."
          for f in shots.zip films.zip status.txt; do
            for i in 1 2 3; do gh release upload mac-notifs-1128 "$f" --clobber && break; sleep 15; done
          done
