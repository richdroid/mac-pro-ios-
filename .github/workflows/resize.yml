name: Mac Pro resize check
# A working branch's own films (macpro-resize), published to the macpro-resize-ci release; main's builds and releases are
# untouched. Status as Richard sees it on real data (2026-11-11, build 276: "that same resizing issue in the mac pro app is
# still happening"; earlier "the top scroll shit happening in the mac pro app on my phone"): at rest at the top for 30 s,
# at rest scrolled, pulled past the top and let go, and launched cold over last time's cache, in open portrait, open flat
# and folded. Each film has the app's own log beside it (every row's height as it changes, the page's content height and
# insets, each reading's landing and what it cost, every late frame and main-thread turn over 50 ms).
on:
  push:
    branches: [macpro-resize]
permissions:
  contents: write
concurrency:
  group: macpro-resize-ci
  cancel-in-progress: false
jobs:
  films:
    runs-on: xcode-27
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          # Release, as TestFlight builds it, so a landing's cost is what his phone runs (Debug's unoptimised SwiftUI doubled
          # it). The frame meter is Debug-only; the swipe log's late frames and main-thread turns are in both.
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Release -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Films
        continue-on-error: true
        timeout-minutes: 160
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Release-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          D=/tmp/dh/.build/release/devicehubctl
          logs() {
            local c; c=$(xcrun simctl get_app_container "$DEVICE" local.macpro.MacPro data 2>/dev/null) || return 0
            [ -f "$c/Library/Caches/swipe-log.txt" ] && mv "$c/Library/Caches/swipe-log.txt" dist/macpro-$1-swipe.log
            [ -f "$c/Library/Caches/frame-log.txt" ] && mv "$c/Library/Caches/frame-log.txt" dist/macpro-$1-frames.log && tail -1 dist/macpro-$1-frames.log
            true
          }
          # Status left alone: launched (over the cache the last run left), then 40 s untouched. Nothing on it may move
          # but the figures. name, display, then the app's own arguments.
          restfilm() {
            local name=$1 display=$2; shift 2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            echo "$name launch at $(date +%s.%N | cut -c1-14)"
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${FILM_PORT:-9041} -swipeLog YES -frameLog YES -tab 0 "$@"
            sleep 44
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          # Status flung to its end with real touches, then left there 60 s (six full readings): the top processes at rest.
          # The scroll-to pose never moved the list (designer, resize gate). name, display, x, then the app's own arguments.
          endfilm() {
            local name=$1 display=$2 x=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            echo "$name launch at $(date +%s.%N | cut -c1-14)"
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${FILM_PORT:-9041} -swipeLog YES -frameLog YES -tab 0 "$@"
            sleep 12
            for i in 1 2 3 4 5 6; do $D "$DEVICE" drag $x 0.8 $x 0.28 0.12 || echo "drag failed"; sleep 1.4; done
            echo "$name at rest at $(date +%s.%N | cut -c1-14)"
            sleep 62
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          # Back with a real tap from a history opened at launch, as the Back-pop films do (gate 4, Open 1): the pop's start.
          popfilm() {
            local name=$1 display=$2 bx=$3 by=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro > /dev/null 2>&1; sleep 1
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9041 -swipeLog YES -tab 0 -openHistory cpu
            sleep 14
            echo "$name back at $(date +%s.%N | cut -c1-14)"
            $D "$DEVICE" touch $bx $by 0.08 || echo "tap failed"; sleep 4
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          # Status, then Apps for 30 s while an alert arrives (9042: 20 s after the first ask), then Status again: what came
          # while it was away is in place or moves in, never in one frame. name, display, Apps' and Status's tab x and y.
          tabfilm() {
            local name=$1 display=$2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro > /dev/null 2>&1; sleep 1
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9042 -swipeLog YES -tab 0 -pose tabback
            sleep 47
            # On the CI runner (never on the Mac at home), with SAMPLE set: where the app's main thread spends its time at rest
          # after coming back. Off by default: sample stops the app's threads to read them, which the log counts as stalls.
            P=$(pgrep -f 'MacPro.app/MacPro' | head -1); [ -n "$P" ] && [ -n "$SAMPLE" ] && sample $P 4 -mayDie -file dist/macpro-$name-rest-sample.log > /dev/null 2>&1
            sleep 3
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          # The Duo moved with Status up, at the top and part way down (scrolled to the dials): each posture's layout in place
          # as the move ends, nothing changing after. name, display to film, the first posture's commands, then the moves.
          turnfilm() {
            local name=$1 display=$2 pose=$3; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro > /dev/null 2>&1; sleep 1
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9041 -swipeLog YES -tab 0 $pose; sleep 12
            local k=0
            for m in "$@"; do
              k=$((k + 1)); echo "$name move $m at $(date +%s.%N | cut -c1-14)"
              # Where the main thread is during the turn (CI runner only): sampled from just before the move for 3 s.
              P=$(pgrep -f 'MacPro.app/MacPro' | head -1); [ -n "$P" ] && [ -n "$SAMPLE" ] && { sample $P 3 -mayDie -file dist/macpro-$name-move$k-sample.log > /dev/null 2>&1 & }
              $D "$DEVICE" $m || true; sleep 10
            done
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          # Status pulled his way: flung to its end, drawn past it slowly and let go, back up and pulled past the top
          # slowly and let go, then a quick pull past the top; the page then left at rest 12 s. name, display, x, low y,
          # high y (fractions), then the app's own arguments.
          pullfilm() {
            local name=$1 display=$2 x=$3 lo=$4 hi=$5; shift 5
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            echo "$name launch at $(date +%s.%N | cut -c1-14)"
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:${FILM_PORT:-9041} -swipeLog YES -frameLog YES -tab 0 "$@"
            sleep 12
            for i in 1 2 3 4 5; do $D "$DEVICE" drag $x $lo $x $hi 0.12 || echo "drag failed"; sleep 1.4; done
            $D "$DEVICE" drag $x 0.6 $x $hi 3 || true; sleep 4
            for i in 1 2 3 4 5 6; do $D "$DEVICE" drag $x $hi $x $lo 0.12 || true; sleep 1.4; done
            sleep 3
            echo "$name slow pull at $(date +%s.%N | cut -c1-14)"
            $D "$DEVICE" drag $x 0.45 $x $lo 3 || true; sleep 4
            echo "$name quick pull at $(date +%s.%N | cut -c1-14)"
            $D "$DEVICE" drag $x 0.45 $x $lo 0.5 || true; sleep 12
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            logs $name
          }
          posture() {
            local d=$1 x=$2 px=$3
            # The first launch fills the cache; the films after it are cold launches over it, as on his phone.
            restfilm rest-top$x $d
            endfilm rest-end$x $d $px
            pullfilm pull$x $d $px 0.8 0.28
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          $D "$DEVICE" pose open; echo "unfold exit $?"; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          # One launch first, untimed, so the first film isn't the simulator's first minute after boot (the first film of
          # each run had a 4 to 5 s stall that no later one had) and every film launches over a cache, as his phone does.
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9041 -tab 0; sleep 25
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          # The first launch open flat after an install: nothing about the fold kept yet (the warm-up was open portrait).
          posture 3 -portrait 0.5
          popfilm pop-portrait 3 0.065 0.049
          $D "$DEVICE" rotate 3 || true; sleep 5
          posture 3 -open 0.75
          popfilm pop-open 3 0.948 0.222
          # Open flat, the left pane (where the top processes are) flung to its end and left there.
          endfilm rest-end-left-open 3 0.25
          tabfilm tabback-open 3
          # Open flat to open portrait and back, at the top and part way down.
          turnfilm turn-flat 3 "" "rotate 1" "rotate 3" "rotate 1" "rotate 3"
          turnfilm turn-flat-scrolled 3 "-pose scrolled" "rotate 1" "rotate 3" "rotate 1" "rotate 3"
          $D "$DEVICE" rotate 1 || true; sleep 5
          tabfilm tabback-portrait 3
          $D "$DEVICE" pose closed || true; sleep 5
          posture 1 "" 0.45
          tabfilm tabback 1
          # Unfolded and folded again with Status up, both displays, at the top and part way down.
          turnfilm fold-inner 3 "" "pose open" "pose closed" "pose open"
          $D "$DEVICE" pose closed || true; sleep 5
          turnfilm fold-inner-scrolled 3 "-pose scrolled" "pose open" "pose closed" "pose open"
          $D "$DEVICE" pose closed || true; sleep 5
          turnfilm fold-outer 1 "" "pose open" "pose closed"
          # A first launch with nothing kept from before (a fresh install): its first answer builds Status from nothing.
          C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.MacPro data); rm -f "$C/Library/Caches/status.json"
          restfilm firstlaunch 1
          # The same turns and fold on the tree before this branch (8cce1f3, with only the log added after it), to tell the
          # freeze on a turn that this branch made from the one the system or the simulator makes (designer, regate).
          git fetch -q --depth=1 origin 8cce1f3ccd3335884b676837ed75349348a6d1ec || git fetch -q origin
          mkdir -p /tmp/base && git archive 8cce1f3ccd3335884b676837ed75349348a6d1ec | tar -x -C /tmp/base
          cp Sources/FrameLog.swift /tmp/base/Sources/ 2>/dev/null; cp ci/mock-chumby.js /tmp/base/ci/
          (cd /tmp/base && swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset > /dev/null 2>&1; xcodegen generate > /dev/null && \
            xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Release -sdk iphonesimulator -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -1)
          xcrun simctl install "$DEVICE" /tmp/base/build-sim/Build/Products/Release-iphonesimulator/MacPro.app && {
            $D "$DEVICE" pose open || true; sleep 5; $D "$DEVICE" rotate 3 || true; sleep 5
            turnfilm base-turn-flat 3 "" "rotate 1" "rotate 3" "rotate 1" "rotate 3"
            $D "$DEVICE" pose closed || true; sleep 5
            turnfilm base-fold-outer 1 "" "pose open" "pose closed"
          }
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view macpro-resize-ci >/dev/null 2>&1 || gh release create macpro-resize-ci --prerelease --title "Mac Pro resize check (a working branch's films)" --notes "Status at rest, pulled and launched cold, from the macpro-resize branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload macpro-resize-ci "$f" --clobber && break; sleep 15; done
          done
