name: Mac Pro Status revert check (branch)
# Branch-only check for the Status revert and the open without a dim: every tab in all three postures on this branch and
# on build 276 (dd1a9ce) side by side, and films of a cold open over a slow link and with a Mac that doesn't answer for
# 40 s. Published to its own release (macpro-status-ci). Not for main; deleted after the gate.
on:
  push:
    branches: [macpro-status-revert]
permissions:
  contents: write
concurrency:
  group: macpro-status
  cancel-in-progress: true
jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        tree: [new, b276]
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.tree == 'b276' && 'dd1a9ce' || github.sha }}
          fetch-depth: ${{ matrix.tree == 'b276' && 0 || 1 }}
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Release -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots
        continue-on-error: true
        timeout-minutes: 70
        env:
          TREE: ${{ matrix.tree }}
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Release-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          D=/tmp/dh/.build/release/devicehubctl
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$TREE-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # A tab scrolled by a finger, half way and to its foot, so everything on it is seen.
          scrolled() {
            local name=$1 display=$2; shift 2
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 8
            $D "$DEVICE" drag 0.45 0.8 0.45 0.4 || true; sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$TREE-$name-mid.png
            for i in 1 2 3; do $D "$DEVICE" drag 0.45 0.85 0.45 0.1 || true; sleep 1; done
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$TREE-$name-foot.png
            # Open flat the right pane scrolls on its own: its foot too (the Disk card on Status).
            for i in 1 2 3; do $D "$DEVICE" drag 0.72 0.85 0.72 0.1 || true; sleep 1; done
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/$TREE-$name-rightfoot.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # A cold open filmed: first against the still Mac so last time's figures are kept, then against port $3.
          coldfilm() {
            local name=$1 display=$2 port=$3 secs=$4
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0; sleep 6
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true; sleep 2
            [ "$port" = 9042 ] && curl -s http://127.0.0.1:9042/arm
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/$TREE-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:$port -tab 0
            for t in 1 3 6 10 20 30 38 45; do
              [ $t -le $secs ] || break
              sleep $(( t - ${last:-0} )); last=$t
              xcrun simctl io "$DEVICE" screenshot --display=$display dist/$TREE-$name-${t}s.png
            done
            last=0
            sleep 3
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          poses() {
            local d=$1 x=$2
            for T in 0 1 2 4 5 9; do shot tab$T$x $d 8 -tab $T; done
            for T in 0 1 2 5 9; do scrolled tab$T$x $d -tab $T; done
            shot alerts$x $d 8 -tab 0 -pose alerts
            shot disk-history$x $d 10 -tab 0 -openHistory disk
            shot health$x $d 9 -tab 5 -pose health
            shot healthone$x $d 9 -tab 5 -pose healthone
            shot healthbad$x $d 9 -tab 5 -pose healthbad
            shot temp-history$x $d 10 -tab 0 -openHistory temp:GPU\ A
          }
          films() {
            local d=$1 x=$2
            [ "$TREE" = new ] || return 0
            coldfilm coldslow$x $d 9041 10
            coldfilm colddead$x $d 9042 45
          }
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          open -a DeviceHub; sleep 10
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          poses 3 -upright
          films 3 -upright
          $D "$DEVICE" rotate 3 || true; sleep 5
          poses 3 -flat
          films 3 -flat
          $D "$DEVICE" pose closed || true; sleep 5
          poses 1 -folded
          films 1 -folded
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ matrix.tree }}
        run: |
          (cd dist && zip -qr ../$TREE-shots.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../$TREE-shots.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > $TREE-status.txt
          gh release view macpro-status-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create macpro-status-ci -R "$GITHUB_REPOSITORY" --prerelease --title "Mac Pro Status revert check" --notes "Branch-only shots for macpro-status-revert." --target "$GITHUB_SHA"
          for f in $TREE-shots.zip $TREE-status.txt; do
            for i in 1 2 3; do gh release upload macpro-status-ci "$f" -R "$GITHUB_REPOSITORY" --clobber && break; sleep 15; done
          done
