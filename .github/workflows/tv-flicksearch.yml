name: TV flick search checks
# Branch-only proof (deleted before the branch ships). A short run for the TV app's work in progress, pushed to the tv-quick branch (never main): the Now Playing card in
# every state (the gallery's drawing of it, and the real island and Lock Screen card where the simulator will show
# them), and the tab tour with its slow-frame log, in minutes rather than the full run's hour and a half. Published to
# the tv-quick release.
on:
  push:
    branches: [tv-flick-search]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-flicksearch
  cancel-in-progress: true
jobs:
  quick:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in TV GalleryTV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Shots
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/TV.app
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/GalleryTV.app
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          date
          rm -f /tmp/tv-hitches.log
          node ci/mock-chumby.js &
          sleep 2
          M=http://127.0.0.1:9002
          WHAT=$(cat ci/tv-quick.txt 2>/dev/null)
          has() { case " $WHAT " in *" $1 "*) return 0;; esac; return 1; }
          # The Live Activity as the island and the Lock Screen show it, South Park first: the lock card, then the island's compact,
          # minimal and opened forms, at the size iOS gives each.
          for P in island island-open1 island-open2 island-open3 island-lock0 island-lock1 island-lock2; do
            xcrun simctl launch "$DEVICE" local.macpro.GalleryTV -page $P
            sleep 12
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tv-$P.png
            xcrun simctl terminate "$DEVICE" local.macpro.GalleryTV || true
          done
          date
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          shot() {
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          }
          # The season pivot filmed: the episodes pulled left to the next season, then right back, headers sliding with them.
          pivotfilm() {
            local name=$1 display=$2 x1=$3 x2=$4 y=$5
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/tv-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $M -tab 1 -pose showpage
            sleep 14
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-1.png
            $D "$DEVICE" drag $x1 $y $x2 $y 0.4 || echo "swipe failed"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-2.png
            $D "$DEVICE" drag $x1 $y $x2 $y 0.4 || echo "swipe failed"
            sleep 4
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-3.png
            $D "$DEVICE" drag $x2 $y $x1 $y 0.4 || echo "swipe failed"
            sleep 4
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          }
          # One posture's shots: the searches (a film top result, a show), the show's episodes with the pivot, the episodes over
          # the Remote, and the streams page, each kept whole.
          postureshots() {
            local tag=$1 display=$2
            shot search-$tag $display 12 $M -tab 1 -pose search
            shot search-$tag $display 12 $M -tab 1 -pose search
            shot searchshow-$tag $display 14 $M -tab 1 -pose searchtype-show
            shot episodes-$tag $display 24 $M -tab 1 -pose showpage
            shot remote-episodes-$tag $display 10 $M/repisode -tab 0 -pose episodes
            shot streams-$tag $display 14 $M -tab 1 -pose flick-stage
            shot info-$tag $display 12 $M -tab 1 -pose details
          }
          postureshots folded 1
          pivotfilm pivot-folded 1 0.8 0.2 0.6
          holdshot() {
            local name=$1 display=$2 x=$3 y=$4 wait=$5; shift 5
            xcrun simctl launch "$DEVICE" local.macpro.TV -address $M "$@"
            sleep $wait
            $D "$DEVICE" touch $x $y 2.5 &
            sleep 1.4
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name.png
            wait
            sleep 2
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/tv-$name-after.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
          }
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          pivotfilm pivot-portrait 3 0.8 0.2 0.62
          postureshots portrait 3
          # A real touch held on a poster: lifted off the page in the hand, then let go where it was (put back, a tap).
          holdshot hold-searchtop-portrait 3 0.09 0.28 12 -tab 1 -pose search
          holdshot hold-episode-portrait 3 0.2 0.55 24 -tab 1 -pose showpage
          $D "$DEVICE" rotate 3 || true; sleep 5
          postureshots landscape 3
          pivotfilm pivot-landscape 3 0.85 0.55 0.6
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../quick.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../quick.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view tv-flicksearch >/dev/null 2>&1 || gh release create tv-flicksearch --prerelease --title "TV flick search checks" --notes "Branch-only shots from tv-flick-search."
          for f in quick.zip status.txt; do
            for i in 1 2 3; do gh release upload tv-flicksearch "$f" --clobber && break; sleep 15; done
          done
