name: System tabs check (mp-systabs-1128)
# Branch-only check for mp-systabs-1128 (Richard, 2026-11-28: "the side bar in the mac pro app doesn't follow ios
# conventions at all"). The Mac Pro app and Mint Remote back on the system's TabView: Mac Pro with five tabs (macOS is a
# row on Status that opens the macOS page), Mint Remote with three. Every tab in every posture (folded, folded on its
# side both ways, open upright, open flat, and a shorter flat window), the tab bar's own item list logged with each shot
# (BackFinder: "tabbar items=… more=no"), the island taken by a Live Activity; films of tab switching (every tab tapped
# where iOS put it, a fling, a drag from the bar), Status → macOS pushed and taken back by Back and by the edge swipe, a
# Status history pushed and taken back, and a fold-open-turn film. Published to the mp-systabs-shots prerelease. Never
# runs on main.
on:
  push:
    branches: [mp-systabs-1128]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-systabs-shots
  cancel-in-progress: true
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the launch art
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in MacPro TV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 84
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          P=build-sim/Build/Products/Debug-iphonesimulator
          for A in MacPro TV; do xcrun simctl install "$DEVICE" $P/$A.app; done
          xcrun simctl privacy "$DEVICE" grant media-library local.macpro.TV
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          MAC=local.macpro.MacPro; TV=local.macpro.TV
          M=http://127.0.0.1:9002
          addr() { case $1 in $MAC) echo http://127.0.0.1:9001;; $TV) echo $M;; esac; }
          name() { case $1 in $MAC) echo macpro;; $TV) echo tv;; esac; }
          snap() { xcrun simctl io "$DEVICE" screenshot --display=$1 dist/$2.png > /dev/null 2>&1; }
          backlog() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) && cat "$c/Library/Caches/back-at.txt" 2>/dev/null; }
          backat() { local a; a=$(backlog $1 | head -1); case "$a" in none|"") echo "$FALLBACK";; *) echo "$a";; esac; }
          spot() { backlog $1 | awk -v n="$2" '$1 == "spot" && $2 == n {print $3" "$4}' | head -1; }
          # Simulator crash reports of either app, as logs.
          crashes() { for f in ~/Library/Logs/DiagnosticReports/TV*.ips ~/Library/Logs/DiagnosticReports/MacPro*.ips; do [ -f "$f" ] && cp "$f" "dist/crash-$(basename "$f" .ips).log" && echo "CRASH REPORT $(basename "$f")"; done; }
          tablog() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) && [ -f "$c/Library/Caches/tab-log.txt" ] && mv "$c/Library/Caches/tab-log.txt" dist/$2-tab.log && cat dist/$2-tab.log | sed "s/^/$2: /"; }
          swipelog() { local c; c=$(xcrun simctl get_app_container "$DEVICE" $1 data 2>/dev/null) || return 0; [ -f "$c/Library/Caches/swipe-log.txt" ] && mv "$c/Library/Caches/swipe-log.txt" dist/$2-swipe.log; }
          # Every tab of an app: bundle, display, suffix, tabs, then extra arguments. Each still comes with the app's own
          # account of its tab bar (the "tab" and "tabbar items=" lines), so a More shows up in the logs as well as the shot.
          tabshots() {
            local b=$1 d=$2 x=$3 tabs=$4 T n; shift 4
            for T in $tabs; do
              n=$(name $b)-tab$T$x
              xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -tab $T "$@" > /dev/null
              sleep 8; snap $d $n
              backlog $b > dist/$n-bar.log
              echo "$n: $(grep -c '^tab ' dist/$n-bar.log) tab buttons; $(grep '^tabbar' dist/$n-bar.log | head -1)"
              xcrun simctl terminate "$DEVICE" $b || true
            done
          }
          # Tab switching, filmed: every tab tapped where iOS put it, a tab tapped just after a fling, and a drag that
          # starts on the tab in front and leaves the bar (the page must stay where it was).
          taptest() {
            local n=$1 d=$2 b=$3 i=0 label x y; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES "$@" > /dev/null
            sleep 10
            backlog $b | grep '^tab ' > dist/$n-tabs.log
            echo "$n: $(wc -l < dist/$n-tabs.log) tabs found"
            while read -r _ label x y; do
              i=$((i + 1)); $D "$DEVICE" touch $x $y 0.08 || echo "tap failed"; sleep 1.4; snap $d $n-$i-$label
            done < dist/$n-tabs.log
            local t1 t2; t1=$(sed -n 1p dist/$n-tabs.log | awk '{print $3" "$4}'); t2=$(sed -n 2p dist/$n-tabs.log | awk '{print $3" "$4}')
            if [ -n "$t2" ]; then
              $D "$DEVICE" touch $t1 0.08; sleep 1.5
              $D "$DEVICE" drag 0.35 0.75 0.35 0.3 0.12; sleep 0.15; $D "$DEVICE" touch $t2 0.08; sleep 1.4; snap $d $n-afterfling
              $D "$DEVICE" touch $t1 0.08; sleep 1.5
              $D "$DEVICE" drag 0.5 0.7 0.5 0.45 0.5; sleep 1.5; snap $d $n-stripdrag-before
              set -- $t1; $D "$DEVICE" drag $1 $2 $1 $(echo "$2 - 0.25" | bc -l) 0.3; sleep 1.5; snap $d $n-stripdrag-after
              # And a still finger on the tab in front, the page scrolled: that one takes it to its top.
              $D "$DEVICE" drag 0.5 0.7 0.5 0.45 0.5; sleep 1.5; snap $d $n-retap-before
              $D "$DEVICE" touch $t1 0.08; sleep 1.5; snap $d $n-retap-after
            fi
            tablog $b $n
            crashes
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          # Status → macOS: Status scrolled to its macOS row, the row tapped (the push), Back tapped where iOS put it (the
          # pop); the row tapped again and the page swiped back from the edge, a still half-way.
          macosfilm() {
            local d=$1 x=$2 n=macpro-macos-push$2 at
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -findBack YES -swipeLog YES -tab 0 -pose macosrow > /dev/null
            sleep 11
            at=$(spot $MAC macosrow); echo "$n row at '$at'"
            snap $d $n-1status
            if [ -n "$at" ]; then
              $D "$DEVICE" touch $at 0.08; sleep 0.3; snap $d $n-2pushmid; sleep 4; snap $d $n-3page
              local back; back=$(backat $MAC); echo "$n Back at $back"
              $D "$DEVICE" touch $back 0.08; sleep 0.3; snap $d $n-4popmid; sleep 2.2; snap $d $n-5back
              at=$(spot $MAC macosrow)
              $D "$DEVICE" touch $at 0.08; sleep 4; snap $d $n-5b-page
              back=$(backat $MAC); $D "$DEVICE" touch $back 0.08; sleep 2.5; snap $d $n-5c-back
              at=$(spot $MAC macosrow)
              $D "$DEVICE" touch $at 0.08; sleep 4; snap $d $n-6page
              $D "$DEVICE" drag 0.01 0.5 0.92 0.5 2.6 & DR=$!
              sleep 1.7; snap $d $n-7swipe-mid; wait $DR
              sleep 2.5; snap $d $n-8swipe-after
            fi
            backlog $MAC > dist/$n-back.log
            swipelog $MAC $n
            xcrun simctl terminate "$DEVICE" $MAC || true
            kill -INT $REC; wait $REC
          }
          # A pushed page taken back, filmed: a slow partial edge swipe let go at a third, a slow full swipe (still half-way),
          # then relaunched on the page and Back tapped. Name, display, bundle, then the arguments that open the page.
          navfilm() {
            local n=$1 d=$2 b=$3 at; shift 3
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$d --force dist/$n.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 10
            snap $d $n-1page
            $D "$DEVICE" drag 0.01 0.5 0.33 0.5 2.0 & DR=$!
            sleep 1.6; snap $d $n-2partial-mid; wait $DR
            sleep 2; snap $d $n-3partial-after
            $D "$DEVICE" drag 0.01 0.5 0.92 0.5 2.6 & DR=$!
            sleep 1.7; snap $d $n-4swipe-mid; wait $DR
            sleep 2.5; snap $d $n-5swipe-after
            swipelog $b $n
            xcrun simctl terminate "$DEVICE" $b || true
            sleep 1
            xcrun simctl launch "$DEVICE" $b -address $(addr $b) -findBack YES -swipeLog YES "$@" > /dev/null
            sleep 10
            at=$(backat $b); echo "$n tap Back at $at"
            $D "$DEVICE" touch $at 0.08 || echo "tap failed"
            sleep 0.25; snap $d $n-6tap-mid
            sleep 2.5; snap $d $n-7tap-after
            backlog $b > dist/$n-back.log
            xcrun simctl terminate "$DEVICE" $b || true
            kill -INT $REC; wait $REC
          }
          # The island taken (Mint Remote's own Live Activity, left running in the background), then the Mac Pro's tabs.
          islandshots() {
            local d=$1 x=$2
            xcrun simctl launch "$DEVICE" $TV -address $M/real -tab 2 -pose island > /dev/null
            sleep 12
            tabshots $MAC $d -island$x "0 6"
            xcrun simctl terminate "$DEVICE" $TV || true
          }
          # Everything in one posture (display, suffix). Tab 4, the old macOS tab, opens the macOS page on Status.
          # Round 2 (every tab in every posture was shot on 1528a8c): the tab bar again, the taps, the drag off the bar, the
          # re-tap, and the macOS push, in each posture.
          posture() {
            local d=$1 x=$2
            taptest tv-taps$x $d $TV -tab 3
            tabshots $MAC $d $x "0 4"
            tabshots $TV $d $x "3"
            taptest macpro-taps$x $d $MAC -tab 0
            macosfilm $d $x
          }
          date
          FALLBACK="0.895 0.292"; posture 1 -folded
          date
          # Folded and turned on its side each way: the camera at the strip's top one way and at its foot the other.
          for R in 3 4; do
            $D "$DEVICE" rotate $R || true; sleep 5
            snap 1 probe-side$R
            tabshots $MAC 1 -side$R "0"
            taptest macpro-taps-side$R 1 $MAC -tab 0
            macosfilm 1 -side$R
          done
          $D "$DEVICE" rotate 1 || true; sleep 5
          date
          # Folded on Dashboard, opened flat, turned upright, back flat: the bar moves to where iOS puts it, the tab stays.
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=3 --force dist/macpro-posture-inner.mp4 > /dev/null 2>&1 & REC=$!
          sleep 2
          xcrun simctl launch "$DEVICE" $MAC -address $(addr $MAC) -tab 6 > /dev/null
          sleep 8
          $D "$DEVICE" pose open || true; sleep 5; snap 3 macpro-posture-1open
          $D "$DEVICE" rotate 1 || true; sleep 5; snap 3 macpro-posture-2upright
          $D "$DEVICE" rotate 3 || true; sleep 5; snap 3 macpro-posture-3flat
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" $MAC || true
          $D "$DEVICE" rotate 1 || true; sleep 5
          FALLBACK="0.065 0.049"; posture 3 -upright
          date
          $D "$DEVICE" rotate 3 || true; sleep 5
          FALLBACK="0.948 0.222"; posture 3 -flat
          navfilm macpro-back-macos-flat 3 $MAC -tab 4
          islandshots 3 -flat
          # A shorter window, as a taller island or status leaves: every tab still in the bar.
          tabshots $MAC 3 -flat-859x604 "0 6" -windowSize 859x604
          tabshots $TV 3 -flat-859x604 "3" -windowSize 859x604
          date
          crashes
          echo "== tab bars"; grep -h '^tabbar' dist/*-bar.log | sort | uniq -c
          ls dist | wc -l; du -sh dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-systabs-shots >/dev/null 2>&1 || gh release create mp-systabs-shots --prerelease --title "System tabs check (mp-systabs-1128)" --notes "Branch mp-systabs-1128: Mac Pro (five tabs) and Mint Remote on the system's TabView in every posture; tab, push and back films."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-systabs-shots "$f" --clobber && break; sleep 15; done
          done
