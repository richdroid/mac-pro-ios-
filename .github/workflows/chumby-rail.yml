name: Chumby rail checks (branch)
# The chumby-rail branch's own short run (never main): every tab with the right rail's vertical tab pill, folded, open
# flat and open portrait, Home ringing and dark, a pushed page, and a second tap on the tab. Published to the chumby-rail
# release. Temporary: goes when the branch merges.
on:
  push:
    branches: [chumby-rail]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chumby-rail
  cancel-in-progress: true
jobs:
  quick:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PUSH_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Chumby launch sea and wordmark
        run: swift ci/chumby-launch.swift ChumbyApp/Assets.xcassets
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in Chumby MacPro TV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | grep -E "error:|warning: unre|BUILD" | tail -40
          done
      - name: Shots
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          for APP in Chumby MacPro TV; do xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/$APP.app; done
          node ci/mock-chumby.js & MOCK=$!
          sleep 2
          M=http://127.0.0.1:9000
          remock() { kill $MOCK 2>/dev/null; wait $MOCK 2>/dev/null; node ci/mock-chumby.js & MOCK=$!; sleep 2; }
          shot() { # name, display, wait, address, args
            local name=$1 display=$2 wait=$3 address=$4; shift 4
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $address "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/logo-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          film() { # name, display, seconds, address, args
            local name=$1 display=$2 secs=$3 address=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --display=$display --codec=h264 --force dist/logo-$name.mp4 > /dev/null 2>&1 &
            local rec=$!
            sleep 2
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $address "$@"
            local i=0
            while [ $i -lt $secs ]; do sleep 1.5; i=$((i + 1)); [ $((i % 2)) = 0 ] && xcrun simctl io "$DEVICE" screenshot --display=$display dist/logo-$name-$i.png; done
            kill -INT $rec; wait $rec
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          }
          set_() { # display, suffix
            xcrun simctl ui "$DEVICE" appearance light
            for T in 0 1 2 3 4; do shot tab$T$2 $1 9 $M -tab $T; done
            shot home-ringing$2 $1 9 $M/ringing -tab 0
            shot settings$2 $1 10 $M -tab 2 -pose calsettings
            # A second tap on the tab: scrolled down at 4 s, back at its top by 9 s.
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 2 -pose retap
            sleep 8; xcrun simctl io "$DEVICE" screenshot --display=$1 dist/logo-retap-down$2.png
            sleep 4; xcrun simctl io "$DEVICE" screenshot --display=$1 dist/logo-retap-top$2.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
            # Motion: the tabs hopping (Alarms, Home, Sounds, Home), the push of Calendar settings, and the retap.
            film tabhop$2 $1 10 $M -tab 0 -pose tabhop
            film push$2 $1 6 $M -tab 2 -pose calsettings
            film retapfilm$2 $1 10 $M -tab 2 -pose retap
            # The other apps' rails, for one tab design across them: the Mac Pro app (the shared rail) and Mint Remote.
            for T in 0 2; do
              xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab $T; sleep 10
              xcrun simctl io "$DEVICE" screenshot --display=$1 dist/logo-mac-tab$T$2.png
              xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
            done
            xcrun simctl launch "$DEVICE" local.macpro.TV -address http://127.0.0.1:9002/real -tab 0; sleep 10
            xcrun simctl io "$DEVICE" screenshot --display=$1 dist/logo-tv-tab0$2.png
            xcrun simctl terminate "$DEVICE" local.macpro.TV || true
            xcrun simctl ui "$DEVICE" appearance dark
            shot home-dark$2 $1 9 $M -tab 0
          }
          # First opens with and without the tabs built ahead: late frames and busy turns through the tab hop, folded.
          if [ -z "$PUSH_ONLY" ]; then
          for W in prewarm noprewarm; do
            EXTRA=""; [ $W = noprewarm ] && EXTRA="-noPrewarm YES"
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 0 -pose tabhop -swipeLog YES $EXTRA
            sleep 16
            C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.Chumby data 2>/dev/null) && cp "$C/Library/Caches/swipe-log.txt" dist/logo-hop-$W.log; rm -f "$C/Library/Caches/swipe-log.txt"
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          done
          set_ 1 ""
          fi
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          $D "$DEVICE" pose open; sleep 5
          [ -z "$PUSH_ONLY" ] && set_ 3 "-open"
          $D "$DEVICE" rotate 1; sleep 5
          [ -z "$PUSH_ONLY" ] && set_ 3 "-portrait"
          # Open upright: a tab and its pushed page by real taps, filmed (the Calendar row, then Back), and the Mac Pro
          # app's tab and pushed page, for one right edge on a tab and its pages.
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address $M -tab 2 -pose calendar
          sleep 10; xcrun simctl io "$DEVICE" screenshot --display=3 dist/logo-tap-before-portrait.png
          xcrun simctl io "$DEVICE" recordVideo --display=3 --codec=h264 --force dist/logo-tappush-portrait.mp4 > /dev/null 2>&1 & REC=$!
          sleep 2
          $D "$DEVICE" touch 0.4 0.796 0.1; sleep 3
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/logo-tap-after-portrait.png
          $D "$DEVICE" touch 0.065 0.05 0.1; sleep 3
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/logo-tap-back-portrait.png
          kill -INT $REC; wait $REC
          xcrun simctl terminate "$DEVICE" local.macpro.Chumby || true
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0; sleep 10
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/logo-mac-tab0-portrait.png
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 -tab 0 -openHistory cpu; sleep 10
          xcrun simctl io "$DEVICE" screenshot --display=3 dist/logo-mac-history-portrait.png
          xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../logo.zip . -i '*.png' '*.log' '*.mp4' || zip -q ../logo.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view chumby-rail >/dev/null 2>&1 || gh release create chumby-rail --prerelease --title "Chumby rail checks" --notes "Work in progress: shots and logs from the chumby-rail branch."
          for f in logo.zip status.txt; do
            for i in 1 2 3; do gh release upload chumby-rail "$f" --clobber && break; sleep 15; done
          done
