name: Chumby backup order check
# Branch-only (chumby-backup-order-ci): alarm logic tests, a simulator build of Chumby, and stills of Tinker's Backup
# section (pose backup) with Tinker as it is. Published to the chumby-backup-order release. Never merged to main.
on:
  push:
    branches: [chumby-backup-order-ci]
permissions:
  contents: write
concurrency:
  group: chumby-backup-order-ci
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Alarm logic tests
        run: ci/chumby-tests.sh
      - name: Build Chumby for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme Chumby -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | grep -E "error:|BUILD" | tail -40
      - name: Stills
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set +e
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/Chumby.app
          node ci/mock-chumby.js &
          sleep 2
          for P in backup none; do
            xcrun simctl launch "$DEVICE" local.macpro.Chumby -address http://127.0.0.1:9000 -tab 4 -pose $P
            sleep 8
            xcrun simctl io "$DEVICE" screenshot --display=1 dist/tinker-$P-d1.png
            xcrun simctl terminate "$DEVICE" local.macpro.Chumby
          done
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl launch "$DEVICE" local.macpro.Chumby -address http://127.0.0.1:9000 -tab 4 -pose backup
          sleep 8; xcrun simctl io "$DEVICE" screenshot --display=1 dist/tinker-backup-dark-d1.png
          ls -la dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../stills.zip . -i '*.png' || zip -q ../stills.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view chumby-backup-order >/dev/null 2>&1 || gh release create chumby-backup-order --prerelease --title "Chumby backup order" --notes "Branch-only stills."
          for f in stills.zip status.txt; do for i in 1 2 3; do gh release upload chumby-backup-order "$f" --clobber && break; sleep 15; done; done
