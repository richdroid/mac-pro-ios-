name: Mac Pro folded tab bar shots
# Temporary, branch-only: the Mac Pro app's tabs and pages shot folded (upright and on its side), open upright and open
# flat, for the mp-nomore branch's gate. Published to the mp-nomore release. Removed before merge.
on:
  push:
    branches: [mp-nomore]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-nomore
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          # The software keyboard, not the Mac's: with the hardware keyboard connected a tapped field never raises it, and the
          # session-turn film showed no keyboard (designer gate 4, 2026-11-19). Set globally and for this device, before boot.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$DEVICE" '{ ConnectHardwareKeyboard = 0; }' || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # A film with scripted touches: name, display, length, "touches" (devicehubctl lines, ; between), app args.
          film() {
            local name=$1 display=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 3
            xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 7
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 2.5; done )
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          stills() {
            local d=$1 x=$2
            shot claude$x $d 8 -tab 2
            shot session$x $d 9 -tab 2 -pose session
            shot macos$x $d 8 -tab 4
            shot settings$x $d 8 -tab 9
            # Settings is the system's gear in the bar on every tab (plan 2a): tapped from the Dashboard and from macOS.
            film settings-gear$x $d 3 "tap Settings" -tab 6
            film settings-gear-macos$x $d 3 "tap Settings" -tab 4
            shot everything$x $d 9 -tab 6 -pose health
            shot everything-one$x $d 9 -tab 6 -pose healthone
            # The Dashboard with one part down: the Everything tile names it.
            shot dash-one$x $d 8 -tab 6 -pose chipbad
            shot status-one$x $d 8 -tab 0 -pose chipbad
            shot history-cpu$x $d 9 -tab 0 -openHistory cpu
            shot history-download$x $d 9 -tab 0 -openHistory rx
          }
          dash() {
            local d=$1 x=$2
            shot dash$x $d 8 -tab 6
            shot dash-off$x $d 8 -tab 6 -pose consoleoff
            shot dash-console$x $d 8 -tab 6 -pose console
            shot dash-board$x $d 8 -tab 6 -pose consoleboard
            for P in $(cat ci/qol-poses.txt 2>/dev/null); do shot dash-$P$x $d 8 -tab 6 -pose $P; done
            # Open flat, the left pane (the middle is the hinge's gap).
            sx=0.5; [ "$x" = "-open" ] && sx=0.25
            film dash-scroll$x $d 4 "drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2;drag $sx 0.25 $sx 0.85" -tab 6
            film status-scroll$x $d 3 "drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2" -tab 0
            # Control after its Mac rows moved to the Dashboard, and Status beside it.
            shot control$x $d 8 -tab 5
            film control-scroll$x $d 3 "drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2;drag $sx 0.8 $sx 0.2" -tab 5
            shot status$x $d 8 -tab 0
            # Apps as it opens (designer gate, 2026-11-19: only its failure pose was shot).
            shot apps$x $d 8 -tab 1
            # A fling: three quick throws down the Dashboard and one back, for the frames between.
            film dash-fling$x $d 3 "drag $sx 0.85 $sx 0.15 0.08;drag $sx 0.85 $sx 0.15 0.08;drag $sx 0.2 $sx 0.9 0.08" -tab 6
            # The posed failure stays up once said (about 2 s after the open apps are drawn, which folded is only once
            # they're scrolled to): shot well after, never before it is said (designer gate, 2026-11-19).
            shot apps-fail$x $d 10 -tab 1 -pose appsfail
            film apps-failfilm$x $d 6 "" -tab 1 -pose appsfail
            # The pages the gate had never seen (designer gate, 2026-11-19): Claude, a session, macOS, Settings, Everything
            # all well and with one part down, and two histories.
            stills $d $x
            # Read on fd 3, so nothing a film runs can swallow the next lines.
            # Upright open, the tab bar's buttons aren't separate on the accessibility tree: its own file taps them by place.
            f=ci/qol-touches-$d$x.txt; [ -f $f ] || f=ci/qol-touches-$d.txt
            [ -f $f ] && while IFS='|' read -r -u 3 n t a; do film "$n$x" $d 4 "$t" $a < /dev/null; done 3< $f
          }
          # Folded first (the outer display), then open upright, then open flat.
          dash 1 ""
          # Folded upright (mp-nomore): the drawn bar at the foot, all six tabs, never "More" (Richard, 2026-11-20:
          # "i said more never"). Every tab tapped in turn, a pushed page above the bar, and the badge.
          film bar-folded 1 2 "tap Dashboard;tap Control;tap macOS;tap Claude;tap Apps;tap Status;tap Dashboard;tap tile.CPU;tap Dashboard" -tab 0
          film bar-keyboard 1 3 'tap "Message the session";tap "Message the session"' -tab 2 -pose session
          shot bar-otaoffer 1 8 -tab 1 -pose otaoffer
          # A session page turned from folded upright onto its side and back with the keyboard up (the box tapped first):
          # the screen and the controls go to two panes, clear of the rail, and the box keeps its focus.
          # Tapped twice (the first can land while the page is still settling), so the keyboard is surely up before the turn.
          film session-turn 1 5 'tap "Message the session";tap "Message the session";rotate 1;rotate 3' -tab 2 -pose session
          # Folded on its side (one right turn), which CI had never shot: the Dashboard, a session page, a history page,
          # Apps and Control. Then back upright before opening.
          $D "$DEVICE" rotate 1; sleep 5
          shot dash-land 1 8 -tab 6
          shot session-land 1 9 -tab 2 -pose session
          shot history-cpu-land 1 9 -tab 0 -openHistory cpu
          shot apps-land 1 8 -tab 1
          shot control-land 1 8 -tab 5
          # The rail on its side (mp-nomore): all six tabs in it, never "More" (Richard, 2026-11-19: "never more tabs thing").
          # Each tab in front (history-cpu-land shows a pushed page, its Back above the rail), and every tab tapped in turn from the rail.
          shot status-land 1 8 -tab 0
          shot claude-land 1 8 -tab 2
          shot macos-land 1 8 -tab 4
          film rail-land 1 2 "tap Dashboard;tap Control;tap macOS;tap Claude;tap Apps;tap Status;tap Dashboard;tap tile.CPU;tap Dashboard" -tab 0
          # Turned with a tab under the system's More before (Dashboard): on its side and back, the tab stays in front.
          film rail-turn 1 3 "rotate 3;rotate 1" -tab 6
          # The gear on its side, beside the drawn rail, from two tabs; and Settings itself there.
          film settings-gear-land 1 3 "tap Settings" -tab 6
          film settings-gear-control-land 1 3 "tap Settings" -tab 5
          shot settings-land 1 8 -tab 9
          # The update offer with two apps ready is taller than the screen on its side: scrolled to its Update button.
          film otaoffer-land 1 3 "drag 0.5 0.8 0.5 0.3 0.4" -tab 1 -pose otaoffer
          $D "$DEVICE" rotate 3; sleep 5
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          dash 3 -portrait
          $D "$DEVICE" rotate 3; sleep 5
          dash 3 -open
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-nomore >/dev/null 2>&1 || gh release create mp-nomore --prerelease --title "Mac Pro folded tab bar shots" --notes "Temporary shots for the mp-nomore branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-nomore "$f" --clobber && break; sleep 15; done
          done
