name: Mac Pro tabs, Dashboard and upgrade shots
# Temporary, branch-only: every tab of the Mac Pro app in every posture (folded upright and on its side, open upright, open
# flat, and open flat at Richard's own size), the Dashboard in each state, every step of the upgrade, and films of tab
# changes, a fling to the foot of every tab, and push and Back, for the mp-nomore branch's gate. Published to the mp-nomore release. Removed before merge.
on:
  push:
    branches: [mp-nomore]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mp-nomore
  cancel-in-progress: true
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draw the Mac Pro launch glow
        run: swift ci/launch-glow.swift Assets.xcassets/LaunchHero.imageset
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild -project MacPro.xcodeproj -scheme MacPro -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee dist/build.log | tail -1
      - name: Shots and films
        continue-on-error: true
        timeout-minutes: 155
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          # The software keyboard, not the Mac's: with the hardware keyboard connected a tapped field never raises it, and the
          # session-turn film showed no keyboard (designer gate 4, 2026-11-19). Set globally and for this device, before boot.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$DEVICE" '{ ConnectHardwareKeyboard = 0; }' || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/MacPro.app
          node ci/mock-chumby.js &
          sleep 2
          git clone -q https://github.com/ChrisThoma/devicehubctl.git /tmp/dh && (cd /tmp/dh && git checkout -q 3e58be2932794e47ee533ef2b992753bfc1c7337 && swift build -c release 2>&1 | tail -1)
          D=/tmp/dh/.build/release/devicehubctl
          open -a DeviceHub; sleep 10
          shot() {
            local name=$1 display=$2 wait=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep $wait
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # A film with scripted touches: name, display, length, "touches" (devicehubctl lines, ; between), app args.
          film() {
            local name=$1 display=$2 length=$3 touches=$4; shift 4
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --display=$display --force dist/macpro-$name.mp4 > /dev/null 2>&1 & REC=$!
            sleep 2
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 6
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 2; done )
            sleep $length
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name-end.png
            kill -INT $REC; wait $REC
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || true
          }
          # A shot after touches (a page pulled up to what lies below): name, display, touches, app args.
          shotdrag() {
            local name=$1 display=$2 touches=$3; shift 3
            perl -e 'alarm 90; exec @ARGV' xcrun simctl launch "$DEVICE" local.macpro.MacPro -address http://127.0.0.1:9001 "$@"
            sleep 8
            ( IFS=';'; for t in $touches; do eval "$D \"$DEVICE\" $t" || echo "touch failed: $t"; sleep 1.5; done )
            xcrun simctl io "$DEVICE" screenshot --display=$display dist/macpro-$name.png
            xcrun simctl terminate "$DEVICE" local.macpro.MacPro || { echo "NOT RUNNING at the end of $name"; sleep 6; crashes; }
          }
          # Why the app was gone, when it was: its newest crash reports, cut short.
          crashes() {
            local n=0
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/MacPro* 2>/dev/null | head -3); do n=$((n+1)); head -c 40000 "$f" > dist/crash-$n.log; done
            echo "crash reports: $n"
          }
          # Every tab at rest: name suffix, display, then any extra launch arguments.
          TABS="status:0 apps:1 claude:2 macos:4 control:5 dash:6"
          tabs() {
            local x=$1 d=$2; shift 2
            for t in $TABS; do shot tab-${t%%:*}$x $d 8 -tab ${t##*:} "$@"; done
          }
          # The Dashboard in each state of the Mac's screen (criterion 18): the Console showing, hidden behind other apps,
          # Glance, the display asleep, not running, stepped aside, and the Mac out of reach.
          dashstates() {
            local x=$1 d=$2; shift 2
            shot dash-showing$x $d 8 -tab 6 -pose console "$@"
            shot dash-hidden$x $d 8 -tab 6 -pose consolebehind "$@"
            shot dash-glance$x $d 8 -tab 6 -pose consoleglance "$@"
            shot dash-asleep$x $d 8 -tab 6 -pose consoleasleep "$@"
            shot dash-off$x $d 8 -tab 6 -pose consoleoff "$@"
            shot dash-board$x $d 8 -tab 6 -pose consoleboard "$@"
            shot dash-unreachable$x $d 8 -tab 6 -pose unreachable "$@"
            shot dash-one$x $d 8 -tab 6 -pose chipbad "$@"
          }
          # The upgrade, every step from posed states (criterion 21), then its card on the Dashboard scrolled to.
          UPGRADES="room blocked freed patcher held downloading checksred checksgreen installing away patches done noreturn"
          upgrades() {
            local x=$1 d=$2 list=$3; shift 3
            for u in $list; do shot upgrade-$u$x $d 9 -tab 6 -pose upgrade-$u "$@"; done
          }
          # The films: every tab tapped in turn; a fling to the foot of every tab and back to its top (three throws down,
          # three up), in each pane where there are two; a page pushed and swiped back, twice; the Dashboard scrolled
          # slowly; the upgrade opened from its card and a clean-up asked for. "$3" is the tab taps for this posture.
          films() {
            local x=$1 d=$2 tile=$3 sx=$4 sx2=$5 mode=$6; shift 6
            local ux=${sx2:-$sx}
            film tabs$x $d 2 "tap tab.Dashboard;tap tab.Control;tap tab.macOS;tap tab.Claude;tap tab.Apps;tap tab.Status;tap tab.Dashboard${tile:+;touch $tile 0.05;tap tab.Dashboard}" -tab 0 "$@"
            for t in $TABS; do
              [ "$mode" = brief ] && [ "${t%%:*}" != dash ] && [ "${t%%:*}" != status ] && continue
              film flingend-${t%%:*}$x $d 3 "drag $sx 0.85 $sx 0.15 0.08;drag $sx 0.85 $sx 0.15 0.08;drag $sx 0.85 $sx 0.15 0.08;drag $sx 0.2 $sx 0.9 0.08;drag $sx 0.2 $sx 0.9 0.08" -tab ${t##*:} "$@"
              [ -n "$sx2" ] && film flingend-${t%%:*}-right$x $d 3 "drag $sx2 0.85 $sx2 0.15 0.08;drag $sx2 0.85 $sx2 0.15 0.08;drag $sx2 0.85 $sx2 0.15 0.08;drag $sx2 0.2 $sx2 0.9 0.08;drag $sx2 0.2 $sx2 0.9 0.08" -tab ${t##*:} "$@"
            done
            # A tile is touched by its place ("$3", the Memory tile at rest in this posture): the tool finds no tile by name.
            [ -n "$tile" ] && film pushback$x $d 3 "touch $tile 0.05;drag 0.01 0.5 0.75 0.5 0.35;touch $tile 0.05;drag 0.01 0.5 0.75 0.5 0.35;touch $tile 0.05;drag 0.01 0.5 0.75 0.5 0.35" -tab 6 "$@"
            # The card sits under the tiles (the right pane's, where there are two): scrolled to, then opened, the
            # page pulled up to its clean-ups and one asked for.
            film upgrade-open$x $d 4 "drag $ux 0.85 $ux 0.15 0.08;drag $ux 0.85 $ux 0.15 0.08;drag $ux 0.85 $ux 0.15 0.08;tap upgrade.card;drag $sx 0.8 $sx 0.4 0.5;tap cleanup.caches" -tab 6 "$@"
            [ "$mode" = brief ] && return
            film dash-scroll$x $d 4 "drag $sx 0.8 $sx 0.3 0.6;drag $sx 0.8 $sx 0.3 0.6;drag $sx 0.8 $sx 0.3 0.6;drag $sx 0.3 $sx 0.8 0.6" -tab 6 "$@"
            film dash-strip$x $d 3 "tap chip.page.home;tap chip.board.machine;tap chip.board.machine;tap chip.page.storage;tap dash.screen" -tab 6 "$@"
          }
          # A commit whose message has [quick] runs only this: the upgrade states that were the Home Screen open
          # flat and open upright (CI d8bbee4), with the crash reports, in minutes.
          if git log -1 --pretty=%B | grep -q '\[quick\]'; then
            shot tab-dash 1 8 -tab 6
            shot tab-dash-late 1 20 -tab 6
            shot tab-status 1 8 -tab 0
            shotdrag tab-dash-foot 1 "drag 0.5 0.85 0.5 0.15 0.08;drag 0.5 0.85 0.5 0.15 0.08;drag 0.5 0.85 0.5 0.15 0.08" -tab 6
            film bar-keyboard 1 3 'tap "Message the session";touch 0.5 0.2 0.05' -tab 2 -pose session
            $D "$DEVICE" pose open; sleep 5
            $D "$DEVICE" rotate 1; sleep 5
            shot upgrade-freed-portrait 3 9 -tab 6 -pose upgrade-freed
            shot upgrade-room-portrait 3 9 -tab 6 -pose upgrade-room
            $D "$DEVICE" rotate 3; sleep 5
            shot upgrade-checksred-open 3 9 -tab 6 -pose upgrade-checksred
            shot tab-dash-open 3 8 -tab 6
            shot tab-dash-his 3 8 -tab 6 -windowSize 859x604
            film tabs-open 3 2 "tap tab.Control;tap tab.Claude;tap tab.Dashboard" -tab 0
            ls dist
            exit 0
          fi

          # 1. Folded upright (the outer display): the drawn bar along the foot.
          tabs "" 1
          dashstates "" 1
          upgrades "" 1 "$UPGRADES"
          # Each state again pulled up to its later steps (-mid) and to its foot (-low): the checks, the key, the patches.
          for u in $UPGRADES; do
            shotdrag upgrade-$u-mid 1 "drag 0.5 0.8 0.5 0.2 0.5" -tab 6 -pose upgrade-$u
            shotdrag upgrade-$u-low 1 "drag 0.5 0.8 0.5 0.2 0.5;drag 0.5 0.8 0.5 0.2 0.5;drag 0.5 0.8 0.5 0.2 0.5" -tab 6 -pose upgrade-$u
          done
          # The held key: let go early (nothing happens), then held through.
          film upgrade-hold 1 3 "drag 0.5 0.8 0.5 0.2 0.5;drag 0.5 0.8 0.5 0.2 0.5;longpress upgrade.hold 0.6;longpress upgrade.hold 2.2" -tab 6 -pose upgrade-freed
          films "" 1 "0.62 0.81" 0.5 "" full
          film dash-keys 1 4 "tap key.Show;tap key.Glance;tap key.Glance;tap key.Sleep;tap key.Wake" -tab 6 -pose consolebehind
          film dash-fail 1 1 "tap key.Hide" -tab 6 -pose consolefail
          film bar-keyboard 1 3 'tap "Message the session";touch 0.5 0.2 0.05' -tab 2 -pose session
          shot settings 1 8 -tab 9
          film settings-gear 1 3 "tap gear;drag 0.01 0.5 0.75 0.5 0.35" -tab 6

          # 2. Folded on its side: the drawn rail.
          $D "$DEVICE" rotate 1; sleep 5
          tabs -land 1
          shot dash-asleep-land 1 8 -tab 6 -pose consoleasleep
          shot dash-unreachable-land 1 8 -tab 6 -pose unreachable
          upgrades -land 1 "room"
          films -land 1 "" 0.5 "" brief
          film rail-turn 1 3 "rotate 3;rotate 1" -tab 6
          $D "$DEVICE" rotate 3; sleep 5

          # 3. Open upright: the drawn bar here too (the system's is used nowhere).
          $D "$DEVICE" pose open; sleep 5
          $D "$DEVICE" rotate 1; sleep 5
          shot before-status-portrait 3 8 -tab 0 -systemTabs YES
          tabs -portrait 3
          dashstates -portrait 3
          upgrades -portrait 3 "room freed checksred"
          films -portrait 3 "0.5 0.645" 0.5 "" full

          # 4. Open flat, the simulator's own size (951 x 669 pt): the drawn rail, two panes.
          $D "$DEVICE" rotate 3; sleep 5
          # First what main draws there (-systemTabs YES): the system's rail, for the record of how many it holds here.
          shot before-status-open 3 8 -tab 0 -systemTabs YES
          shot before-dash-open 3 8 -tab 6 -systemTabs YES
          tabs -open 3
          dashstates -open 3
          upgrades -open 3 "$UPGRADES"

          # 5. Open flat at HIS size: his screenshot of 2026-11-20 is 2576 x 1812 px, 859 x 604 pt at 3x, shorter than the
          # simulator's. The app's window is made that size (-windowSize). First the system's own rail at that size
          # (-systemTabs YES): if these two shots show four tabs and "•••" as his phone did, CI can see what he saw; if
          # they show six, the size alone is not the cause and these shots prove nothing about his phone (say so).
          shot before-status-his 3 8 -tab 0 -windowSize 859x604 -systemTabs YES
          shot before-dash-his 3 8 -tab 6 -windowSize 859x604 -systemTabs YES
          tabs -his 3 -windowSize 859x604
          shot dash-asleep-his 3 8 -tab 6 -pose consoleasleep -windowSize 859x604
          shot dash-unreachable-his 3 8 -tab 6 -pose unreachable -windowSize 859x604
          upgrades -his 3 "room freed checksred" -windowSize 859x604
          # Touches by place are in the display's fractions; the window is the top-left 0.9 of it.
          films -his 3 "0.72 0.28" 0.22 0.63 full -windowSize 859x604
          # Then the simulator's own size, briefly: the tab changes, Status and the Dashboard flung in each pane, push and Back.
          films -open 3 "0.81 0.28" 0.25 0.7 brief
          film dash-posture-open 3 4 "touch 0.81 0.28 0.05;rotate 1;rotate 3" -tab 6
          film upgrade-hold-open 3 3 "longpress upgrade.hold 0.6;longpress upgrade.hold 2.2" -tab 6 -pose upgrade-freed
          crashes
          # What the tab probe saw in every posture (one line per change of size).
          cp "$(xcrun simctl get_app_container "$DEVICE" local.macpro.MacPro data)/Library/Caches/tabs-log.txt" dist/tabs.log 2>/dev/null || echo "no tab log" > dist/tabs.log
          ls dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../shots.zip . -i '*.png' || zip -q ../shots.zip /dev/null)
          (cd dist && zip -qr0 ../films.zip . -i '*.mp4' || zip -q ../films.zip /dev/null)
          (cd dist && zip -qr ../logs.zip . -i '*.log' || zip -q ../logs.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view mp-nomore >/dev/null 2>&1 || gh release create mp-nomore --prerelease --title "Mac Pro folded tab bar shots" --notes "Temporary shots for the mp-nomore branch."
          for f in shots.zip films.zip logs.zip status.txt; do
            for i in 1 2 3; do gh release upload mp-nomore "$f" --clobber && break; sleep 15; done
          done
