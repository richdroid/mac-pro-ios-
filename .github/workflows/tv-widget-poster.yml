name: TV widget poster sheet
# Temporary, branch-only: the Continue on iPhone widget (TVWidget/PhoneWidget.swift) drawn at its real sizes, in each
# Home Screen look, by the TV gallery ("-sheets YES", ci/gallery-tv/PhoneSheets.swift), with the TV app built too so the
# widget extension compiles. Published to the tv-widget-poster release. Removed before merge.
on:
  push:
    branches: [tv-widget-poster]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-widget-poster
  cancel-in-progress: true
jobs:
  sheet:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p dist
          for APP in TV GalleryTV; do
            xcodebuild -project MacPro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a dist/build.log | tail -1
          done
      - name: Sheets
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          exec > >(tee dist/sim.log) 2>&1
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | (map(select(.name | test("Duo"))) + .)[0].udid')
          xcrun simctl list devices available | grep -m1 "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build-sim/Build/Products/Debug-iphonesimulator/GalleryTV.app
          node ci/mock-chumby.js &
          sleep 2
          # The gallery writes every sheet to its Documents/sheets and lists them on screen when done.
          xcrun simctl launch --console-pty "$DEVICE" local.macpro.GalleryTV -sheets YES > dist/gallery.log 2>&1 & G=$!
          for i in $(seq 1 60); do grep -q "sheets done" dist/gallery.log && break; sleep 2; done
          sleep 2
          xcrun simctl io "$DEVICE" screenshot dist/gallery-done.png
          kill $G 2>/dev/null
          C=$(xcrun simctl get_app_container "$DEVICE" local.macpro.GalleryTV data)
          cp "$C"/Documents/sheets/*.png dist/
          xcrun simctl terminate "$DEVICE" local.macpro.GalleryTV || true
          ls -la dist
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../sheets.zip . -i '*.png' '*.log' || zip -q ../sheets.zip /dev/null)
          echo "$GITHUB_SHA ${{ job.status }}" > status.txt
          gh release view tv-widget-poster >/dev/null 2>&1 || gh release create tv-widget-poster --prerelease --title "TV widget poster sheet" --notes "Temporary sheets for the tv-widget-poster branch: Continue on iPhone in every look."
          for f in sheets.zip status.txt dist/tv-phone-*.png; do
            [ -f "$f" ] || continue
            for i in 1 2 3; do gh release upload tv-widget-poster "$f" --clobber && break; sleep 15; done
          done
